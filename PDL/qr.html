<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de QR con Hora Simulada</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="auth.js"></script>
</head>
<body>
  <h1>Generador de QR - Hora Simulada</h1>
  <p id="estado-usuario">Estado del usuario: No autenticado</p>
  <p id="clase-actual">Clase actual: Ninguna</p>
  <p id="qr">Código QR: No generado</p>

  <script>
    // Función para obtener el ID del usuario después de un tiempo de espera
    function getCurrentUserId() {
      return new Promise((resolve, reject) => {
        const user = firebase.auth().currentUser;
        if (user) {
          resolve(user.uid);
        } else {
          reject('Usuario no autenticado');
        }
      });
    }

    // Función principal para buscar clase y generar QR
    async function buscarClaseYGenerarQR() {
      try {
        // Esperar hasta que el usuario esté autenticado
        const userId = await getCurrentUserId();
        const rolUsuario = await getUserRole(userId); // Obtener rol del usuario
        if (rolUsuario !== 'admin') {
          document.getElementById('estado-usuario').textContent = 'Estado del usuario: No autorizado';
          return;
        }

        document.getElementById('estado-usuario').textContent = `Estado del usuario: Autenticado (${rolUsuario})`;

        // Configurar hora simulada
        const horaSimulada = "1031"; // Modificar esta hora para pruebas (formato HHmm)

        // Simulación de día (puedes modificar el día para probar)
        const diaSimulado = "lunes";  // Cambiar aquí el día (ejemplo: "lunes", "martes", etc.)

        const claseActual = await obtenerClaseActual(userId, horaSimulada, diaSimulado);
        if (claseActual) {
          document.getElementById('clase-actual').textContent = `Clase actual: ${claseActual}`;
          generarQRCode(claseActual);
        } else {
          document.getElementById('clase-actual').textContent = 'Clase actual: Ninguna';
        }
      } catch (error) {
        console.error('Error al buscar la clase:', error);
        document.getElementById('estado-usuario').textContent = 'Estado del usuario: No autenticado';
      }
    }

    // Obtener la clase actual basada en la hora simulada y día simulado
    async function obtenerClaseActual(userId, horaSimulada, diaSimulado) {
      const db = firebase.database();
      const snapshot = await db.ref(`users/${userId}/horario`).once('value');
      const horario = snapshot.val();

      if (!horario) {
        console.warn('No se encontraron horarios en la base de datos.');
        return null;
      }

      console.log(`Día simulado: ${diaSimulado}, Hora simulada: ${horaSimulada}`);
      const clasesDia = horario[diaSimulado.charAt(0).toUpperCase() + diaSimulado.slice(1)];

      if (!clasesDia) return null;

      // Buscar clase en módulo correspondiente
      for (let inicioModulo in clasesDia) {
        const horaFinModulo = sumarMinutos(inicioModulo, 44);
        if (horaSimulada >= inicioModulo && horaSimulada <= horaFinModulo) {
          return clasesDia[inicioModulo];
        }
      }

      return null;
    }

    // Función para sumar minutos a una hora (formato HHmm)
    function sumarMinutos(hora, minutos) {
      let horas = parseInt(hora.substring(0, 2), 10);
      let mins = parseInt(hora.substring(2), 10);

      mins += minutos;
      if (mins >= 60) {
        horas += Math.floor(mins / 60);
        mins = mins % 60;
      }

      return `${horas.toString().padStart(2, '0')}${mins.toString().padStart(2, '0')}`;
    }

    // Generar QR
    function generarQRCode(texto) {
      const qrElement = document.getElementById('qr');
      qrElement.textContent = `Código QR generado: ${texto}`;
      // Aquí podrías integrar una biblioteca de generación de QR
    }

    // Llamar a la función al cargar la página
    window.onload = async function() {
      setTimeout(() => {
        buscarClaseYGenerarQR();
      }, 3000); // Retraso de 3 segundos para asegurar autenticación
    };
  </script>
</body>
</html>
