<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar QR de Clase</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script> <!-- Biblioteca para generar QR -->
</head>
<body>
    <h1>Generar QR para la Clase Actual</h1>
    <div id="qr-container">
        <p id="qr-info"></p>
        <canvas id="qr-code"></canvas>
    </div>
    <script>
        // Función principal para buscar la clase y generar el QR
        async function buscarClaseYGenerarQR() {
            try {
                // Obtener el usuario autenticado directamente desde Firebase
                const user = firebase.auth().currentUser;
                if (!user) {
                    document.getElementById('qr-info').textContent = 'No estás autenticado.';
                    return;
                }

                const userId = user.uid; // ID del usuario autenticado
                console.log("Buscando clases para el usuario:", userId);

                // Día y hora actuales (puedes simular o usar valores dinámicos)
                const diaActual = "Lunes"; // Simula un día (puedes ajustar)
                const horaActual = "1030"; // Simula una hora en formato de 24 horas sin ":"
                console.log("Día actual:", diaActual, ", Hora actual:", horaActual);

                // Referencia al horario del profesor en Firebase
                const dbRef = firebase.database().ref(`users/${userId}/horario`);
                const snapshot = await dbRef.get();

                if (!snapshot.exists()) {
                    document.getElementById('qr-info').textContent = "No se encontraron horarios en la base de datos.";
                    return;
                }

                const horario = snapshot.val();
                console.log("Horario obtenido:", horario);

                // Buscar la clase correspondiente al día y hora actuales
                const clasesDelDia = horario[diaActual];
                if (!clasesDelDia) {
                    document.getElementById('qr-info').textContent = `No hay clases programadas para ${diaActual}.`;
                    return;
                }

                const claseActual = clasesDelDia[horaActual];
                if (!claseActual || claseActual === "") {
                    document.getElementById('qr-info').textContent = "No hay clases programadas para este horario.";
                    return;
                }

                console.log("Clase encontrada:", claseActual);

                // Generar el QR con la información de la clase
                const qrData = {
                    profesorId: userId,
                    dia: diaActual,
                    hora: horaActual,
                    clase: claseActual,
                };

                generarCodigoQR(qrData);
                document.getElementById('qr-info').textContent = `Clase actual: ${claseActual}`;
            } catch (error) {
                console.error("Error al buscar la clase:", error);
                document.getElementById('qr-info').textContent = "Ocurrió un error al buscar la clase.";
            }
        }

        // Función para generar el QR
        function generarCodigoQR(data) {
            const canvas = document.getElementById("qr-code");
            QRCode.toCanvas(canvas, JSON.stringify(data), function (error) {
                if (error) console.error("Error al generar el QR:", error);
                console.log("Código QR generado exitosamente.");
            });
        }

        // Ejecutar la función al cargar la página
        buscarClaseYGenerarQR();
    </script>
</body>
</html>
