<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Código QR con Logo</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .qr-container {
            text-align: center;
            margin: 20px 0;
        }
        canvas {
            margin: 20px auto;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <header>
        <h1>Generar Código QR con Logo</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <form id="qrForm">
            <div class="form-group">
                <label for="startDate">Fecha de Inicio</label>
                <input type="date" id="startDate" required>
            </div>
            <div class="form-group">
                <label for="endDate">Fecha de Caducidad</label>
                <input type="date" id="endDate" required>
            </div>
            <div class="form-group">
                <label for="maxStudents">Máximo de Alumnos</label>
                <input type="number" id="maxStudents" min="1" required>
            </div>
            <div class="form-group">
                <label for="logo">Subir Logo (Opcional)</label>
                <input type="file" id="logo" accept="image/*">
            </div>
            <button type="button" onclick="generateQRCode()">Generar Código QR</button>
        </form>
        <div class="qr-container">
            <canvas id="qrCanvas" width="300" height="300"></canvas>
            <p id="qrLink"></p>
        </div>
    </main>

    <script>
        const firebaseConfig = { /* Configuración de tu Firebase */ };
        const app = firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const projectMainPage = "https://tuproyecto.github.io/"; // URL de tu página principal

        function generateQRCode() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const maxStudents = parseInt(document.getElementById('maxStudents').value, 10);
            const logoInput = document.getElementById('logo').files[0];

            if (!startDate || !endDate || !maxStudents) {
                alert("Por favor completa todos los campos.");
                return;
            }

            const qrData = {
                startDate,
                endDate,
                maxStudents,
                scannedCount: 0
            };

            // Guardar datos del QR en Firebase
            const qrRef = database.ref('attendanceQRs').push();
            qrRef.set(qrData);

            // Generar QR con enlace único
            const qrUrl = `${projectMainPage}?qrId=${qrRef.key}`;
            generateQRWithLogo(qrUrl, logoInput);

            document.getElementById('qrLink').innerText = `Enlace: ${qrUrl}`;
        }

        function generateQRWithLogo(url, logoFile) {
            const canvas = document.getElementById('qrCanvas');
            const qrCode = new QRCode(canvas, {
                text: url,
                width: 300,
                height: 300,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            // Agregar logo si se sube
            if (logoFile) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const ctx = canvas.getContext('2d');
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const logoSize = 50; // Tamaño del logo
                        const x = (canvas.width - logoSize) / 2;
                        const y = (canvas.height - logoSize) / 2;
                        ctx.drawImage(img, x, y, logoSize, logoSize);
                    };
                };
                reader.readAsDataURL(logoFile);
            }
        }
    </script>
</body>
</html>
