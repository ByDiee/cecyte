<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Código QR de Asistencia</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        #qrContainer {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Generar Código QR para Asistencia</h1>

    <div id="attendanceMessage"></div> <!-- Aquí se mostrará el mensaje de asistencia -->
    <div id="qrContainer"></div> <!-- Aquí se generará el código QR -->

    <script>
        // Simulación de la fecha y hora (comenta o descomenta para probar)
        const simulatedDate = new Date("2024-12-02T10:30:00"); // Puedes cambiar esta fecha y hora para simular diferentes casos
        // const simulatedDate = new Date("2024-12-02T11:15:00"); // Otro ejemplo de hora simulada

        // Descomenta para usar la hora actual en vez de la simulada
        // const simulatedDate = new Date();

        // Observar cambios en la autenticación del usuario
        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                console.log('Usuario autenticado:', user.uid);
                // Llamar a la función para obtener el horario
                getProfessorSchedule(user.uid, simulatedDate);
            } else {
                console.error('No hay usuario autenticado.');
                alert('Debes iniciar sesión para generar el QR.');
            }
        });

// Obtener el horario del profesor
function getProfessorSchedule(userId, currentTime) {
    const classRef = firebase.database().ref(`users/${userId}/horario`);
    const currentDay = currentTime.toLocaleString('es-ES', { weekday: 'long' }).toLowerCase(); // Día actual (lunes, martes, etc.)
    const currentHour = currentTime.getHours() * 100 + currentTime.getMinutes(); // Formato HHMM (por ejemplo 1030 para las 10:30)

    console.log(`Buscando clases para el usuario: ${userId}`);
    console.log(`Día actual: ${currentDay}, Hora actual: ${currentHour}`);

    classRef.once('value').then(snapshot => {
        let classData = snapshot.val();
        if (!classData) {
            console.error('No se encontraron horarios en la base de datos para este usuario.');
            alert('No se encontró un horario asociado a este usuario.');
            return;
        }

        console.log('Datos de horario obtenidos:', classData);

        let currentClass = null;

        // Buscar la clase correspondiente al día y hora actual
        if (classData[currentDay]) {
            console.log(`Horario del día ${currentDay}:`, classData[currentDay]);

            for (let hour in classData[currentDay]) {
                const hourInt = parseInt(hour); // Convertir la hora registrada a entero (ej. '1030' se convierte en 1030)
                
                // Mostrar en consola la comparación
                console.log(`Comparando hora actual ${currentHour} con la clase a las ${hourInt}:`);

                // Usar un rango de tiempo de ±45 minutos para buscar la clase
                if (hourInt <= currentHour && currentHour < hourInt + 45) {
                    currentClass = {
                        materia: classData[currentDay][hour],
                        hora: hour
                    };
                    break;
                }
            }
        }

        if (currentClass) {
            // Mostrar el mensaje de asistencia
            document.getElementById('attendanceMessage').innerHTML = 
                `Asistencia de ${currentClass.materia} a las ${currentClass.hora}`;

            console.log('Clase encontrada:', currentClass);

            // Generar el QR con la información de la clase
            generateQR(currentClass);
        } else {
            console.log('No se encontró clase para la hora actual.');
            alert('No hay clases programadas para este horario.');
        }
    }).catch(error => {
        console.error('Error al leer los datos de la base de datos:', error);
    });
}

        // Generar el código QR con los datos de la clase
        function generateQR(currentClass) {
            const qrData = JSON.stringify(currentClass); // Datos de la materia y la hora
            console.log('Generando QR con los siguientes datos:', qrData);
            QRCode.toCanvas(document.getElementById('qrContainer'), qrData, function (error) {
                if (error) {
                    console.error('Error al generar el código QR:', error);
                } else {
                    console.log('Código QR generado con éxito.');
                }
            });
        }

        // Función para registrar la asistencia cuando el alumno escanea el QR
        function registerAttendance(qrData, userId) {
            const currentDate = new Date().toISOString().split('T')[0]; // Fecha actual en formato "YYYY-MM-DD"
            const attendanceRef = firebase.database().ref(`attendance/${qrData.materia}/${currentDate}/${userId}`);

            // Verificar si el alumno ya registró asistencia
            attendanceRef.once('value').then(snapshot => {
                if (snapshot.exists()) {
                    alert("Ya registraste tu asistencia.");
                } else {
                    // Registrar asistencia
                    attendanceRef.set({
                        name: userId, // Suponiendo que el userId es el nombre del alumno (o puedes usar otro campo)
                        attended: true
                    }).then(() => {
                        alert("Asistencia registrada correctamente.");
                    }).catch(error => {
                        console.error('Error al registrar la asistencia:', error);
                    });
                }
            });
        }
    </script>
</body>
</html>
