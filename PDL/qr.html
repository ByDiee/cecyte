<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Código QR</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            background-color: #f4f4f9;
        }
        header {
            margin-bottom: 20px;
        }
        form {
            display: inline-block;
            text-align: left;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .qr-container {
            margin-top: 20px;
        }
        canvas {
            margin-top: 20px;
            border: 1px solid #ccc;
            background-color: #fff;
        }
        input, label, button {
            display: block;
            margin: 10px 0;
        }
        input {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <header>
        <h1>Generar Código QR Personalizado</h1>
    </header>
    <main>
        <form id="qrForm">
            <label for="startDate">Fecha de Inicio:</label>
            <input type="date" id="startDate" required>

            <label for="endDate">Fecha de Caducidad:</label>
            <input type="date" id="endDate" required>

            <label for="maxStudents">Máximo de Alumnos:</label>
            <input type="number" id="maxStudents" placeholder="Ej: 30" required>

            <label for="logo">Logo (opcional):</label>
            <input type="file" id="logo" accept="image/*">

            <button type="button" id="generateBtn">Generar Código QR</button>
        </form>
        <div class="qr-container">
            <canvas id="qrCanvas" width="300" height="300"></canvas>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script>
        const projectMainPage = "https://tuproyecto.github.io/";

        // Función para generar QR con opciones personalizadas
        async function generateQRCode() {
            const startDate = document.getElementById("startDate").value;
            const endDate = document.getElementById("endDate").value;
            const maxStudents = document.getElementById("maxStudents").value;
            const logoFile = document.getElementById("logo").files[0];

            if (!startDate || !endDate || !maxStudents) {
                alert("Por favor, completa todos los campos obligatorios.");
                return;
            }

            // Datos que estarán incluidos en el QR
            const qrData = {
                url: projectMainPage,
                startDate,
                endDate,
                maxStudents,
            };

            const qrCanvas = document.getElementById("qrCanvas");
            const qrCodeOptions = {
                text: JSON.stringify(qrData),
                width: 300,
                height: 300,
            };

            if (logoFile) {
                // Si se seleccionó un logo, lo incluimos en el QR
                const reader = new FileReader();
                reader.onload = async function (e) {
                    const logo = new Image();
                    logo.src = e.target.result;

                    logo.onload = async function () {
                        await drawQRCodeWithLogo(qrCanvas, qrCodeOptions, logo);
                        alert("QR generado con logo incluido.");
                    };
                };
                reader.readAsDataURL(logoFile);
            } else {
                // Si no hay logo, generamos el QR directamente
                QRCode.toCanvas(qrCanvas, JSON.stringify(qrData), qrCodeOptions, function (error) {
                    if (error) console.error(error);
                    alert("QR generado correctamente.");
                });
            }
        }

        // Función para dibujar el QR con un logo
        async function drawQRCodeWithLogo(canvas, options, logo) {
            // Generamos el QR en el canvas
            const qrCanvasTemp = document.createElement("canvas");
            qrCanvasTemp.width = options.width;
            qrCanvasTemp.height = options.height;

            await QRCode.toCanvas(qrCanvasTemp, options.text, {
                width: options.width,
                height: options.height,
            });

            const ctx = canvas.getContext("2d");
            ctx.drawImage(qrCanvasTemp, 0, 0);

            // Calculamos las dimensiones del logo (centrado)
            const logoSize = options.width * 0.2; // 20% del tamaño del QR
            const logoX = (options.width - logoSize) / 2;
            const logoY = (options.height - logoSize) / 2;

            ctx.drawImage(logo, logoX, logoY, logoSize, logoSize);
        }

        // Vincular la función al botón
        document.getElementById("generateBtn").addEventListener("click", generateQRCode);
    </script>
</body>
</html>
