<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar QR de Clase Simulada</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>
<body>
    <h1>Generar QR para Clase Simulada</h1>
    <div id="qr-container">
        <p id="qr-info"></p>
        <canvas id="qr-code"></canvas>
    </div>

    <script>
        // Módulos de tiempo en minutos
        const MODULOS = [
            { inicio: 420, fin: 464 }, // 07:00 - 07:44
            { inicio: 465, fin: 509 }, // 07:45 - 08:29
            { inicio: 510, fin: 554 }, // 08:30 - 09:14
            { inicio: 555, fin: 599 }, // 09:15 - 09:59
            { inicio: 630, fin: 674 }, // 10:30 - 11:14
            { inicio: 675, fin: 719 }, // 11:15 - 11:59
            { inicio: 720, fin: 764 }, // 12:00 - 12:44
            { inicio: 765, fin: 809 }, // 12:45 - 13:29
            { inicio: 810, fin: 854 }, // 13:30 - 14:14
            { inicio: 855, fin: 899 }, // 14:15 - 14:59
        ];

        // Función para convertir hora en formato HHMM a minutos desde la medianoche
        function horaEnMinutos(hora) {
            const horas = Math.floor(hora / 100);
            const minutos = hora % 100;
            return horas * 60 + minutos;
        }

        // Determina el módulo actual basado en la hora en minutos
        function obtenerModuloActual(horaEnMinutos) {
            for (let i = 0; i < MODULOS.length; i++) {
                const { inicio, fin } = MODULOS[i];
                if (horaEnMinutos >= inicio && horaEnMinutos <= fin) {
                    return i;
                }
            }
            return null; // No hay módulo válido
        }

        // Función principal para buscar la clase y generar el QR
        async function buscarClaseYGenerarQRSimulado(userId, diaSimulado, horaSimulada) {
            try {
                console.log("Buscando clases para el usuario:", userId);

                // Convertir hora simulada a minutos y determinar módulo
                const minutosActuales = horaEnMinutos(parseInt(horaSimulada));
                const moduloActual = obtenerModuloActual(minutosActuales);
                if (moduloActual === null) {
                    document.getElementById('qr-info').textContent = "No estás en un horario de clase.";
                    return;
                }

                // Obtener el horario del usuario desde Firebase
                const dbRef = firebase.database().ref(`users/${userId}/horario`);
                const snapshot = await dbRef.get();

                if (!snapshot.exists()) {
                    document.getElementById('qr-info').textContent = "No se encontraron horarios en la base de datos.";
                    return;
                }

                const horario = snapshot.val();
                console.log("Horario obtenido:", horario);

                // Normalizar el día simulado
                const diaNormalizado = diaSimulado.charAt(0).toUpperCase() + diaSimulado.slice(1);
                const clasesDelDia = horario[diaNormalizado];

                if (!clasesDelDia) {
                    document.getElementById('qr-info').textContent = `No hay clases programadas para ${diaSimulado}.`;
                    return;
                }

                // Buscar la clase para el módulo actual
                const horaInicioModulo = MODULOS[moduloActual].inicio;

                // Comparar flexible: Buscar la hora más cercana dentro del margen del módulo
                let claseActual = null;
                Object.keys(clasesDelDia).forEach(horaClave => {
                    const horaEnMinutosClave = horaEnMinutos(parseInt(horaClave));
                    if (
                        horaEnMinutosClave >= MODULOS[moduloActual].inicio &&
                        horaEnMinutosClave <= MODULOS[moduloActual].fin
                    ) {
                        claseActual = clasesDelDia[horaClave];
                    }
                });

                if (!claseActual) {
                    document.getElementById('qr-info').textContent = `No hay clases programadas para este horario (${horaInicioModulo}).`;
                    return;
                }

                console.log("Clase encontrada:", claseActual);

                // Generar el QR con la información de la clase
                const qrData = {
                    profesorId: userId,
                    dia: diaSimulado,
                    modulo: moduloActual,
                    clase: claseActual,
                };

                generarCodigoQR(qrData);
                document.getElementById('qr-info').textContent = `Clase simulada: ${claseActual}`;
            } catch (error) {
                console.error("Error al buscar la clase:", error);
                document.getElementById('qr-info').textContent = "Ocurrió un error al buscar la clase.";
            }
        }

        // Generar el QR con la información de la clase
        function generarCodigoQR(data) {
            const canvas = document.getElementById("qr-code");
            QRCode.toCanvas(canvas, JSON.stringify(data), function (error) {
                if (error) console.error("Error al generar el QR:", error);
                console.log("Código QR generado exitosamente.");
            });
        }

        // Simulación: día y hora
        const diaSimulado = "martes"; // Cambia esto para simular otro día
        const horaSimulada = "0915";  // Cambia esto para simular otra hora

        // Ejecutar la búsqueda con datos simulados
        firebase.auth().onAuthStateChanged(async (user) => {
            if (user) {
                console.log("Usuario autenticado:", user.uid);
                await buscarClaseYGenerarQRSimulado(user.uid, diaSimulado, horaSimulada);
            } else {
                console.log("No estás autenticado.");
                document.getElementById("qr-info").textContent = "No estás autenticado. Por favor, inicia sesión.";
            }
        });
    </script>
</body>
</html>
