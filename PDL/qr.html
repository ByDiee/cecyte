<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Código QR de Asistencia</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        #qrContainer {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Generar Código QR para Asistencia</h1>

    <div id="attendanceMessage"></div> <!-- Aquí se mostrará el mensaje de asistencia -->
    <div id="qrContainer"></div> <!-- Aquí se generará el código QR -->

    <script>
        // Obtener el horario del profesor
        function getProfessorSchedule() {
            const currentUser = firebase.auth().currentUser;
            if (!currentUser) {
                console.error('No hay usuario autenticado.');
                return;
            }

            const userId = currentUser.uid;
            const classRef = firebase.database().ref(`users/${userId}/classSchedules`);
            const currentTime = new Date();
            const currentDay = currentTime.toLocaleString('es-ES', { weekday: 'long' }).toLowerCase();
            const currentHour = currentTime.getHours() * 100 + currentTime.getMinutes();

            console.log(`Buscando clases para el usuario: ${userId}`);
            console.log(`Día actual: ${currentDay}, Hora actual: ${currentHour}`);

            classRef.once('value').then(snapshot => {
                let classData = snapshot.val();
                if (!classData) {
                    console.error('No se encontraron horarios en la base de datos para este usuario.');
                    return;
                }

                console.log('Datos de horario obtenidos:', classData);

                let currentClass = null;

                // Buscar la materia, grado y grupo correspondiente a la hora actual
                for (let semester in classData) {
                    for (let group in classData[semester]) {
                        const daySchedule = classData[semester][group][currentDay];
                        console.log(`Horario para el grupo ${group} en el semestre ${semester}:`, daySchedule);

                        for (let hour in daySchedule) {
                            if (parseInt(hour) <= currentHour && parseInt(hour) + 45 > currentHour) {
                                currentClass = {
                                    materia: daySchedule[hour],
                                    semestre: semester,
                                    grupo: group,
                                    hora: hour
                                };
                                break;
                            }
                        }
                        if (currentClass) break;
                    }
                    if (currentClass) break;
                }

                if (currentClass) {
                    // Mostrar el mensaje de asistencia
                    document.getElementById('attendanceMessage').innerHTML = 
                        `Asistencia de ${currentClass.materia} del grado ${currentClass.semestre} grupo ${currentClass.grupo}`;
                    
                    console.log('Clase encontrada:', currentClass);

                    // Generar el QR con la información de la clase
                    generateQR(currentClass);
                } else {
                    console.log('No se encontró clase para la hora actual.');
                    alert('No hay clases programadas para este horario.');
                }
            }).catch(error => {
                console.error('Error al leer los datos de la base de datos:', error);
            });
        }

        // Generar el código QR con los datos de la clase
        function generateQR(currentClass) {
            const qrData = JSON.stringify(currentClass); // Datos de la materia, grupo y semestre
            console.log('Generando QR con los siguientes datos:', qrData);
            QRCode.toCanvas(document.getElementById('qrContainer'), qrData, function (error) {
                if (error) {
                    console.error('Error al generar el código QR:', error);
                } else {
                    console.log('Código QR generado con éxito.');
                }
            });
        }

        // Iniciar la generación del código QR
        getProfessorSchedule();
    </script>
</body>
</html>
