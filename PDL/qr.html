<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario de Clase</title>
</head>
<body>
    <h1>Materia Actual</h1>
    <p id="materia">Cargando...</p>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <script>

        // Función para obtener el horario del profesor, la materia, y su grado/grupo desde Firebase
        function getMateriaYHorario() {
            // Obtener el ID del usuario (profesor)
            const userId = firebase.auth().currentUser.uid;  // Asumiendo que el usuario ya está autenticado

            // Obtener la hora actual
            const currentDate = new Date();
            const dayOfWeek = currentDate.toLocaleString('es-ES', { weekday: 'long' }).toUpperCase(); // Lunes, Martes, etc.
            const currentTime = currentDate.getHours() * 100 + currentDate.getMinutes();  // Formato de hora en 24h, ej: 1130 para 11:30 AM

            // Obtener el horario de clases del profesor desde Firebase
            const userScheduleRef = database.ref(`users/${userId}/horario/${dayOfWeek}`);

            userScheduleRef.once('value').then(snapshot => {
                const schedule = snapshot.val();

                if (schedule) {
                    let materia = '';
                    for (let time in schedule) {
                        if (parseInt(time) <= currentTime && schedule[time] !== "") {
                            materia = schedule[time];  // Encontramos la materia actual
                            break;
                        }
                    }

                    if (materia) {
                        // Buscar el grado y grupo en la base de datos de clases
                        const classRef = database.ref('classSchedules');
                        
                        classRef.once('value').then(snapshot => {
                            snapshot.forEach(gradeSnapshot => {
                                gradeSnapshot.forEach(groupSnapshot => {
                                    groupSnapshot.forEach(daySnapshot => {
                                        daySnapshot.forEach(timeSnapshot => {
                                            if (timeSnapshot.val() === materia) {
                                                // Cuando encontramos la materia, obtenemos el grado y grupo
                                                const grade = gradeSnapshot.key;  // Ejemplo: "1", "2", etc.
                                                const group = groupSnapshot.key;  // Ejemplo: "A", "B", etc.
                                                
                                                // Mostrar la materia y los detalles en el HTML y consola
                                                document.getElementById("materia").innerText = `Materia: ${materia}`;
                                                console.log(`Materia: ${materia}`);
                                                console.log(`Grado: ${grade}`);
                                                console.log(`Grupo: ${group}`);
                                                console.log(`Día: ${dayOfWeek}`);
                                                console.log(`Hora: ${currentTime}`);
                                                return;  // Ya encontramos la materia, grado y grupo, salimos
                                            }
                                        });
                                    });
                                });
                            });
                        });
                    } else {
                        console.log("No hay materia actual para el horario.");
                        document.getElementById("materia").innerText = "Materia no encontrada para el horario actual";
                    }
                }
            }).catch(error => {
                console.error("Error al acceder al horario del profesor:", error);
            });
        }

        // Llamamos a la función para obtener la materia y sus detalles
        getMateriaYHorario();
    </script>
</body>
</html>
