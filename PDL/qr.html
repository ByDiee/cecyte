<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        #qrcode {
            margin: 20px auto;
            text-align: center;
        }
        #attendanceMessage {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Generador de Código QR</h1>
    <div id="attendanceMessage">Buscando clase actual...</div>
    <div id="qrcode"></div>
    <script>
        // Inicializa Firebase (usar configuración en auth.js)

        // Simulación de día y hora para pruebas
        const simulateDay = "lunes"; // Cambiar a otro día: lunes, martes, etc.
        const simulateHour = 1030; // Cambiar a otra hora: 0830, 1115, etc.

        // Función principal para obtener el horario y generar el QR
        function getProfessorSchedule(userId) {
            const classRef = firebase.database().ref(`users/${userId}/horario`);

            // Usar simulación para pruebas o datos reales
            const currentDay = simulateDay.toLowerCase(); // Día simulado
            const currentHour = simulateHour; // Hora simulada en formato HHMM

            console.log(`Buscando clases para el usuario: ${userId}`);
            console.log(`Día actual: ${currentDay}, Hora actual: ${currentHour}`);

            classRef.once('value').then(snapshot => {
                const classData = snapshot.val();
                if (!classData) {
                    console.error('No se encontraron horarios en la base de datos para este usuario.');
                    alert('No se encontró un horario asociado a este usuario.');
                    return;
                }

                console.log('Datos de horario obtenidos:', classData);

                let currentClass = null;

                // Verificar si hay clase en el día actual
                if (classData[currentDay]) {
                    console.log(`Horario del día ${currentDay}:`, classData[currentDay]);

                    // Comprobar si existe una clase a la hora exacta
                    if (classData[currentDay][currentHour]) {
                        currentClass = {
                            materia: classData[currentDay][currentHour],
                            hora: currentHour
                        };
                    }
                }

                if (currentClass) {
                    console.log('Clase encontrada:', currentClass);
                    // Mostrar el mensaje de la clase actual
                    document.getElementById('attendanceMessage').innerHTML = 
                        `Asistencia de la clase: ${currentClass.materia} a las ${formatTime(currentClass.hora)}`;

                    // Generar el QR con la información de la clase
                    generateQR(currentClass, userId, currentDay);
                } else {
                    console.log('No se encontró clase para la hora actual.');
                    alert('No hay clases programadas para este horario.');
                }
            }).catch(error => {
                console.error('Error al leer los datos de la base de datos:', error);
            });
        }

        // Función para generar el QR con la información de la clase
        function generateQR(classInfo, userId, day) {
            const qrData = {
                profesorId: userId,
                materia: classInfo.materia,
                hora: classInfo.hora,
                dia: day
            };

            // Generar el QR
            const qrcodeElement = document.getElementById('qrcode');
            qrcodeElement.innerHTML = ""; // Limpiar cualquier QR previo
            new QRCode(qrcodeElement, {
                text: JSON.stringify(qrData),
                width: 256,
                height: 256,
            });

            console.log('QR generado con los datos:', qrData);

            // Registrar la asistencia en Firebase cuando el QR sea escaneado
            setupAttendance(qrData);
        }

        // Función para registrar la asistencia en Firebase
        function setupAttendance(qrData) {
            const attendanceRef = firebase.database().ref(`attendance/${qrData.dia}/${qrData.materia}`);
            attendanceRef.once('value').then(snapshot => {
                if (!snapshot.exists()) {
                    // Crear un registro vacío si no existe
                    attendanceRef.set({
                        createdAt: new Date().toISOString(),
                        estudiantes: {}
                    });
                    console.log('Registro de asistencia creado.');
                } else {
                    console.log('El registro de asistencia ya existe.');
                }
            });
        }

        // Función para formatear la hora (de 1030 a 10:30)
        function formatTime(hour) {
            const hours = Math.floor(hour / 100);
            const minutes = hour % 100;
            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
        }

        // Obtener el ID del usuario autenticado
        const userId = "ICFZFW6trcVIVRC378DlNVK0B1r2"; // Reemplazar con el ID real del usuario autenticado
        getProfessorSchedule(userId);
    </script>
</body>
</html>
