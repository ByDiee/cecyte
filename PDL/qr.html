<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generar y escanear QR de Asistencia</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.6.1/firebase-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.6.1/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
  <script src="https://unpkg.com/jsqr/dist/jsQR.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
</head>
<body>

  <h2>Generar QR para Asistencia</h2>
  
  <!-- Sección para generar QR -->
  <div>
    <button onclick="generateQR()">Generar QR</button>
  </div>

  <h3>QR Generado</h3>
  <div id="qrContainer"></div>

  <h2>Escanear QR (para estudiantes)</h2>
  
  <!-- Sección para escanear el QR -->
  <video id="scanner" width="300" height="300" style="border: 1px solid #000;"></video>
  <p id="scannedResult">Escanee un QR</p>

  <h3>Información de la clase</h3>
  <p id="classInfo"></p>

  <script>

    // Obtener la información del horario del profesor
    function getProfessorSchedule() {
      const currentUser = firebase.auth().currentUser;
      if (!currentUser) return;

      const userId = currentUser.uid;
      const classRef = firebase.database().ref(`users/${userId}/classSchedules`);
      const currentTime = new Date();
      const currentDay = currentTime.toLocaleString('es-ES', { weekday: 'long' }).toLowerCase();
      const currentHour = currentTime.getHours() * 100 + currentTime.getMinutes();

      classRef.once('value').then(snapshot => {
        let classData = snapshot.val();
        let currentClass = null;
        
        // Buscar la materia correspondiente a la hora actual
        for (let semester in classData) {
          for (let group in classData[semester]) {
            const daySchedule = classData[semester][group][currentDay];
            for (let hour in daySchedule) {
              if (parseInt(hour) <= currentHour && parseInt(hour) + 45 > currentHour) { // Asumiendo clases de 45 minutos
                currentClass = {
                  materia: daySchedule[hour],
                  semestre: semester,
                  grupo: group,
                  hora: hour
                };
                break;
              }
            }
            if (currentClass) break;
          }
          if (currentClass) break;
        }

        if (currentClass) {
          document.getElementById('classInfo').innerHTML = `Materia: ${currentClass.materia}<br>Semestre: ${currentClass.semestre}<br>Grupo: ${currentClass.grupo}`;
          generateQR(currentClass); // Generar el QR automáticamente con esta clase
        } else {
          document.getElementById('classInfo').innerText = "No hay clases programadas para este horario.";
        }
      });
    }

    // Función para generar QR con los datos del horario
    function generateQR(currentClass) {
      const qrData = JSON.stringify(currentClass); // Datos de la materia, grupo y semestre
      QRCode.toCanvas(document.getElementById('qrContainer'), qrData, function (error) {
        if (error) console.error(error);
      });
    }

    // Configuración para escanear QR
    const videoElement = document.getElementById('scanner');
    const scannedResult = document.getElementById('scannedResult');
    
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => {
        videoElement.srcObject = stream;
        videoElement.setAttribute("playsinline", true);
        videoElement.play();
        requestAnimationFrame(scanQRCode);
      });

    function scanQRCode() {
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");
      canvas.height = videoElement.videoHeight;
      canvas.width = videoElement.videoWidth;
      context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
      
      const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
      const qrCode = jsQR(imageData.data, canvas.width, canvas.height);

      if (qrCode) {
        const qrData = JSON.parse(qrCode.data);
        scannedResult.innerText = `QR Escaneado: Materia: ${qrData.materia}, Grupo: ${qrData.grupo}, Semestre: ${qrData.semestre}, Hora: ${qrData.hora}`;
        
        // Registrar asistencia en Firebase
        registerAttendance(qrData);
      } else {
        scannedResult.innerText = "Escaneando QR...";
        requestAnimationFrame(scanQRCode);
      }
    }

    // Función para registrar asistencia en Firebase
    function registerAttendance(qrData) {
      const currentUser = firebase.auth().currentUser;
      if (!currentUser) return;

      const userId = currentUser.uid;
      const userName = currentUser.displayName || "Alumno sin nombre";
      const currentDate = new Date();
      const currentDay = currentDate.toLocaleString('es-ES', { weekday: 'long' }).toLowerCase();
      const dateString = currentDate.toISOString().split('T')[0];

      const attendanceRef = firebase.database().ref(`attendances/${qrData.semestre}/${qrData.grupo}/${currentDay}`);
      attendanceRef.child(dateString).child("students").child(userId).set({
        name: userName,
        present: true
      }).then(() => {
        alert("Asistencia registrada correctamente");
        showNotification('Asistencia registrada', '¡Tu asistencia fue registrada correctamente!');
      });
    }

    // Función para mostrar notificación
    function showNotification(title, message) {
      if (Notification.permission === "granted") {
        new Notification(title, {
          body: message,
          icon: 'icon.png'
        });
      } else {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            new Notification(title, {
              body: message,
              icon: 'icon.png'
            });
          }
        });
      }
    }

    // Llamar a la función para obtener el horario del profesor
    getProfessorSchedule();

  </script>
</body>
</html>
