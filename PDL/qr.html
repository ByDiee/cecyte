<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generar QR de Asistencia</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="auth.js"></script>
</head>
<body>
  <h1>Generar QR de Asistencia</h1>
  <button id="generateQR">Generar QR</button>
  <div id="qrContainer"></div>

  <script>
    // Firebase config y referencia a la base de datos ya configurados en auth.js

    async function getCurrentClassAndGroup() {
      const db = firebase.database();
      const auth = firebase.auth();

      // Obtener usuario actual
      const user = auth.currentUser;
      if (!user) {
        alert("Inicia sesión para continuar");
        return;
      }

      const userId = user.uid;

      // Obtener datos del horario del maestro
      const userSnapshot = await db.ref(`users/${userId}`).once("value");
      const userData = userSnapshot.val();

      if (!userData.horario) {
        alert("No tienes horario registrado.");
        return;
      }

      const horario = userData.horario;

      // Obtener el día y hora actual
      const now = new Date();
      const currentDay = [
        "Domingo",
        "Lunes",
        "Martes",
        "Miercoles",
        "Jueves",
        "Viernes",
        "Sábado",
      ][now.getDay()];
      const currentTime =
        String(now.getHours()).padStart(2, "0") +
        String(now.getMinutes()).padStart(2, "0");

      // Obtener la materia actual según el horario del maestro
      const currentClass = horario[currentDay]?.[currentTime];

      if (!currentClass) {
        alert("No tienes clases programadas en este momento.");
        return;
      }

      // Buscar grado y grupo que tienen esta materia en la base de datos
      const classSchedulesSnapshot = await db.ref("classSchedules").once("value");
      const classSchedules = classSchedulesSnapshot.val();

      let foundGroup = null;
      let foundGrade = null;

      for (const [grade, groups] of Object.entries(classSchedules)) {
        for (const [group, schedule] of Object.entries(groups)) {
          const groupSchedule = schedule[currentDay];
          if (groupSchedule && groupSchedule[currentTime] === currentClass) {
            foundGrade = grade;
            foundGroup = group;
            break;
          }
        }
        if (foundGroup && foundGrade) break;
      }

      if (!foundGroup || !foundGrade) {
        alert("No se encontró un grado y grupo para la materia actual.");
        return;
      }

      return {
        materia: currentClass,
        dia: currentDay,
        hora: currentTime,
        grado: foundGrade,
        grupo: foundGroup,
      };
    }

    async function generateQR() {
      const classInfo = await getCurrentClassAndGroup();
      if (!classInfo) return;

      // Crear el contenido del QR
      const qrData = JSON.stringify(classInfo);
      console.log("QR Data:", qrData);

      // Generar el QR
      const qrContainer = document.getElementById("qrContainer");
      qrContainer.innerHTML = ""; // Limpiar cualquier QR previo
      QRCode.toCanvas(
        qrContainer,
        qrData,
        { width: 256 },
        (error) => {
          if (error) console.error(error);
        }
      );
    }

    // Evento al hacer clic en el botón
    document.getElementById("generateQR").addEventListener("click", generateQR);
  </script>
</body>
</html>
