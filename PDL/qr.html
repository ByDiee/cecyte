<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de QR para Asistencias</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/umd/qrious.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="auth.js"></script>
</head>
<body>
  <h1>Generador de QR para Asistencias</h1>
  <canvas id="qr-code"></canvas>
  <script>
    const firebaseDatabase = firebase.database();

    // Simulación de fecha y hora (para pruebas)
    const simulatedDate = new Date('2024-12-04T11:20:00'); // Cambiar según pruebas
    const currentDay = simulatedDate.toLocaleString('es-MX', { weekday: 'long' }).toLowerCase();
    const currentTime = simulatedDate.toTimeString().substring(0, 5).replace(':', '');

    // Configuración de horarios
    const horarioInicio = 700; // 07:00
    const horarioFin = 1500;  // 15:00
    const moduloDuracion = 44; // Duración de cada módulo en minutos
    const recesoInicio = 1000; // 10:00
    const recesoFin = 1029;    // 10:30
    const diasHabiles = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes'];

    // Verificar si es día hábil
    if (!diasHabiles.includes(currentDay)) {
      console.error('No hay clases los fines de semana.');
      return;
    }

    // Verificar si es horario válido
    if (currentTime >= recesoInicio && currentTime < recesoFin) {
      console.error('Es hora de receso, no hay clases.');
      return;
    }

    if (currentTime < horarioInicio || currentTime >= horarioFin) {
      console.error('Fuera del horario escolar.');
      return;
    }

    // Calcular la hora del módulo
    const calcularModulo = (hora) => {
      const inicioMinutos = Math.floor(hora / 100) * 60 + (hora % 100);
      const diferencia = Math.floor((simulatedDate.getHours() * 60 + simulatedDate.getMinutes() - inicioMinutos) / moduloDuracion);
      return inicioMinutos + diferencia * moduloDuracion;
    };

    const horaModulo = calcularModulo(horarioInicio);
    const horaClave = String(horaModulo).padStart(4, '0');

    // Identificar la materia actual del maestro
    firebase.auth().onAuthStateChanged(async (user) => {
      if (user) {
        const userId = user.uid;
        const userRef = firebaseDatabase.ref(`users/${userId}`);
        const snapshot = await userRef.once('value');
        const userData = snapshot.val();

        if (!userData || !userData.horario || !userData.horario[currentDay] || !userData.horario[currentDay][horaClave]) {
          console.error('No se encontró la materia en el horario del maestro.');
          return;
        }

        const materia = userData.horario[currentDay][horaClave];
        if (!materia) {
          console.error('No hay materia asignada en esta hora.');
          return;
        }

        // Buscar el grupo y grado que corresponde a la materia
        const classSchedulesRef = firebaseDatabase.ref('classSchedules');
        const classSchedulesSnapshot = await classSchedulesRef.once('value');
        const classSchedules = classSchedulesSnapshot.val();

        let grado = null;
        let grupo = null;

        outerLoop:
        for (const nivel in classSchedules) {
          for (const grupoKey in classSchedules[nivel]) {
            const diaHorario = classSchedules[nivel][grupoKey][currentDay];
            if (diaHorario && diaHorario[horaClave] === materia) {
              grado = nivel;
              grupo = grupoKey;
              break outerLoop;
            }
          }
        }

        if (!grado || !grupo) {
          console.error('No se encontró un grado y grupo que coincida con la materia.');
          return;
        }

        // Generar el contenido del QR
        const qrData = {
          materia,
          dia: currentDay,
          hora: horaClave,
          grado,
          grupo,
        };

        // Generar código QR
        const qrCode = new QRious({
          element: document.getElementById('qr-code'),
          size: 250,
          value: JSON.stringify(qrData),
        });

        console.log('QR generado con éxito:', qrData);
      } else {
        console.error('Usuario no autenticado.');
      }
    });
  </script>
</body>
</html>
