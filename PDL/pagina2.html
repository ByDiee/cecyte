<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero del Alumno</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        /* Estilos aquí */
    </style>
</head>
<body>
    <header>
        <h1>Tablero del Alumno</h1>
    </header>
    <nav>
        <a href="perfilalu.html" id="editProfileBtn">Editar Perfil</a>
        <a href="#" id="viewAttendanceBtn">Registro de Asistencias</a>
    </nav>
    <main>
        <div class="schedule">
            <h3>Horario</h3>
            <table class="schedule-table" id="scheduleTable">
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Lunes</th>
                        <th>Martes</th>
                        <th>Miércoles</th>
                        <th>Jueves</th>
                        <th>Viernes</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Aquí se llenará el horario dinámicamente -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const database = firebase.database();
            
            // Asegurarse de que el usuario esté autenticado antes de intentar acceder a su UID
            firebase.auth().onAuthStateChanged(function(user) {
                if (user) {
                    const userId = user.uid;  // Ahora 'user' es no nulo, y podemos acceder a 'uid'
                    console.log("Usuario ID:", userId); // Verificación de usuario
                    fetchStudentSchedule(userId);
                } else {
                    console.error('Usuario no autenticado'); // Aquí no se redirige, pero muestra el error
                    // Opcional: Manejar el caso cuando no hay usuario autenticado si es necesario
                }
            });

            // Función para obtener y mostrar el horario del alumno
            function fetchStudentSchedule(userId) {
                const userRef = database.ref(`users/${userId}`);
                
                userRef.once('value').then(snapshot => {
                    const userData = snapshot.val();
                    console.log('Datos del usuario:', userData);  // Verifica que los datos del usuario estén correctos
                    const semester = userData.semester;  // Ejemplo: '1'
                    const group = userData.group;  // Ejemplo: 'A'

                    // Verifica si el semestre y grupo existen
                    if (!semester || !group) {
                        console.error('Semestre o grupo no encontrados en los datos del usuario');
                        return;
                    }

                    // Acceder a los horarios del semestre y grupo correspondiente
                    const scheduleRef = database.ref(`classSchedules/${semester}/${group}`);
                    
                    scheduleRef.once('value').then(snapshot => {
                        const schedule = snapshot.val();
                        console.log('Horario obtenido:', schedule);  // Verifica los datos del horario

                        // Verifica si el horario existe
                        if (!schedule) {
                            console.error('No se encontró el horario para el semestre y grupo especificados');
                            return;
                        }

                        const scheduleTableBody = document.getElementById('scheduleTable').getElementsByTagName('tbody')[0];
                        scheduleTableBody.innerHTML = '';  // Limpiar la tabla antes de llenarla

                        const times = ["0700", "0745", "0830", "0915", "1000", "1030", "1115", "1200", "1245", "1330", "1415", "1500"];
                        const days = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];

                        // Crear las filas para cada hora
                        for (const time of times) {
                            const row = document.createElement('tr');
                            const timeCell = document.createElement('th');
                            timeCell.textContent = `${time.substring(0, 2)}:${time.substring(2)}`;
                            row.appendChild(timeCell);

                            // Crear las celdas para cada día
                            for (const day of days) {
                                const cell = document.createElement('td');
                                const subject = schedule && schedule[day] && schedule[day][time];
                                if (subject) {
                                    cell.textContent = subject;
                                } else {
                                    cell.textContent = '';  // Si no hay materia, dejar vacío
                                }
                                row.appendChild(cell);
                            }
                            scheduleTableBody.appendChild(row);
                        }
                    }).catch(error => {
                        console.error('Error al obtener el horario:', error);
                    });
                }).catch(error => {
                    console.error('Error al obtener los datos del alumno:', error);
                });
            }
        });
    </script>
</body>
</html>
