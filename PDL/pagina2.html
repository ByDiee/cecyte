<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero del Alumno</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .schedule-table th, .schedule-table td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        .schedule-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .schedule-table td {
            background-color: #ffffff;
            color: #000000;
        }
        .schedule-table tr:nth-child(odd) td {
            background-color: #f9f9f9;
        }
        .schedule-table td.highlight {
            background-color: #ffcccc; 
            color: #ff0000; 
        }
        .schedule-table td.current {
            background-color: #c3f9c3; 
            color: #14c614; 
        }
    </style>
</head>
<body>
    <header>
        <h1>Tablero del Alumno</h1>
    </header>
    <nav>
        <a href="perfilalu.html" id="editProfileBtn">Editar Perfil</a>
        <a href="#" id="viewAttendanceBtn">Registro de Asistencias</a>
    </nav>
    <main>
        <div class="schedule">
            <h3>Horario</h3>
            <table class="schedule-table" id="scheduleTable">
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Lunes</th>
                        <th>Martes</th>
                        <th>Miércoles</th>
                        <th>Jueves</th>
                        <th>Viernes</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Aquí se llenará el horario dinámicamente -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const database = firebase.database();
            
            // Esperar hasta que el usuario esté autenticado
            firebase.auth().onAuthStateChanged(function(user) {
                if (user) {
                    const userId = user.uid;  // Ahora 'user' es no nulo, y podemos acceder a 'uid'
                    fetchStudentSchedule(userId);
                } else {
                    // Si no hay usuario autenticado, redirigir al login
                    window.location.href = 'login.html';
                }
            });

            // Función para obtener y mostrar el horario del alumno
            function fetchStudentSchedule(userId) {
                const userRef = database.ref(`users/${userId}`);
                
                userRef.once('value').then(snapshot => {
                    const userData = snapshot.val();
                    const semester = userData.semester;  // Ejemplo: '1'
                    const group = userData.group;  // Ejemplo: 'A'

                    // Acceder a los horarios del semestre y grupo correspondiente
                    const scheduleRef = database.ref(`classSchedules/${semester}/${group}`);
                    
                    scheduleRef.once('value').then(snapshot => {
                        const schedule = snapshot.val();
                        const scheduleTableBody = document.getElementById('scheduleTable').getElementsByTagName('tbody')[0];
                        scheduleTableBody.innerHTML = '';  // Limpiar la tabla antes de llenarla

                        const times = ["0700", "0745", "0830", "0915", "1000", "1030", "1115", "1200", "1245", "1330", "1415", "1500"];
                        const days = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];

                        // Crear las filas para cada hora
                        for (const time of times) {
                            const row = document.createElement('tr');
                            const timeCell = document.createElement('th');
                            timeCell.textContent = `${time.substring(0, 2)}:${time.substring(2)}`;
                            row.appendChild(timeCell);

                            // Crear las celdas para cada día
                            for (const day of days) {
                                const cell = document.createElement('td');
                                const subject = schedule && schedule[day] && schedule[day][time];
                                if (subject) {
                                    cell.textContent = subject;
                                }
                                row.appendChild(cell);
                            }
                            scheduleTableBody.appendChild(row);
                        }
                    }).catch(error => {
                        console.error('Error al obtener el horario:', error);
                    });
                }).catch(error => {
                    console.error('Error al obtener los datos del alumno:', error);
                });
            }
        });
    </script>
</body>
</html>
