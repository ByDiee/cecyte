<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <title>Gestión de Asesorías</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
            color: #333;
        }
        td.occupied {
            background-color: #f44336; /* Rojo */
            color: white;
            pointer-events: none;
        }
        td.selected {
            background-color: #4caf50; /* Verde */
            color: white;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <header>
        <h1>Gestión de Asesorías</h1>
    </header>
    <main>
        <table id="schedule-table">
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                </tr>
            </thead>
            <tbody>
                <!-- Filas y columnas generadas dinámicamente -->
            </tbody>
        </table>
        <button id="confirm-button" disabled>Confirmar Asesorías</button>
    </main>

    <script>
        const tableBody = document.querySelector('#schedule-table tbody');
        const confirmButton = document.getElementById('confirm-button');
        let selectedCells = [];

        const hours = [
            '07:00', '07:45', '08:30', '09:15', '10:30',
            '11:15', '12:00', '12:45', '13:30', '14:15'
        ];
        const days = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];

        // Generar tabla
        function createTable() {
            hours.forEach(hour => {
                const row = document.createElement('tr');
                const timeCell = document.createElement('td');
                timeCell.textContent = hour;
                row.appendChild(timeCell);

                days.forEach(day => {
                    const cell = document.createElement('td');
                    cell.dataset.day = day;
                    cell.dataset.hour = hour;

                    // Selección de celdas
                    cell.addEventListener('click', () => {
                        if (!cell.classList.contains('occupied')) {
                            if (cell.classList.contains('selected')) {
                                cell.classList.remove('selected');
                                selectedCells = selectedCells.filter(
                                    selected => !(selected.day === day && selected.hour === hour)
                                );
                            } else {
                                cell.classList.add('selected');
                                selectedCells.push({ day, hour });
                            }

                            confirmButton.disabled = selectedCells.length === 0;
                        }
                    });

                    row.appendChild(cell);
                });

                tableBody.appendChild(row);
            });
        }

        // Cargar clases ocupadas desde Firebase
        function loadOccupiedSchedule() {
            auth.onAuthStateChanged(user => {
                if (user) {
                    const scheduleRef = database.ref(`users/${user.uid}/horario`);
                    scheduleRef.once('value').then(snapshot => {
                        if (snapshot.exists()) {
                            const schedule = snapshot.val();

                            // Recorrer horarios ocupados y marcarlos
                            for (const day in schedule) {
                                for (const hour in schedule[day]) {
                                    if (schedule[day][hour]) {
                                        const cell = document.querySelector(
                                            `td[data-day="${day}"][data-hour="${hour}"]`
                                        );
                                        if (cell) cell.classList.add('occupied');
                                    }
                                }
                            }
                        }
                    });
                }
            });
        }

        // Guardar asesorías seleccionadas en Firebase
        confirmButton.addEventListener('click', () => {
            auth.onAuthStateChanged(user => {
                if (user) {
                    const updates = {};
                    selectedCells.forEach(({ day, hour }) => {
                        updates[`${day}/${hour}`] = 'Asesorías';
                    });

                    const scheduleRef = database.ref(`users/${user.uid}/horario`);
                    scheduleRef.update(updates)
                        .then(() => {
                            alert('Asesorías guardadas correctamente');
                            location.reload();
                        })
                        .catch(error => console.error('Error al guardar asesorías:', error));
                }
            });
        });

        // Inicializar tabla
        createTable();
        loadOccupiedSchedule();
    </script>
</body>
</html>
