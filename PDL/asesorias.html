<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignar Asesorías</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .schedule-table th, .schedule-table td {
            border: 1px solid #cccccc;
            padding: 8px;
            text-align: center;
            cursor: pointer;
        }

        .schedule-table th {
            background-color: #f2f2f2;
        }

        .occupied {
            background-color: #ff4d4d;
            color: white;
            cursor: not-allowed;
        }

        .selected {
            background-color: #28a745;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Asignar Asesorías</h1>
    <table class="schedule-table" id="scheduleTable">
        <thead>
            <tr>
                <th>Hora</th>
                <th>Lunes</th>
                <th>Martes</th>
                <th>Miércoles</th>
                <th>Jueves</th>
                <th>Viernes</th>
            </tr>
        </thead>
        <tbody>
            <!-- JavaScript poblará esta tabla -->
        </tbody>
    </table>
    <button id="saveButton">Guardar Asesorías</button>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const database = firebase.database();
            const scheduleTableBody = document.getElementById('scheduleTable').getElementsByTagName('tbody')[0];
            const saveButton = document.getElementById('saveButton');
            const selectedCells = [];

            firebase.auth().onAuthStateChanged((user) => {
                if (!user) {
                    window.location.href = 'login.html';
                } else {
                    const userId = user.uid;
                    fetchSchedule(userId);
                }
            });

            function fetchSchedule(userId) {
                const scheduleRef = database.ref(`users/${userId}/horario`);
                scheduleRef.once('value').then(snapshot => {
                    const schedule = snapshot.val();
                    populateTable(schedule);
                }).catch(error => {
                    console.error('Error al obtener el horario:', error);
                });
            }

            function populateTable(schedule) {
                const times = ["0700", "0745", "0830", "0915", "1000", "1030", "1115", "1200", "1245", "1330", "1415", "1500"];
                const days = ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"];

                scheduleTableBody.innerHTML = '';

                for (const time of times) {
                    const row = document.createElement('tr');
                    const timeCell = document.createElement('th');
                    timeCell.textContent = `${time.substring(0, 2)}:${time.substring(2)}`;
                    row.appendChild(timeCell);

                    for (const day of days) {
                        const cell = document.createElement('td');

                        if (time === "1000") {
                            cell.textContent = "RECESO";
                            cell.classList.add('occupied');
                        } else {
                            const subject = schedule && schedule[day] && schedule[day][time];
                            if (subject) {
                                cell.classList.add('occupied');
                            } else {
                                cell.addEventListener('click', () => toggleSelection(cell, day, time));
                            }
                        }

                        row.appendChild(cell);
                    }

                    scheduleTableBody.appendChild(row);
                }
            }

            function toggleSelection(cell, day, time) {
                if (cell.classList.contains('occupied')) return;

                const cellData = { day, time };
                const index = selectedCells.findIndex(c => c.day === day && c.time === time);

                if (index === -1) {
                    cell.classList.add('selected');
                    selectedCells.push(cellData);
                } else {
                    cell.classList.remove('selected');
                    selectedCells.splice(index, 1);
                }
            }

            saveButton.addEventListener('click', () => {
                const userId = firebase.auth().currentUser.uid;
                const updates = {};

                selectedCells.forEach(({ day, time }) => {
                    updates[`users/${userId}/horario/${day}/${time}`] = "Asesorías";
                });

                database.ref().update(updates).then(() => {
                    alert('Asesorías guardadas con éxito');
                    window.location.reload();
                }).catch(error => {
                    console.error('Error al guardar las asesorías:', error);
                });
            });
        });
    </script>
</body>
</html>
