<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil del Maestro</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        main {
            padding: 20px;
        }
        .profile-form {
            border: 1px solid #cccccc;
            padding: 20px;
            border-radius: 5px;
            background-color: #f9f9f9;
            max-width: 600px;
            margin: 0 auto;
        }
        .profile-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .profile-form input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
        }
        .profile-form button {
            background-color: #ff851b;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .profile-form button:hover {
            background-color: #e67e22;
        }
    </style>
</head>
<body>
    <header>
        <h1>Perfil del Maestro</h1>
    </header>
    <main>
        <form class="profile-form" id="teacherProfileForm">
            <label for="firstName">Nombre:</label>
            <input type="text" id="firstName" name="firstName" required>

            <label for="lastNameP">Apellido Paterno:</label>
            <input type="text" id="lastNameP" name="lastNameP" required>

            <label for="lastNameM">Apellido Materno:</label>
            <input type="text" id="lastNameM" name="lastNameM" required>

            <button type="submit">Guardar Cambios</button>
        </form>
    </main>
    
    <script>
        // Obtener el ID del usuario autenticado
        auth.onAuthStateChanged((user) => {
            if (user) {
                const userId = user.uid;

                // Cargar datos del perfil
                loadTeacherProfile(userId);

                // Manejar el evento de guardar cambios
                document.getElementById('teacherProfileForm').addEventListener('submit', (event) => {
                    event.preventDefault();
                    saveTeacherProfile(userId);
                });
            } else {
                console.error("Usuario no autenticado.");
            }
        });

        // Función para cargar datos del perfil del usuario
        function loadTeacherProfile(userId) {
            const profileRef = database.ref(`users/${userId}`);
            profileRef.once('value')
                .then((snapshot) => {
                    const profileData = snapshot.val();
                    if (profileData) {
                        document.getElementById('firstName').value = profileData.firstName || '';
                        document.getElementById('lastNameP').value = profileData.lastNameP || '';
                        document.getElementById('lastNameM').value = profileData.lastNameM || '';
                    }
                })
                .catch((error) => {
                    console.error("Error al cargar el perfil:", error);
                });
        }

        // Función para guardar datos del perfil en Firebase
        function saveTeacherProfile(userId) {
            const profileData = {
                firstName: document.getElementById('firstName').value,
                lastNameP: document.getElementById('lastNameP').value,
                lastNameM: document.getElementById('lastNameM').value,
            };

            const profileRef = database.ref(`users/${userId}`);
            profileRef.set(profileData)
                .then(() => {
                    alert("Perfil actualizado correctamente.");
                })
                .catch((error) => {
                    console.error("Error al actualizar el perfil:", error);
                });
        }
    </script>
</body>
</html>
