<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materias y Asesorías</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        /* Tu CSS aquí */
    </style>
</head>
<body>
    <header>
        <h1>Materias y Asesorías</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <h2>Materias Disponibles</h2>
        <table id="subjectsTable">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Días/Horas</th>
                    <th>Agregar al Horario</th>
                </tr>
            </thead>
            <tbody id="subjectsBody">
                <!-- Materias cargadas aquí -->
            </tbody>
        </table>

        <h2>Horario de Asesorías</h2>
        <table id="advisoryTable">
            <thead>
                <tr>
                    <th>Días</th>
                    <th>07:00</th>
                    <th>07:45</th>
                    <th>08:30</th>
                    <th>09:15</th>
                    <th>10:00</th>
                    <th>10:45</th>
                    <th>11:30</th>
                    <th>12:15</th>
                </tr>
            </thead>
            <tbody id="advisoryBody">
                <!-- Asesorías aquí -->
            </tbody>
        </table>
        <button onclick="confirmAdvisory()">Confirmar Asesorías</button>
    </main>

    <script>
        const days = ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"];
        const hours = ["07:00", "07:45", "08:30", "09:15", "10:00", "10:45", "11:30", "12:15"];

        // Cargar materias desde Firebase
        function loadSubjects() {
            const subjectRef = database.ref('classSchedules');
            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                const subjectsBody = document.getElementById('subjectsBody');
                subjectsBody.innerHTML = '';

                for (const semester in subjects) {
                    for (const group in subjects[semester]) {
                        for (const day in subjects[semester][group]) {
                            const hours = Object.keys(subjects[semester][group][day]);
                            const subjectName = subjects[semester][group][day][hours[0]];

                            if (!subjectName) continue; // Ignorar materias sin nombre

                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td>${subjectName}</td>
                                <td>${semester}</td>
                                <td>${group}</td>
                                <td>${day}: ${hours.join(', ')}</td>
                                <td><button onclick="addSubjectToSchedule('${subjectName}', '${semester}', '${group}', '${day}', '${hours}')">Agregar</button></td>
                            `;
                            subjectsBody.appendChild(row);
                        }
                    }
                }
            }).catch(error => console.error('Error al cargar las materias:', error));
        }

        // Agregar materias al horario
        function addSubjectToSchedule(subject, semester, group, day, hours) {
            const scheduleRef = database.ref(`users/admin/horario`);
            scheduleRef.push({
                materia: subject,
                semestre: semester,
                grupo: group,
                dia: day,
                horas: hours
            });
            alert(`Materia "${subject}" agregada al horario.`);
        }

        // Crear tabla de asesorías
        function createAdvisoryTable() {
            const advisoryBody = document.getElementById('advisoryBody');
            advisoryBody.innerHTML = '';

            days.forEach(day => {
                const row = document.createElement('tr');
                row.innerHTML = `<td>${day}</td>` + 
                    hours.map(hour => `<td onclick="toggleSelection(this)" data-day="${day}" data-hour="${hour}"></td>`).join('');
                advisoryBody.appendChild(row);
            });
        }

        // Seleccionar/desmarcar una celda
        function toggleSelection(cell) {
            cell.classList.toggle('selected');
        }

        // Confirmar asesorías seleccionadas
        function confirmAdvisory() {
            const selectedCells = document.querySelectorAll('.selected');
            const advisoryData = {};

            selectedCells.forEach(cell => {
                const day = cell.getAttribute('data-day');
                const hour = cell.getAttribute('data-hour');

                if (!advisoryData[day]) advisoryData[day] = [];
                advisoryData[day].push(hour);
            });

            const advisoryRef = database.ref(`users/admin/horario/asesorias`);
            advisoryRef.set(advisoryData);

            alert('Asesorías guardadas correctamente.');
        }

        // Inicializar tablas
        loadSubjects();
        createAdvisoryTable();
    </script>
</body>
</html>
