<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Materias</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .schedule-table th, .schedule-table td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        .schedule-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .schedule-table td {
            background-color: #ffffff;
        }
        .schedule-table tr:nth-child(odd) td {
            background-color: #f9f9f9;
        }
        .schedule-table tr:hover {
            background-color: #7d7d7d;
            cursor: pointer;
        }
        #searchBar {
            margin-bottom: 20px;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            border: 1px solid #ccc;
        }
        .hours-table {
            width: 100%;
            border: 1px solid #dddddd;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .hours-table th, .hours-table td {
            padding: 5px;
            border: 1px solid #dddddd;
            text-align: center;
        }
        .hours-table th {
            background-color: #f0f0f0;
        }
        .hours-table td {
            background-color: #ffffff;
        }
    </style>
</head>
<body>
    <header>
        <h1>Buscar Materias</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <input type="text" id="searchBar" placeholder="Buscar materia, semestre o grupo...">

        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horas</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Se cargan las materias desde Firebase -->
            </tbody>
        </table>
    </main>

    <script>
        function selectSubject(subjectName, semester, group, schedule) {
            if (confirm(`¿Deseas agregar la materia ${subjectName} del semestre ${semester} grupo ${group} a tu horario?`)) {
                saveSubjectToSchedule(subjectName, semester, group, schedule);
            }
        }

        function saveSubjectToSchedule(subjectName, semester, group, schedule) {
            const userId = firebase.auth().currentUser.uid;
            const scheduleRef = firebase.database().ref(`users/${userId}/horario`);

            scheduleRef.once('value').then(snapshot => {
                const currentSchedule = snapshot.val() || {};
                let isDuplicate = false;

                for (const day in schedule) {
                    if (isDuplicate) break;
                    for (const hour of schedule[day]) {
                        if (currentSchedule[day] && currentSchedule[day][hour] && currentSchedule[day][hour] === subjectName) {
                            isDuplicate = true;
                            break;
                        }
                    }
                }

                if (isDuplicate) {
                    alert(`La materia ${subjectName} ya está cargada en tu horario.`);
                } else {
                    for (const day in schedule) {
                        if (!currentSchedule[day]) {
                            currentSchedule[day] = {};
                        }
                        for (const hour of schedule[day]) {
                            currentSchedule[day][hour] = subjectName;
                        }
                    }
                    scheduleRef.set(currentSchedule).then(() => {
                        alert('Materia agregada con éxito a tu horario');
                        window.location.href = 'pagina1.html';
                    }).catch(error => {
                        console.error('Error al guardar la materia:', error);
                        alert('Ocurrió un error al agregar la materia.');
                    });
                }
            }).catch(error => console.error('Error al obtener el horario:', error));
        }

        function loadSubjects() {
            const subjectRef = firebase.database().ref('classSchedules');
            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                const subjectBody = document.getElementById('subjectBody');
                subjectBody.innerHTML = '';

                const uniqueSubjects = {};

                for (let semester in subjects) {
                    for (let group in subjects[semester]) {
                        for (let day in subjects[semester][group]) {
                            const normalizedDay = day === 'Miercoles' ? 'Miércoles' : day;

                            for (let hour in subjects[semester][group][day]) {
                                const subjectName = subjects[semester][group][day][hour];

                                if (!subjectName || hour === '1000' || hour === '1030') continue;

                                if (!uniqueSubjects[subjectName]) {
                                    uniqueSubjects[subjectName] = {
                                        semester: semester,
                                        group: group,
                                        schedule: {}
                                    };
                                }

                                if (!uniqueSubjects[subjectName].schedule[normalizedDay]) {
                                    uniqueSubjects[subjectName].schedule[normalizedDay] = [];
                                }

                                uniqueSubjects[subjectName].schedule[normalizedDay].push(hour);
                            }
                        }
                    }
                }

                for (const subjectName in uniqueSubjects) {
                    const data = uniqueSubjects[subjectName];
                    const row = document.createElement('tr');
                    const subjectCell = document.createElement('td');
                    const semesterCell = document.createElement('td');
                    const groupCell = document.createElement('td');
                    const hoursCell = document.createElement('td');

                    row.addEventListener('click', () => {
                        selectSubject(subjectName, data.semester, data.group, data.schedule);
                    });

                    subjectCell.textContent = subjectName;
                    semesterCell.textContent = data.semester;
                    groupCell.textContent = data.group;

                    const hoursTable = document.createElement('table');
                    hoursTable.classList.add('hours-table');

                    const days = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];
                    const headerRow = document.createElement('tr');
                    days.forEach(day => {
                        const th = document.createElement('th');
                        th.textContent = day;
                        headerRow.appendChild(th);
                    });
                    hoursTable.appendChild(headerRow);

                    const hourRow = document.createElement('tr');
                    days.forEach(day => {
                        const td = document.createElement('td');
                        const hours = (data.schedule[day] || []).sort();
                        td.textContent = hours.map(hour => `${hour.slice(0, 2)}:${hour.slice(2)}`).join(', ');
                        hourRow.appendChild(td);
                    });
                    hoursTable.appendChild(hourRow);

                    hoursCell.appendChild(hoursTable);

                    row.appendChild(subjectCell);
                    row.appendChild(semesterCell);
                    row.appendChild(groupCell);
                    row.appendChild(hoursCell);

                    subjectBody.appendChild(row);
                }
            }).catch(error => console.error('Error al cargar las materias:', error));
        }

        loadSubjects();
    </script>
</body>
</html>
