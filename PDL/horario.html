<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Materias</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .schedule-table th, .schedule-table td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        .schedule-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .schedule-table tr:hover {
            background-color: #7d7d7d;
            cursor: pointer;
        }
        #searchBar {
            margin-bottom: 20px;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <header>
        <h1>Buscar Materias</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <input type="text" id="searchBar" placeholder="Buscar materia, semestre o grupo...">
        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horas</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Se cargan las materias desde Firebase -->
            </tbody>
        </table>
        <button id="addAdvisoryBtn">Seleccionar Asesorías</button>
    </main>

    <script>
        // La configuración y autenticación ya están en auth.js

        const database = firebase.database(); // Usar la referencia de Firebase inicializada en auth.js.

        function loadSubjects() {
            const subjectRef = database.ref('classSchedules');
            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                const subjectBody = document.getElementById('subjectBody');
                subjectBody.innerHTML = '';

                for (let semester in subjects) {
                    for (let group in subjects[semester]) {
                        for (let day in subjects[semester][group]) {
                            for (let hour in subjects[semester][group][day]) {
                                const subjectName = subjects[semester][group][day][hour];
                                const row = document.createElement('tr');
                                row.innerHTML = `
                                    <td>${subjectName}</td>
                                    <td>${semester}</td>
                                    <td>${group}</td>
                                    <td>${day} - ${hour}</td>
                                `;
                                row.onclick = () => selectSubject(subjectName, semester, group, { [day]: [hour] });
                                subjectBody.appendChild(row);
                            }
                        }
                    }
                }
            });
        }

        function selectSubject(subjectName, semester, group, schedule) {
            if (confirm(`¿Deseas agregar la materia ${subjectName} del semestre ${semester} grupo ${group} a tu horario?`)) {
                saveSubjectToSchedule(subjectName, schedule);
            }
        }

        function saveSubjectToSchedule(subjectName, schedule) {
            const userId = firebase.auth().currentUser.uid;
            const scheduleRef = database.ref(`users/${userId}/horario`);

            scheduleRef.once('value').then(snapshot => {
                const currentSchedule = snapshot.val() || {};
                for (const day in schedule) {
                    if (!currentSchedule[day]) currentSchedule[day] = {};
                    for (const hour of schedule[day]) {
                        currentSchedule[day][hour] = subjectName;
                    }
                }
                scheduleRef.set(currentSchedule).then(() => {
                    alert('Materia agregada con éxito a tu horario');
                });
            });
        }

        document.getElementById('addAdvisoryBtn').addEventListener('click', () => {
            const day = prompt("Selecciona el día para la asesoría (Lunes, Martes, etc.):");
            const hour = prompt("Selecciona la hora para la asesoría (Formato HHMM):");
            if (day && hour) {
                const userId = firebase.auth().currentUser.uid;
                const scheduleRef = database.ref(`users/${userId}/horario`);
                scheduleRef.child(day).child(hour).set("Asesoría").then(() => {
                    alert("Asesoría agregada con éxito.");
                });
            }
        });

        window.onload = loadSubjects;
    </script>
</body>
</html>
