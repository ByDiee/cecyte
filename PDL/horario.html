<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Materias</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .schedule-table, .advisory-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .schedule-table th, .schedule-table td, .advisory-table th, .advisory-table td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        .schedule-table th, .advisory-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .schedule-table td, .advisory-table td {
            background-color: #ffffff;
        }
        .schedule-table tr:nth-child(odd) td, .advisory-table tr:nth-child(odd) td {
            background-color: #f9f9f9;
        }
        .schedule-table tr:hover, .advisory-table tr:hover {
            background-color: #7d7d7d;
            cursor: pointer;
        }
        #searchBar {
            margin-bottom: 20px;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            border: 1px solid #ccc;
        }
        .hours-table {
            width: 100%;
            border: 1px solid #dddddd;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .hours-table th, .hours-table td {
            padding: 5px;
            border: 1px solid #dddddd;
            text-align: center;
        }
        .hours-table th {
            background-color: #f0f0f0;
        }
        .hours-table td {
            background-color: #ffffff;
        }
        .hours-table td.selected {
            background-color: #dff0d8; /* green background for selected time */
        }
        .hours-table td.occupied {
            background-color: #f8d7da; /* red background for occupied time */
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <header>
        <h1>Buscar Materias</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <input type="text" id="searchBar" placeholder="Buscar materia, semestre o grupo...">

        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horas</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Se cargan las materias desde Firebase -->
            </tbody>
        </table>

        <h2>Asesorías</h2>
        <table class="advisory-table">
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                </tr>
            </thead>
            <tbody id="advisoryBody">
                <!-- Se cargan las horas de asesorías -->
            </tbody>
        </table>
        <button id="confirmAdvisory" style="margin-top: 20px; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer;">Confirmar Asesoría</button>
    </main>

    <script>
        const days = ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"];
        const times = ["0700", "0745", "0830", "0915", "1030", "1115", "1200", "1245", "1330", "1415", "1500"];

        function loadSubjects() {
            const subjectRef = firebase.database().ref('classSchedules');
            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                const subjectBody = document.getElementById('subjectBody');
                subjectBody.innerHTML = '';

                for (let semester in subjects) {
                    for (let group in subjects[semester]) {
                        for (let day in subjects[semester][group]) {
                            // Process subject and display in the table
                        }
                    }
                }
            });
        }

        function loadAdvisorySchedule() {
            const user = firebase.auth().currentUser;
            if (!user) return;

            const advisoryRef = firebase.database().ref('teachers/' + user.uid + '/schedule');
            advisoryRef.once('value').then(snapshot => {
                const schedule = snapshot.val() || {};
                const advisoryBody = document.getElementById('advisoryBody');
                advisoryBody.innerHTML = '';

                times.forEach(time => {
                    const tr = document.createElement('tr');
                    const tdTime = document.createElement('td');
                    tdTime.textContent = `${time.substring(0, 2)}:${time.substring(2)}`;
                    tr.appendChild(tdTime);

                    days.forEach(day => {
                        const td = document.createElement('td');
                        const isOccupied = schedule[day] && schedule[day].includes(time);
                        td.className = isOccupied ? 'occupied' : '';
                        td.addEventListener('click', () => {
                            if (!td.classList.contains('occupied')) {
                                td.classList.toggle('selected');
                            }
                        });
                        tr.appendChild(td);
                    });

                    advisoryBody.appendChild(tr);
                });
            });
        }

        document.getElementById('confirmAdvisory').addEventListener('click', () => {
            const user = firebase.auth().currentUser;
            if (!user) {
                alert('Por favor, inicia sesión.');
                return;
            }

            const advisoryBody = document.getElementById('advisoryBody');
            const selectedCells = advisoryBody.querySelectorAll('td.selected');
            const schedule = {};

            selectedCells.forEach(cell => {
                const day = cell.dataset.day;
                const time = cell.dataset.time;
                if (!schedule[day]) schedule[day] = [];
                schedule[day].push(time);
            });

            const advisoryRef = firebase.database().ref('teachers/' + user.uid + '/schedule');
            advisoryRef.set(schedule).then(() => {
                alert('¡Horario confirmado correctamente!');
                window.location.href = 'pagina1.html';
            }).catch(error => {
                alert('Error al guardar: ' + error.message);
            });
        });

        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                loadSubjects();
                loadAdvisorySchedule();
            } else {
                alert('Por favor, inicia sesión.');
            }
        });
    </script>
</body>
</html>
