<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Materias</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .schedule-table, .teacher-schedule {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .schedule-table th, .schedule-table td, .teacher-schedule th, .teacher-schedule td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        .schedule-table th, .teacher-schedule th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .teacher-schedule {
            margin-top: 40px;
        }
        .teacher-schedule th {
            background-color: #28a745;
            color: white;
        }
        #searchBar {
            margin-bottom: 20px;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <header>
        <h1>Buscar Materias</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <input type="text" id="searchBar" placeholder="Buscar materia, semestre o grupo...">
        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horas</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Materias cargadas desde Firebase -->
            </tbody>
        </table>

        <h2>Tu Horario</h2>
        <table class="teacher-schedule">
            <thead>
                <tr>
                    <th>Día</th>
                    <th>Hora</th>
                    <th>Materia</th>
                </tr>
            </thead>
            <tbody id="teacherScheduleBody">
                <!-- Horario del maestro cargado desde Firebase -->
            </tbody>
        </table>
    </main>

    <script>
        const database = firebase.database();

        // Función para cargar las materias
        function loadSubjects() {
            const subjectRef = database.ref('classSchedules');
            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                const subjectBody = document.getElementById('subjectBody');
                subjectBody.innerHTML = '';

                for (const semester in subjects) {
                    for (const group in subjects[semester]) {
                        for (const day in subjects[semester][group]) {
                            for (const hour in subjects[semester][group][day]) {
                                const subjectName = subjects[semester][group][day][hour];
                                
                                if (hour === '1000' || hour === '1030') continue; // Ignorar recesos
                                
                                const row = document.createElement('tr');
                                row.innerHTML = `
                                    <td>${subjectName}</td>
                                    <td>${semester}</td>
                                    <td>${group}</td>
                                    <td>${day} - ${hour.substring(0, 2)}:${hour.substring(2)}</td>
                                `;
                                row.addEventListener('click', () => selectSubject(subjectName, semester, group, { [day]: [hour] }));
                                subjectBody.appendChild(row);
                            }
                        }
                    }
                }
            }).catch(error => console.error('Error al cargar las materias:', error));
        }

        // Función para seleccionar una materia
        function selectSubject(subjectName, semester, group, schedule) {
            if (confirm(`¿Deseas agregar la materia ${subjectName} del semestre ${semester}, grupo ${group} a tu horario?`)) {
                saveSubjectToSchedule(subjectName, schedule);
            }
        }

        // Función para guardar la materia en el horario del maestro
        function saveSubjectToSchedule(subjectName, schedule) {
            const userId = firebase.auth().currentUser.uid;
            const scheduleRef = database.ref(`users/${userId}/horario`);

            scheduleRef.once('value').then(snapshot => {
                const currentSchedule = snapshot.val() || {};

                for (const day in schedule) {
                    if (!currentSchedule[day]) currentSchedule[day] = {};
                    schedule[day].forEach(hour => currentSchedule[day][hour] = subjectName);
                }

                scheduleRef.set(currentSchedule).then(() => {
                    alert('Materia agregada a tu horario');
                    loadTeacherSchedule(); // Actualizar la tabla de horarios
                }).catch(error => console.error('Error al guardar el horario:', error));
            });
        }

        // Función para cargar el horario del maestro
        function loadTeacherSchedule() {
            const userId = firebase.auth().currentUser.uid;
            const teacherScheduleBody = document.getElementById('teacherScheduleBody');
            const scheduleRef = database.ref(`users/${userId}/horario`);

            scheduleRef.once('value').then(snapshot => {
                const schedule = snapshot.val() || {};
                teacherScheduleBody.innerHTML = '';

                for (const day in schedule) {
                    for (const hour in schedule[day]) {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${day}</td>
                            <td>${hour.substring(0, 2)}:${hour.substring(2)}</td>
                            <td>${schedule[day][hour]}</td>
                        `;
                        teacherScheduleBody.appendChild(row);
                    }
                }
            }).catch(error => console.error('Error al cargar el horario del maestro:', error));
        }

        // Cargar materias y horario al iniciar
        window.onload = () => {
            loadSubjects();
            loadTeacherSchedule();
        };
    </script>
</body>
</html>
