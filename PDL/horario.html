<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Materias</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        /* Estilos como antes, sin cambios */
    </style>
</head>
<body>
    <header>
        <h1>Buscar Materias</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <input type="text" id="searchBar" placeholder="Buscar materia, semestre o grupo...">

        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horas</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Se cargan las materias desde Firebase -->
            </tbody>
        </table>

        <!-- Tabla de asesorías -->
        <h2>Asesorías</h2>
        <table class="advisory-table">
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                </tr>
            </thead>
            <tbody id="advisoryBody">
                <!-- Se cargan las horas de asesorías -->
            </tbody>
        </table>
        <button id="confirmSchedule" style="display: none;">Confirmar Selección</button>
    </main>

    <script>
        let selectedCells = [];

        // Función para seleccionar una materia
        function selectSubject(subjectName, semester, group, schedule) {
            if (confirm(`¿Deseas agregar la materia ${subjectName} del semestre ${semester} grupo ${group} a tu horario?`)) {
                saveSubjectToSchedule(subjectName, semester, group, schedule);
            }
        }

        function saveSubjectToSchedule(subjectName, semester, group, schedule) {
            const userId = firebase.auth().currentUser.uid;
            const scheduleRef = firebase.database().ref(`users/${userId}/horario`);

            scheduleRef.once('value').then(snapshot => {
                const currentSchedule = snapshot.val() || {};
                let isDuplicate = false;

                for (const day in schedule) {
                    if (isDuplicate) break;
                    for (const hour of schedule[day]) {
                        if (currentSchedule[day] && currentSchedule[day][hour] && currentSchedule[day][hour] === subjectName) {
                            isDuplicate = true;
                            break;
                        }
                    }
                }

                if (isDuplicate) {
                    alert(`La materia ${subjectName} ya está cargada en tu horario.`);
                } else {
                    for (const day in schedule) {
                        if (!currentSchedule[day]) {
                            currentSchedule[day] = {};
                        }
                        for (const hour of schedule[day]) {
                            if (!currentSchedule[day][hour]) {
                                currentSchedule[day][hour] = subjectName;
                            }
                        }
                    }

                    scheduleRef.set(currentSchedule).then(() => {
                        alert('Materia agregada con éxito a tu horario');
                        window.location.href = 'pagina1.html';
                    }).catch(error => {
                        console.error('Error al guardar la materia:', error);
                        alert('Ocurrió un error al agregar la materia a tu horario');
                    });
                }
            }).catch(error => {
                console.error('Error al obtener el horario:', error);
            });
        }

        function loadSubjects() {
            const subjectRef = firebase.database().ref('classSchedules');
            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                const subjectBody = document.getElementById('subjectBody');
                subjectBody.innerHTML = '';

                const uniqueSubjects = {};

                for (let semester in subjects) {
                    for (let group in subjects[semester]) {
                        let scheduleMatrix = {};

                        for (let day in subjects[semester][group]) {
                            scheduleMatrix[day] = {};

                            for (let hour in subjects[semester][group][day]) {
                                const subjectName = subjects[semester][group][day][hour];
                                if (subjectName === "" || subjectName === "Receso") continue; // Eliminar receso

                                if (!uniqueSubjects[subjectName]) {
                                    uniqueSubjects[subjectName] = {
                                        semester: semester,
                                        group: group,
                                        schedule: {}
                                    };
                                }

                                if (!uniqueSubjects[subjectName].schedule[day]) {
                                    uniqueSubjects[subjectName].schedule[day] = [];
                                }

                                uniqueSubjects[subjectName].schedule[day].push(hour);
                            }
                        }
                    }
                }

                for (const subjectName in uniqueSubjects) {
                    const data = uniqueSubjects[subjectName];

                    const row = document.createElement('tr');
                    const subjectCell = document.createElement('td');
                    const semesterCell = document.createElement('td');
                    const groupCell = document.createElement('td');
                    const hoursCell = document.createElement('td');

                    row.addEventListener('click', () => {
                        selectSubject(subjectName, data.semester, data.group, data.schedule);
                    });

                    subjectCell.textContent = subjectName;
                    semesterCell.textContent = data.semester;
                    groupCell.textContent = data.group;

                    const hoursTable = document.createElement('table');
                    hoursTable.classList.add('hours-table');

                    const days = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
                    const times = ["0700", "0745", "0830", "0915", "1000", "1030", "1115", "1200", "1245", "1330", "1415", "1500"];

                    const trHead = document.createElement('tr');
                    trHead.appendChild(document.createElement('th')); // Empty cell at the corner
                    days.forEach(day => {
                        const th = document.createElement('th');
                        th.textContent = day;
                        trHead.appendChild(th);
                    });
                    hoursTable.appendChild(trHead);

                    times.forEach(time => {
                        const tr = document.createElement('tr');
                        const tdTime = document.createElement('td');
                        tdTime.textContent = `${time.substring(0, 2)}:${time.substring(2)}`;
                        tr.appendChild(tdTime);

                        days.forEach(day => {
                            const td = document.createElement('td');
                            if (data.schedule[day] && data.schedule[day].includes(time)) {
                                td.style.backgroundColor = '#dff0d8'; // Verde si hay clase
                                td.classList.add('selectable');
                                td.dataset.time = time;
                                td.dataset.day = day;
                                td.addEventListener('click', selectAdvisoryCell);
                            }
                            tr.appendChild(td);
                        });

                        hoursTable.appendChild(tr);
                    });

                    hoursCell.appendChild(hoursTable);
                    row.appendChild(subjectCell);
                    row.appendChild(semesterCell);
                    row.appendChild(groupCell);
                    row.appendChild(hoursCell);

                    subjectBody.appendChild(row);
                }
            }).catch(error => {
                console.error('Error al cargar las materias:', error);
            });
        }

        function selectAdvisoryCell(event) {
            const cell = event.target;
            if (selectedCells.includes(cell)) {
                cell.style.backgroundColor = '#f9f9f9';
                selectedCells = selectedCells.filter(c => c !== cell);
            } else {
                cell.style.backgroundColor = '#7d7d7d';
                selectedCells.push(cell);
            }

            document.getElementById('confirmSchedule').style.display = selectedCells.length > 0 ? 'block' : 'none';
        }

        document.getElementById('confirmSchedule').addEventListener('click', () => {
            selectedCells.forEach(cell => {
                const time = cell.dataset.time;
                const day = cell.dataset.day;
                // Agregar al horario del profesor
                alert(`Clase confirmada para ${day} a las ${time}`);
                // Lógica para agregar a la base de datos
            });
        });

        loadSubjects();
        loadAdvisorySchedule();
    </script>
</body>
</html>
