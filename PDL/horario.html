<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Materias</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .schedule-table th, .schedule-table td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        .schedule-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .hours-table {
            width: 100%;
            border: 1px solid #dddddd;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .hours-table th, .hours-table td {
            padding: 10px;
            border: 1px solid #dddddd;
            text-align: center;
        }
        .hours-table th {
            background-color: #f0f0f0;
        }
        .hour-selectable {
            background-color: #f2f2f2;
            cursor: pointer;
        }
        .hour-selectable.selected {
            background-color: #28a745;
            color: white;
        }
        #searchBar {
            margin-bottom: 20px;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <header>
        <h1>Buscar Materias</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <input type="text" id="searchBar" placeholder="Buscar materia, semestre o grupo...">

        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horas</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Materias cargadas desde Firebase -->
            </tbody>
        </table>

        <!-- Tabla para seleccionar horarios personalizados de Asesorías -->
        <h2>Seleccionar horarios para "Asesorías"</h2>
        <table class="hours-table" id="advisoryTable">
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                </tr>
            </thead>
            <tbody id="advisoryBody">
                <!-- Horas y días generados dinámicamente -->
            </tbody>
        </table>
        <button onclick="confirmAdvisorySchedule()">Confirmar Horarios de Asesorías</button>
    </main>

    <script>
        const days = ['Lunes', 'Martes', 'Miercoles', 'Jueves', 'Viernes'];
        const hours = ['0700', '0745', '0830', '0915', '1000', '1030', '1115', '1200', '1245', '1330', '1415', '1500'];

        // Crear la tabla de horarios de Asesorías
        function createAdvisoryTable() {
            const advisoryBody = document.getElementById('advisoryBody');
            advisoryBody.innerHTML = '';

            hours.forEach(hour => {
                const row = document.createElement('tr');
                const hourCell = document.createElement('td');
                hourCell.textContent = hour;
                row.appendChild(hourCell);

                days.forEach(day => {
                    const cell = document.createElement('td');
                    cell.classList.add('hour-selectable');
                    cell.addEventListener('click', () => {
                        cell.classList.toggle('selected');
                    });
                    row.appendChild(cell);
                });

                advisoryBody.appendChild(row);
            });
        }

        // Confirmar horarios seleccionados para Asesorías
        function confirmAdvisorySchedule() {
            const selectedSchedule = {};
            const rows = document.querySelectorAll('#advisoryBody tr');

            rows.forEach(row => {
                const hour = row.children[0].textContent;
                const cells = Array.from(row.children).slice(1);

                cells.forEach((cell, index) => {
                    if (cell.classList.contains('selected')) {
                        const day = days[index];
                        if (!selectedSchedule[day]) {
                            selectedSchedule[day] = {};
                        }
                        selectedSchedule[day][hour] = 'Asesorías';
                    }
                });
            });

            if (Object.keys(selectedSchedule).length === 0) {
                alert('No has seleccionado ningún horario.');
                return;
            }

            if (confirm('¿Deseas confirmar los horarios seleccionados para Asesorías?')) {
                saveSubjectToSchedule('Asesorías', 'N/A', 'N/A', selectedSchedule);
            }
        }

        // Guardar Asesorías en Firebase
        function saveSubjectToSchedule(subjectName, semester, group, schedule) {
            const userId = firebase.auth().currentUser.uid;
            const scheduleRef = firebase.database().ref(`users/${userId}/horario`);
            scheduleRef.once('value').then(snapshot => {
                const currentSchedule = snapshot.val() || {};
                for (const day in schedule) {
                    if (!currentSchedule[day]) {
                        currentSchedule[day] = {};
                    }
                    for (const hour in schedule[day]) {
                        currentSchedule[day][hour] = subjectName;
                    }
                }
                scheduleRef.set(currentSchedule).then(() => {
                    alert('Asesorías agregadas correctamente.');
                    window.location.href = 'pagina1.html';
                });
            });
        }

        // Cargar todas las materias existentes desde Firebase
        function loadSubjects() {
            const subjectRef = firebase.database().ref('classSchedules');
            const subjectBody = document.getElementById('subjectBody');

            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                subjectBody.innerHTML = '';

                for (const semester in subjects) {
                    for (const group in subjects[semester]) {
                        for (const day in subjects[semester][group]) {
                            const daySchedule = subjects[semester][group][day];
                            for (const hour in daySchedule) {
                                const subjectName = daySchedule[hour];
                                if (subjectName) {
                                    const row = document.createElement('tr');
                                    row.innerHTML = `
                                        <td>${subjectName}</td>
                                        <td>${semester}</td>
                                        <td>${group}</td>
                                        <td>${day} ${hour}</td>
                                    `;
                                    subjectBody.appendChild(row);
                                }
                            }
                        }
                    }
                }
            }).catch(error => {
                console.error('Error al cargar las materias:', error);
            });
        }

        // Inicializar
        createAdvisoryTable();
        loadSubjects();
    </script>
</body>
</html>
