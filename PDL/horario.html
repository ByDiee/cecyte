<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materias y Asesorías</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #d1e7dd;
            cursor: pointer;
        }
        .selected {
            background-color: #28a745 !important;
            color: white;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px 0;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <header>
        <h1>Materias y Asesorías</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <!-- Materias cargadas desde Firebase -->
        <h2>Materias Disponibles</h2>
        <table id="subjectsTable">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horario</th>
                    <th>Agregar al Horario</th>
                </tr>
            </thead>
            <tbody id="subjectsBody">
                <!-- Carga de materias aquí -->
            </tbody>
        </table>

        <!-- Tabla de asesorías -->
        <h2>Horario de Asesorías</h2>
        <table id="advisoryTable">
            <thead>
                <tr>
                    <th>Horas</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                </tr>
            </thead>
            <tbody id="advisoryBody">
                <!-- Asesorías aquí -->
            </tbody>
        </table>
        <button onclick="confirmAdvisory()">Confirmar Asesorías</button>
    </main>

    <script>
        const days = ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"];
        const hours = ["07:00", "07:45", "08:30", "09:15", "10:00", "10:45", "11:30", "12:15"];

function cargarMateriasDesdeFirebase() {
    const databaseRef = firebase.database().ref("classSchedules");

    databaseRef.once("value", (snapshot) => {
        const data = snapshot.val();
        const materias = [];

        for (const semestre in data) {
            for (const grupo in data[semestre]) {
                for (const dia in data[semestre][grupo]) {
                    for (const hora in data[semestre][grupo][dia]) {
                        const materia = data[semestre][grupo][dia][hora];

                        // Omitir materias sin nombre
                        if (materia.trim() === "") continue;

                        materias.push({
                            semestre,
                            grupo,
                            dia,
                            hora,
                            materia,
                        });
                    }
                }
            }
        }

        mostrarMateriasEnTabla(materias);
    });
}

// Mostrar materias en la tabla
function mostrarMateriasEnTabla(materias) {
    // Agrupar materias por día y ordenarlas por hora
    const tabla = document.getElementById("tablaMaterias");
    tabla.innerHTML = ""; // Limpiar tabla

    const materiasPorDia = materias.reduce((acc, materia) => {
        if (!acc[materia.dia]) acc[materia.dia] = [];
        acc[materia.dia].push(materia);
        return acc;
    }, {});

    for (const dia in materiasPorDia) {
        // Ordenar materias por hora
        materiasPorDia[dia].sort((a, b) => parseInt(a.hora) - parseInt(b.hora));

        const filaDia = document.createElement("tr");
        const celdaDia = document.createElement("td");
        celdaDia.colSpan = 2;
        celdaDia.textContent = dia;
        celdaDia.style.fontWeight = "bold";
        filaDia.appendChild(celdaDia);
        tabla.appendChild(filaDia);

        materiasPorDia[dia].forEach(({ hora, materia, grupo, semestre }) => {
            const fila = document.createElement("tr");

            const celdaHora = document.createElement("td");
            celdaHora.textContent = `${hora.slice(0, 2)}:${hora.slice(2)}`;
            fila.appendChild(celdaHora);

            const celdaMateria = document.createElement("td");
            celdaMateria.textContent = `${materia} (Grupo ${grupo}, Semestre ${semestre})`;
            fila.appendChild(celdaMateria);

            tabla.appendChild(fila);
        });
    }
}

// Guardar asesorías como materias
function guardarAsesoria(dia, hora, grupo, semestre, asesor) {
    const databaseRef = firebase.database().ref(`classSchedules/${semestre}/${grupo}/${dia}/${hora}`);
    databaseRef.set(asesor)
        .then(() => {
            alert("Asesoría guardada exitosamente como materia.");
            cargarMateriasDesdeFirebase(); // Actualizar vista
        })
        .catch((error) => {
            console.error("Error al guardar la asesoría:", error);
        });
}

        // Inicializar tablas
        loadSubjects();
        createAdvisoryTable();
    </script>
</body>
</html>
