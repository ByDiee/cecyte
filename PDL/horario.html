<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materias y Asesorías</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #d1e7dd;
            cursor: pointer;
        }
        .selected {
            background-color: #28a745 !important;
            color: white;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px 0;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <header>
        <h1>Materias y Asesorías</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <!-- Materias cargadas desde Firebase -->
        <h2>Materias Disponibles</h2>
        <table id="subjectsTable">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horario</th>
                    <th>Agregar al Horario</th>
                </tr>
            </thead>
            <tbody id="subjectsBody">
                <!-- Carga de materias aquí -->
            </tbody>
        </table>

        <!-- Tabla de asesorías -->
        <h2>Horario de Asesorías</h2>
        <table id="advisoryTable">
            <thead>
                <tr>
                    <th>Horas</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                </tr>
            </thead>
            <tbody id="advisoryBody">
                <!-- Asesorías aquí -->
            </tbody>
        </table>
        <button onclick="confirmAdvisory()">Confirmar Asesorías</button>
    </main>

    <script>
        // Función para cargar las materias desde Firebase
        function cargarMaterias() {
            firebase.auth().onAuthStateChanged(user => {
                if (user) {
                    const currentUserId = user.uid;
                    const dbRef = firebase.database().ref('classSchedules');
                    
                    dbRef.once('value').then(snapshot => {
                        const data = snapshot.val();
                        const subjectsBody = document.getElementById('subjectsBody');

                        for (let grupo in data) {
                            for (let dia in data[grupo]) {
                                const materia = data[grupo][dia];
                                // Omitir materias vacías
                                if (!materia || materia === "") continue;

                                const row = document.createElement('tr');
                                const cellMateria = document.createElement('td');
                                const cellSemestre = document.createElement('td');
                                const cellGrupo = document.createElement('td');
                                const cellHorario = document.createElement('td');
                                const cellButton = document.createElement('td');
                                
                                cellMateria.textContent = materia;
                                cellSemestre.textContent = grupo; // Aquí lo puedes cambiar según tu estructura
                                cellGrupo.textContent = grupo; // Aquí también
                                
                                // Crear tabla interna para los horarios
                                const horarioTable = document.createElement('table');
                                horarioTable.classList.add('nestedTable');
                                const horarioHead = document.createElement('thead');
                                const horarioHeadRow = document.createElement('tr');
                                horarioHeadRow.innerHTML = `<th>Lunes</th><th>Martes</th><th>Miércoles</th><th>Jueves</th><th>Viernes</th>`;
                                horarioHead.appendChild(horarioHeadRow);
                                horarioTable.appendChild(horarioHead);
                                
                                const horarioBody = document.createElement('tbody');
                                for (let hour in data[grupo][dia]) {
                                    const hourRow = document.createElement('tr');
                                    hourRow.innerHTML = `<td>${hour}</td><td>${data[grupo][dia][hour]}</td>`;
                                    horarioBody.appendChild(hourRow);
                                }
                                horarioTable.appendChild(horarioBody);
                                
                                cellHorario.appendChild(horarioTable);
                                
                                const addButton = document.createElement('button');
                                addButton.textContent = "Agregar al Horario";
                                addButton.onclick = () => agregarMateriaAlHorario(currentUserId, grupo, materia);
                                cellButton.appendChild(addButton);

                                row.appendChild(cellMateria);
                                row.appendChild(cellSemestre);
                                row.appendChild(cellGrupo);
                                row.appendChild(cellHorario);
                                row.appendChild(cellButton);
                                subjectsBody.appendChild(row);
                            }
                        }
                    });
                }
            });
        }

        // Función para agregar materia al horario del usuario
        function agregarMateriaAlHorario(userId, grupo, materia) {
            const horarioRef = firebase.database().ref(`users/${userId}/horario/${grupo}`);
            horarioRef.push({
                materia: materia,
                dia: grupo,  // Aquí podrías mapear el día de la materia si es necesario
                hora: new Date().toLocaleTimeString() // Ejemplo de hora, ajusta según tus necesidades
            }).then(() => {
                alert("Materia agregada al horario.");
            }).catch(error => {
                alert("Error al agregar materia: " + error.message);
            });
        }

        // Llamamos a cargar las materias cuando la página cargue
        window.onload = cargarMaterias;
    </script>
</body>
</html>
