<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materias y Asesorías</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .schedule-table, .advisory-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .schedule-table th, .schedule-table td,
        .advisory-table th, .advisory-table td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        .schedule-table th, .advisory-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .schedule-table td, .advisory-table td {
            background-color: #ffffff;
        }
        .schedule-table tr:nth-child(odd) td,
        .advisory-table tr:nth-child(odd) td {
            background-color: #f9f9f9;
        }
        .schedule-table tr:hover, .advisory-table tr:hover {
            background-color: #7d7d7d;
            cursor: pointer;
        }
        #searchBar {
            margin-bottom: 20px;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            border: 1px solid #ccc;
        }
        .hours-table {
            width: 100%;
            border: 1px solid #dddddd;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .hours-table th, .hours-table td {
            padding: 5px;
            border: 1px solid #dddddd;
            text-align: center;
        }
        .hours-table th {
            background-color: #f0f0f0;
        }
        .hours-table td {
            background-color: #ffffff;
        }
        .selected {
            background-color: #28a745;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>Materias y Asesorías</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <input type="text" id="searchBar" placeholder="Buscar materia, semestre o grupo...">

        <!-- Tabla de materias -->
        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horas</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Materias cargadas desde Firebase -->
            </tbody>
        </table>

        <!-- Tabla de asesorías -->
        <h2>Horario de Asesorías</h2>
        <table class="advisory-table">
            <thead>
                <tr>
                    <th>Día</th>
                    <th>0700</th>
                    <th>0745</th>
                    <th>0830</th>
                    <th>0915</th>
                    <th>1115</th>
                    <th>1200</th>
                    <th>1245</th>
                    <th>1330</th>
                </tr>
            </thead>
            <tbody id="advisoryBody">
                <!-- Días y horas para seleccionar -->
            </tbody>
        </table>
        <button onclick="saveAdvisory()">Guardar Asesorías</button>
    </main>

    <script>
        const days = ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"];

        // Función para cargar las materias desde Firebase
        function loadSubjects() {
            const subjectRef = database.ref('classSchedules');
            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                const subjectBody = document.getElementById('subjectBody');
                subjectBody.innerHTML = '';

                const uniqueSubjects = {};

                for (let semester in subjects) {
                    for (let group in subjects[semester]) {
                        for (let day in subjects[semester][group]) {
                            for (let hour in subjects[semester][group][day]) {
                                const subjectName = subjects[semester][group][day][hour];

                                if (!uniqueSubjects[`${subjectName}_${semester}_${group}`]) {
                                    uniqueSubjects[`${subjectName}_${semester}_${group}`] = {
                                        semester: semester,
                                        group: group,
                                        schedule: {}
                                    };
                                }

                                if (!uniqueSubjects[`${subjectName}_${semester}_${group}`].schedule[day]) {
                                    uniqueSubjects[`${subjectName}_${semester}_${group}`].schedule[day] = [];
                                }

                                uniqueSubjects[`${subjectName}_${semester}_${group}`].schedule[day].push(hour);
                            }
                        }
                    }
                }

                for (const subjectKey in uniqueSubjects) {
                    const { semester, group, schedule } = uniqueSubjects[subjectKey];
                    const row = document.createElement('tr');

                    row.innerHTML = `
                        <td>${subjectKey.split('_')[0]}</td>
                        <td>${semester}</td>
                        <td>${group}</td>
                        <td>
                            <table class="hours-table">${renderHoursTable(schedule)}</table>
                        </td>
                    `;
                    subjectBody.appendChild(row);
                }
            });
        }

        // Función para renderizar una mini tabla de horas
        function renderHoursTable(schedule) {
            return days.map(day => `
                <tr>
                    <th>${day}</th>
                    ${Array(9).fill(0).map((_, i) => `
                        <td>${schedule[day] ? schedule[day][i] || '' : ''}</td>`).join('')}
                </tr>`).join('');
        }

        // Cargar materias al inicio
        loadSubjects();
    </script>
</body>
</html>
