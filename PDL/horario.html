<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Materias</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        /* Agrega los estilos para la tabla de las horas de asesorías */
        .hours-table {
            width: 100%;
            border: 1px solid #dddddd;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .hours-table th, .hours-table td {
            padding: 5px;
            border: 1px solid #dddddd;
            text-align: center;
        }
        .hours-table th {
            background-color: #f0f0f0;
        }
        .hours-table td {
            background-color: #ffffff;
            cursor: pointer;
        }
        .hours-table td.selected {
            background-color: #28a745;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>Buscar Materias</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <input type="text" id="searchBar" placeholder="Buscar materia, semestre o grupo...">

        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horas</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Se cargan las materias desde Firebase -->
            </tbody>
        </table>

        <!-- Tabla interactiva para seleccionar horas de Asesorías -->
        <h2>Seleccionar horas de Asesorías</h2>
        <table class="hours-table" id="hoursTable">
            <thead>
                <tr>
                    <th>Día/Hora</th>
                    <th>07:00</th>
                    <th>07:45</th>
                    <th>08:30</th>
                    <th>09:15</th>
                    <th>10:00</th>
                    <th>10:30</th>
                    <th>11:15</th>
                    <th>12:00</th>
                    <th>12:45</th>
                    <th>13:30</th>
                    <th>14:15</th>
                    <th>15:00</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>Lunes</th>
                    <td onclick="toggleSelect('Lunes', '0700')"></td>
                    <td onclick="toggleSelect('Lunes', '0745')"></td>
                    <td onclick="toggleSelect('Lunes', '0830')"></td>
                    <td onclick="toggleSelect('Lunes', '0915')"></td>
                    <td onclick="toggleSelect('Lunes', '1000')"></td>
                    <td onclick="toggleSelect('Lunes', '1030')"></td>
                    <td onclick="toggleSelect('Lunes', '1115')"></td>
                    <td onclick="toggleSelect('Lunes', '1200')"></td>
                    <td onclick="toggleSelect('Lunes', '1245')"></td>
                    <td onclick="toggleSelect('Lunes', '1330')"></td>
                    <td onclick="toggleSelect('Lunes', '1415')"></td>
                    <td onclick="toggleSelect('Lunes', '1500')"></td>
                </tr>
                <tr>
                    <th>Martes</th>
                    <td onclick="toggleSelect('Martes', '0700')"></td>
                    <td onclick="toggleSelect('Martes', '0745')"></td>
                    <td onclick="toggleSelect('Martes', '0830')"></td>
                    <td onclick="toggleSelect('Martes', '0915')"></td>
                    <td onclick="toggleSelect('Martes', '1000')"></td>
                    <td onclick="toggleSelect('Martes', '1030')"></td>
                    <td onclick="toggleSelect('Martes', '1115')"></td>
                    <td onclick="toggleSelect('Martes', '1200')"></td>
                    <td onclick="toggleSelect('Martes', '1245')"></td>
                    <td onclick="toggleSelect('Martes', '1330')"></td>
                    <td onclick="toggleSelect('Martes', '1415')"></td>
                    <td onclick="toggleSelect('Martes', '1500')"></td>
                </tr>
                <!-- Agrega filas para Miércoles, Jueves, Viernes -->
            </tbody>
        </table>
        <button onclick="saveAdvisorySchedule()">Guardar Asesorías</button>
    </main>

    <script>
        // Función para cambiar el estado de selección de una celda
        function toggleSelect(day, hour) {
            const cell = document.querySelector(`#hoursTable td[data-day="${day}"][data-hour="${hour}"]`);
            cell.classList.toggle('selected');
        }

        // Función para guardar las horas seleccionadas de asesorías
        function saveAdvisorySchedule() {
            const selectedHours = {};
            const days = ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"];
            const hours = ["0700", "0745", "0830", "0915", "1000", "1030", "1115", "1200", "1245", "1330", "1415", "1500"];

            // Recorrer la tabla para obtener las horas seleccionadas
            days.forEach(day => {
                selectedHours[day] = [];
                hours.forEach(hour => {
                    const cell = document.querySelector(`#hoursTable td[data-day="${day}"][data-hour="${hour}"]`);
                    if (cell.classList.contains('selected')) {
                        selectedHours[day].push(hour);
                    }
                });
            });

            const userId = firebase.auth().currentUser.uid;
            const scheduleRef = firebase.database().ref(`users/${userId}/horario/asesorias`);

            // Guardar las horas seleccionadas en la base de datos
            scheduleRef.set(selectedHours).then(() => {
                alert('Horas de asesorías guardadas exitosamente');
                window.location.href = 'pagina1.html';
            }).catch(error => {
                console.error('Error al guardar las horas:', error);
                alert('Ocurrió un error al guardar las horas de asesorías');
            });
        }

        // Cargar las materias desde Firebase (función existente)
        function loadSubjects() {
            const subjectRef = firebase.database().ref('classSchedules');
            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                const subjectBody = document.getElementById('subjectBody');
                subjectBody.innerHTML = '';

                const uniqueSubjects = {};

                for (let semester in subjects) {
                    for (let group in subjects[semester]) {
                        let scheduleMatrix = {};

                        for (let day in subjects[semester][group]) {
                            scheduleMatrix[day] = {};

                            for (let hour in subjects[semester][group][day]) {
                                const subjectName = subjects[semester][group][day][hour];

                                if (!uniqueSubjects[subjectName]) {
                                    uniqueSubjects[subjectName] = {
                                        semester: semester,
                                        group: group,
                                        schedule: {}
                                    };
                                }

                                if (!uniqueSubjects[subjectName].schedule[day]) {
                                    uniqueSubjects[subjectName].schedule[day] = [];
                                }

                                uniqueSubjects[subjectName].schedule[day].push(hour);
                            }
                        }
                    }
                }

                for (const subjectName in uniqueSubjects) {
                    const data = uniqueSubjects[subjectName];
                    const row = document.createElement('tr');
                    const subjectCell = document.createElement('td');
                    const semesterCell = document.createElement('td');
                    const groupCell = document.createElement('td');
                    const hoursCell = document.createElement('td');

                    row.addEventListener('click', () => {
                        selectSubject(subjectName, data.semester, data.group, data.schedule);
                    });

                    subjectCell.textContent = subjectName;
                    semesterCell.textContent = data.semester;
                    groupCell.textContent = data.group;

                    let hours = '';
                    for (let day in data.schedule) {
                        hours += `${day}: ${data.schedule[day].join(', ')}<br>`;
                    }
                    hoursCell.innerHTML = hours;

                    row.appendChild(subjectCell);
                    row.appendChild(semesterCell);
                    row.appendChild(groupCell);
                    row.appendChild(hoursCell);
                    subjectBody.appendChild(row);
                }
            });
        }

        // Llamada inicial para cargar las materias
        loadSubjects();
    </script>
</body>
</html>
