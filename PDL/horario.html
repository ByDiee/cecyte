<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materias Disponibles</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .schedule-table th, .schedule-table td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        .schedule-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .mini-table {
            border: 1px solid #ccc;
            margin: 0 auto;
            width: 100%;
            table-layout: fixed;
        }
        .mini-table th, .mini-table td {
            border: 1px solid #ddd;
            padding: 5px;
            text-align: center;
            font-size: 12px;
        }
        .schedule-table tr:hover {
            background-color: #f1f1f1;
            cursor: pointer;
        }
        #searchBar {
            margin-bottom: 20px;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <header>
        <h1>Buscar y Agregar Materias</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <input type="text" id="searchBar" placeholder="Buscar materia, semestre o grupo...">
        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horario</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Las materias se cargarán aquí -->
            </tbody>
        </table>
    </main>

    <script>
        const database = firebase.database(); // Reutilizando Firebase de auth.js.

        // Horas base para la mini tabla
        const hours = ["07:00", "07:45", "08:30", "09:15", "10:00", "10:30", "11:15", "12:00", "12:45", "13:30", "14:15", "15:00"];
        const days = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];

        // Cargar materias desde Firebase
        function loadSubjects() {
            const subjectRef = database.ref('classSchedules');
            const subjectBody = document.getElementById('subjectBody');

            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                subjectBody.innerHTML = ''; // Limpiar la tabla

                for (let semester in subjects) {
                    for (let group in subjects[semester]) {
                        const groupData = subjects[semester][group];
                        const scheduleMatrix = createScheduleMatrix();

                        for (let day in groupData) {
                            for (let hour in groupData[day]) {
                                const subjectName = groupData[day][hour];

                                // Llenar la matriz de horarios con la materia
                                const hourIndex = hours.indexOf(formatTime(hour));
                                if (hourIndex !== -1) {
                                    const dayIndex = days.indexOf(day);
                                    if (dayIndex !== -1) {
                                        scheduleMatrix[hourIndex][dayIndex] = subjectName;
                                    }
                                }
                            }
                        }

                        // Crear una fila para la materia
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${groupData[days[0]][hours[0]] || "Desconocido"}</td>
                            <td>${semester}</td>
                            <td>${group}</td>
                            <td>${generateMiniTable(scheduleMatrix)}</td>
                            <td><button onclick="addToSchedule('${semester}', '${group}')">Agregar</button></td>
                        `;
                        subjectBody.appendChild(row);
                    }
                }
            });
        }

        // Formatear tiempo (de 0700 a 07:00)
        function formatTime(time) {
            return `${time.slice(0, 2)}:${time.slice(2)}`;
        }

        // Crear matriz vacía para la mini tabla
        function createScheduleMatrix() {
            return hours.map(() => Array(days.length).fill(""));
        }

        // Generar mini tabla en HTML
        function generateMiniTable(matrix) {
            let html = '<table class="mini-table"><thead><tr><th>Hora</th>';
            days.forEach(day => (html += `<th>${day}</th>`));
            html += '</tr></thead><tbody>';

            matrix.forEach((row, i) => {
                html += `<tr><td>${hours[i]}</td>`;
                row.forEach(cell => (html += `<td>${cell || ""}</td>`));
                html += '</tr>';
            });

            html += '</tbody></table>';
            return html;
        }

        // Agregar materia al horario del profesor
        function addToSchedule(semester, group) {
            alert(`Materia del semestre ${semester} y grupo ${group} agregada al horario.`);
        }

        window.onload = loadSubjects;
    </script>
</body>
</html>
