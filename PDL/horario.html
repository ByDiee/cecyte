<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Materias</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .schedule-table th, .schedule-table td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        .schedule-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .schedule-table tr:hover {
            background-color: #7d7d7d;
            cursor: pointer;
        }
        .hours-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            border: 1px solid #dddddd;
        }
        .hours-table th, .hours-table td {
            padding: 5px;
            border: 1px solid #dddddd;
            text-align: center;
        }
        .hours-table th {
            background-color: #f0f0f0;
        }
        .hours-table td {
            background-color: #ffffff;
        }
        .hours-table td.selected {
            background-color: #dff0d8; /* Verde para horas seleccionadas */
        }
    </style>
</head>
<body>
    <header>
        <h1>Materias Disponibles</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horario</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Las materias se cargarán aquí desde Firebase -->
            </tbody>
        </table>
    </main>

    <script>
        // Cargar materias desde Firebase
        function loadSubjects() {
            const subjectRef = firebase.database().ref('classSchedules');
            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                const subjectBody = document.getElementById('subjectBody');
                subjectBody.innerHTML = ''; // Limpiar la tabla antes de cargar nuevas materias

                const loadedSubjects = {}; // Control para evitar duplicados

                // Iterar sobre todos los semestres, grupos, días y horas
                for (let semester in subjects) {
                    for (let group in subjects[semester]) {
                        for (let day in subjects[semester][group]) {
                            for (let hour in subjects[semester][group][day]) {
                                const subjectName = subjects[semester][group][day][hour];
                                
                                if (!subjectName || hour === "1000") continue; // Ignorar materias vacías y la hora de receso

                                // Crear un identificador único para la combinación de materia, semestre y grupo
                                const subjectKey = `${subjectName}-${semester}-${group}`;
                                
                                // Si esta combinación ya se ha cargado, no la cargamos nuevamente
                                if (!loadedSubjects[subjectKey]) {
                                    loadedSubjects[subjectKey] = true; // Marcamos esta combinación como cargada

                                    const row = document.createElement('tr');
                                    row.classList.add('subject-row');

                                    const subjectCell = document.createElement('td');
                                    const semesterCell = document.createElement('td');
                                    const groupCell = document.createElement('td');
                                    const hoursCell = document.createElement('td');

                                    subjectCell.textContent = subjectName;
                                    semesterCell.textContent = semester;
                                    groupCell.textContent = group;

                                    // Crear mini tabla
                                    const hoursTable = document.createElement('table');
                                    hoursTable.classList.add('hours-table');

                                    const days = ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"];
                                    const times = ["0700", "0745", "0830", "0915", "1030", "1115", "1200", "1245", "1330", "1415", "1500"];

                                    // Encabezados de la mini tabla
                                    const headerRow = document.createElement('tr');
                                    headerRow.appendChild(document.createElement('th')); // Celda vacía
                                    days.forEach(day => {
                                        const th = document.createElement('th');
                                        th.textContent = day;
                                        headerRow.appendChild(th);
                                    });
                                    hoursTable.appendChild(headerRow);

                                    // Rellenar la mini tabla con los días y horas
                                    times.forEach(time => {
                                        const tr = document.createElement('tr');
                                        const timeCell = document.createElement('td');
                                        timeCell.textContent = `${time.substring(0, 2)}:${time.substring(2)}`;
                                        tr.appendChild(timeCell);

                                        days.forEach(day => {
                                            const td = document.createElement('td');
                                            // Si existe la materia en ese día y hora, marcar como seleccionada
                                            if (subjects[semester][group][day] && subjects[semester][group][day][time] === subjectName) {
                                                td.classList.add('selected'); // Marcar en verde
                                                td.dataset.day = day; // Almacenar el día
                                                td.dataset.time = time; // Almacenar la hora
                                            }
                                            tr.appendChild(td);
                                        });

                                        hoursTable.appendChild(tr);
                                    });

                                    hoursCell.appendChild(hoursTable);

                                    row.appendChild(subjectCell);
                                    row.appendChild(semesterCell);
                                    row.appendChild(groupCell);
                                    row.appendChild(hoursCell);

                                    row.addEventListener('click', () => {
                                        // Primero verificar si las horas de la materia seleccionada se superponen con otro horario
                                        checkScheduleConflict(subjectName, semester, group, subjects).then(hasConflict => {
                                            if (hasConflict) {
                                                alert('El horario de la materia seleccionada ya está ocupado.');
                                                return; // No seguir con la asignación si hay conflicto
                                            }

                                            // Si no hay conflicto, entonces asignamos las horas de la materia
                                            assignAllHours(subjectName, semester, group, subjects);
                                        });
                                    });

                                    subjectBody.appendChild(row);
                                }
                            }
                        }
                    }
                }
            });
        }

        // Verificar si hay conflicto de horarios con el horario del profesor
        function checkScheduleConflict(subjectName, semester, group, subjects) {
            return new Promise(resolve => {
                const userScheduleRef = firebase.database().ref(`users/${firebase.auth().currentUser.uid}/horario`);
                let hasConflict = false;

                userScheduleRef.once('value').then(snapshot => {
                    const existingSchedule = snapshot.val() || {};

                    // Iterar sobre todos los días y horas del horario del profesor
                    const days = ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"];
                    const times = ["0700", "0745", "0830", "0915", "1030", "1115", "1200", "1245", "1330", "1415", "1500"];

                    days.forEach(day => {
                        times.forEach(time => {
                            if (existingSchedule[day] && existingSchedule[day][time] === subjectName) {
                                hasConflict = true;
                            }
                        });
                    });

                    resolve(hasConflict); // Devolver el resultado de la verificación
                });
            });
        }

        // Asignar todas las horas de la materia seleccionada
        function assignAllHours(subjectName, semester, group, subjects) {
            const userScheduleRef = firebase.database().ref(`users/${firebase.auth().currentUser.uid}/horario`);

            userScheduleRef.once('value').then(snapshot => {
                const existingSchedule = snapshot.val() || {};

                // Asignar la materia a todas las horas correspondientes
                const days = ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"];
                const times = ["0700", "0745", "0830", "0915", "1030", "1115", "1200", "1245", "1330", "1415", "1500"];

                days.forEach(day => {
                    times.forEach(time => {
                        if (subjects[semester][group][day] && subjects[semester][group][day][time] === subjectName) {
                            existingSchedule[day] = existingSchedule[day] || {};
                            existingSchedule[day][time] = subjectName;
                        }
                    });
                });

                userScheduleRef.set(existingSchedule);
                alert('Horario asignado exitosamente.');
            });
        }

        // Cargar materias al iniciar la página
        loadSubjects();
    </script>
</body>
</html>
