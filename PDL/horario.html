<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario de Materias</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 10px;
            text-align: center;
        }
        main {
            padding: 20px;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .schedule-table th, .schedule-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        .schedule-table th {
            background-color: #007bff;
            color: white;
        }
        .mini-table td {
            width: 40px;
            height: 40px;
            background-color: #f0f0f0;
        }
        .mini-table td.selected {
            background-color: #28a745;
        }
        .mini-table td:hover {
            cursor: pointer;
            background-color: #cce5ff;
        }
    </style>
</head>
<body>
    <header>
        <h1>Horario de Materias</h1>
    </header>
    <main>
        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Hora</th>
                    <th>Día</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Las materias se cargarán dinámicamente -->
            </tbody>
        </table>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const db = firebase.database();
            const currentUser = firebase.auth().currentUser;

            // Función para cargar materias
            function loadSubjects() {
                const subjectsRef = db.ref('users/' + currentUser.uid + '/horario');
                subjectsRef.once('value').then(snapshot => {
                    const horario = snapshot.val() || {};
                    const subjectBody = document.getElementById('subjectBody');
                    subjectBody.innerHTML = '';

                    // Generar tabla
                    for (const dia in horario) {
                        for (const hora in horario[dia]) {
                            const row = document.createElement('tr');
                            const materiaCell = document.createElement('td');
                            const horaCell = document.createElement('td');
                            const diaCell = document.createElement('td');
                            const actionCell = document.createElement('td');
                            const deleteButton = document.createElement('button');

                            materiaCell.textContent = horario[dia][hora] || '(Sin materia)';
                            horaCell.textContent = hora;
                            diaCell.textContent = dia;

                            deleteButton.textContent = 'Eliminar';
                            deleteButton.addEventListener('click', () => {
                                removeSubject(dia, hora);
                            });

                            actionCell.appendChild(deleteButton);
                            row.appendChild(materiaCell);
                            row.appendChild(horaCell);
                            row.appendChild(diaCell);
                            row.appendChild(actionCell);

                            subjectBody.appendChild(row);
                        }
                    }
                });
            }

            // Función para guardar materia
            function saveSubject(dia, hora, materia) {
                if (hora === "1000") {
                    alert("No puedes seleccionar esta hora porque está reservada para el receso.");
                    return;
                }

                const horarioRef = db.ref('users/' + currentUser.uid + '/horario/' + dia + '/' + hora);

                horarioRef.once('value').then(snapshot => {
                    if (snapshot.exists()) {
                        alert("Ya hay una materia registrada en este horario.");
                    } else {
                        horarioRef.set(materia).then(() => {
                            alert("Materia registrada con éxito.");
                            loadSubjects();
                        });
                    }
                });
            }

            // Función para eliminar materia
            function removeSubject(dia, hora) {
                const horarioRef = db.ref('users/' + currentUser.uid + '/horario/' + dia + '/' + hora);

                horarioRef.remove().then(() => {
                    alert("Materia eliminada.");
                    loadSubjects();
                });
            }

            // Función para inicializar el receso a las 10:00
            function initializeRecess() {
                const days = ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"];
                const updates = {};

                days.forEach(day => {
                    updates[`${day}/1000`] = "Receso";
                });

                const horarioRef = db.ref('users/' + currentUser.uid + '/horario');
                horarioRef.update(updates).then(() => {
                    console.log("Receso inicializado.");
                    loadSubjects();
                });
            }

            // Inicializar receso y cargar materias
            firebase.auth().onAuthStateChanged(user => {
                if (user) {
                    initializeRecess();
                    loadSubjects();
                } else {
                    console.error("No hay usuario autenticado.");
                }
            });
        });
    </script>
</body>
</html>
