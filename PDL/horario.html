<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Materias</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .schedule-table th, .schedule-table td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        .schedule-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .schedule-table td {
            background-color: #ffffff;
        }
        .hours-table {
            width: 100%;
            border: 1px solid #dddddd;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .hours-table th, .hours-table td {
            padding: 5px;
            border: 1px solid #dddddd;
            text-align: center;
        }
        .hours-table th {
            background-color: #f0f0f0;
        }
        .hours-table td {
            background-color: #ffffff;
        }
    </style>
</head>
<body>
    <header>
        <h1>Filtrar Materias y Asesorías</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <input type="text" id="searchBar" placeholder="Buscar materia, semestre o grupo...">

        <h2>Materias</h2>
        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horario</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Materias cargadas dinámicamente -->
            </tbody>
        </table>

        <h2>Asesorías</h2>
        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Asesoría</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horario</th>
                </tr>
            </thead>
            <tbody id="advisoryBody">
                <!-- Asesorías cargadas dinámicamente -->
            </tbody>
        </table>
    </main>

    <script>
        // Función para cargar datos de Firebase
        function loadSchedules() {
            const subjectRef = database.ref('classSchedules');
            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                renderTable(subjects, "subjectBody", "Materias");
                renderTable(subjects, "advisoryBody", "Asesorías"); // Puedes personalizar la fuente de datos para asesorías si es diferente
            }).catch(error => {
                console.error('Error al cargar las materias:', error);
            });
        }

        // Función para renderizar la tabla
        function renderTable(data, tableId, type) {
            const tableBody = document.getElementById(tableId);
            tableBody.innerHTML = '';
            for (const semester in data) {
                for (const group in data[semester]) {
                    for (const day in data[semester][group]) {
                        const schedule = {};
                        for (const hour in data[semester][group][day]) {
                            const subjectName = data[semester][group][day][hour];
                            if (type === "Asesorías" && subjectName !== "Asesoría") continue; // Filtrar solo asesorías
                            if (type === "Materias" && subjectName === "Asesoría") continue; // Filtrar solo materias
                            if (!schedule[day]) schedule[day] = [];
                            schedule[day].push(hour);
                        }

                        if (Object.keys(schedule).length > 0) {
                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td>${type === "Materias" ? "Materia" : "Asesoría"}</td>
                                <td>${semester}</td>
                                <td>${group}</td>
                                <td>${renderMiniTable(schedule)}</td>
                            `;
                            tableBody.appendChild(row);
                        }
                    }
                }
            }
        }

        // Función para renderizar la mini tabla
        function renderMiniTable(schedule) {
            const miniTable = document.createElement('table');
            miniTable.classList.add('hours-table');

            for (const day in schedule) {
                const row = document.createElement('tr');
                const dayCell = document.createElement('th');
                dayCell.textContent = day;
                row.appendChild(dayCell);

                schedule[day].sort().forEach(hour => {
                    const timeCell = document.createElement('td');
                    timeCell.textContent = `${hour.substring(0, 2)}:${hour.substring(2)}`;
                    row.appendChild(timeCell);
                });

                miniTable.appendChild(row);
            }
            return miniTable.outerHTML;
        }

        // Cargar horarios al iniciar
        window.onload = loadSchedules;
    </script>
</body>
</html>
