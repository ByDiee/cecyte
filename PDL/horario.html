<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Materias</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .schedule-table th, .schedule-table td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        .schedule-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .schedule-table td {
            background-color: #ffffff;
        }
        .schedule-table tr:nth-child(odd) td {
            background-color: #f9f9f9;
        }
        .schedule-table tr:hover {
            background-color: #7d7d7d;
            cursor: pointer;
        }
        #searchBar {
            margin-bottom: 20px;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            border: 1px solid #ccc;
        }
        .hours-table {
            width: 100%;
            border: 1px solid #dddddd;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .hours-table th, .hours-table td {
            padding: 5px;
            border: 1px solid #dddddd;
            text-align: center;
        }
        .hours-table th {
            background-color: #f0f0f0;
        }
        .hours-table td {
            background-color: #ffffff;
        }
        .hours-table td.selected {
            background-color: #dff0d8; /* green background for selected time */
        }
    </style>
</head>
<body>
    <header>
        <h1>Seleccionar Materias</h1>
    </header>
    <main>
        <input type="text" id="searchBar" placeholder="Buscar materia, semestre o grupo...">
        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                </tr>
            </thead>
            <tbody id="subjectBody"></tbody>
        </table>
    </main>
    <script>
        // Firebase config y autenticación
        const db = firebase.database();

        // Función para cargar materias
        function loadSubjects() {
            const subjectRef = db.ref('classSchedules');
            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                const subjectBody = document.getElementById('subjectBody');
                subjectBody.innerHTML = '';

                for (let semester in subjects) {
                    for (let group in subjects[semester]) {
                        for (let day in subjects[semester][group]) {
                            for (let hour in subjects[semester][group][day]) {
                                if (hour === "1000") continue; // Ignorar hora 10:00

                                const subjectName = subjects[semester][group][day][hour];
                                if (subjectName === "") continue;

                                const row = document.createElement('tr');
                                row.addEventListener('click', () => {
                                    selectSubject(subjectName, day, hour);
                                });

                                row.innerHTML = `
                                    <td>${subjectName}</td>
                                    <td>${semester}</td>
                                    <td>${group}</td>
                                `;
                                subjectBody.appendChild(row);
                            }
                        }
                    }
                }
            });
        }

        // Función para guardar la materia seleccionada
        function selectSubject(subjectName, day, hour) {
            const currentUser = firebase.auth().currentUser;
            if (currentUser) {
                const userRef = db.ref('users/' + currentUser.uid);

                userRef.once('value').then(snapshot => {
                    const userData = snapshot.val();

                    // Aseguramos que el horario del usuario exista
                    if (!userData.horario) {
                        userData.horario = {};
                    }
                    if (!userData.horario[day]) {
                        userData.horario[day] = {};
                    }

                    // Agregar "Receso" automáticamente a las 10:00 si no está
                    if (!userData.horario[day]["1000"]) {
                        userData.horario[day]["1000"] = "Receso";
                    }

                    // Guardar la materia seleccionada en el día y hora correspondiente
                    userData.horario[day][hour] = subjectName;

                    // Actualizar Firebase
                    userRef.set(userData)
                        .then(() => {
                            alert(`Materia "${subjectName}" guardada exitosamente en ${day} a las ${hour}.`);
                        })
                        .catch(error => {
                            console.error('Error al guardar:', error);
                        });
                });
            } else {
                alert("Por favor, inicia sesión para guardar la materia.");
            }
        }

        // Cargar materias al iniciar
        loadSubjects();
    </script>
</body>
</html>
