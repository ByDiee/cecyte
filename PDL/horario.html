<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horario del Profesor</title>
  <style>
    /* Estilos básicos para la tabla */
    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      text-align: center;
      border: 1px solid #ccc;
      cursor: pointer;
    }

    .hora {
      background-color: #f9f9f9;
    }

    /* Sombreado al pasar el mouse */
    .hora:hover {
      background-color: rgba(0, 255, 0, 0.3);
    }

    /* Color de fondo para las celdas seleccionadas */
    .seleccionada {
      background-color: rgba(0, 255, 0, 0.5);
    }
  </style>
</head>
<body>
  <h1>Horario del Profesor</h1>
  <table id="materias">
    <thead>
      <tr>
        <th>Lunes</th>
        <th>Martes</th>
        <th>Miércoles</th>
        <th>Jueves</th>
        <th>Viernes</th>
      </tr>
    </thead>
    <tbody>
      <!-- Ejemplo de materias y asesorías -->
      <tr>
        <td class="hora" data-dia="Lunes" data-hora="0700">Materia 1</td>
        <td class="hora" data-dia="Martes" data-hora="0700">Materia 2</td>
        <td class="hora" data-dia="Miércoles" data-hora="0700">Materia 3</td>
        <td class="hora" data-dia="Jueves" data-hora="0700">Asesorías</td>
        <td class="hora" data-dia="Viernes" data-hora="0700">Asesorías</td>
      </tr>
      <tr>
        <td class="hora" data-dia="Lunes" data-hora="0745">Materia 4</td>
        <td class="hora" data-dia="Martes" data-hora="0745">Materia 5</td>
        <td class="hora" data-dia="Miércoles" data-hora="0745">Materia 6</td>
        <td class="hora" data-dia="Jueves" data-hora="0745">Asesorías</td>
        <td class="hora" data-dia="Viernes" data-hora="0745">Asesorías</td>
      </tr>
      <!-- Más filas de horas si es necesario -->
    </tbody>
  </table>

  <script>
    // Selección de las celdas
    const celdas = document.querySelectorAll('.hora');
    let materiasSeleccionadas = [];

    // Función para manejar el hover (sombreado al pasar el mouse)
    celdas.forEach(celda => {
      celda.addEventListener('mouseover', () => {
        if (!celda.classList.contains('seleccionada')) {
          celda.style.backgroundColor = 'rgba(0, 255, 0, 0.3)'; // Sombreado ligero
        }
      });

      celda.addEventListener('mouseout', () => {
        if (!celda.classList.contains('seleccionada')) {
          celda.style.backgroundColor = ''; // Quitar sombreado
        }
      });
    });

    // Función para manejar el click (selección)
    celdas.forEach(celda => {
      celda.addEventListener('click', () => {
        if (celda.classList.contains('seleccionada')) {
          alert('Esta materia ya está cargada a esta hora.');
        } else {
          // Verificar si la materia ya está seleccionada en otra celda del mismo horario
          const dia = celda.dataset.dia;
          const hora = celda.dataset.hora;
          
          // Al seleccionar, se marca como seleccionada
          celda.classList.add('seleccionada');
          celda.style.backgroundColor = 'rgba(0, 255, 0, 0.5)';
          
          // Agregar la materia a la lista de materias seleccionadas
          materiasSeleccionadas.push({ dia, hora, materia: celda.innerText });

          // Confirmación para agregar al horario
          if (confirm('¿Deseas agregar esta materia al horario?')) {
            // Aquí se debe actualizar la base de datos, si se confirma la selección.
            console.log('Materia cargada:', celda.innerText);
          } else {
            // Si no se confirma, se puede quitar la selección
            celda.classList.remove('seleccionada');
            celda.style.backgroundColor = '';
          }
        }
      });
    });
  </script>
</body>
</html>
