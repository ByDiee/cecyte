<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Materias</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .schedule-table, .advisory-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .schedule-table th, .schedule-table td, .advisory-table th, .advisory-table td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        .schedule-table th, .advisory-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .schedule-table td, .advisory-table td {
            background-color: #ffffff;
        }
        .schedule-table tr:nth-child(odd) td, .advisory-table tr:nth-child(odd) td {
            background-color: #f9f9f9;
        }
        .schedule-table tr:hover, .advisory-table tr:hover {
            background-color: #7d7d7d;
            cursor: pointer;
        }
        #searchBar {
            margin-bottom: 20px;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            border: 1px solid #ccc;
        }
        .hours-table {
            width: 100%;
            border: 1px solid #dddddd;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .hours-table th, .hours-table td {
            padding: 5px;
            border: 1px solid #dddddd;
            text-align: center;
        }
        .hours-table th {
            background-color: #f0f0f0;
        }
        .hours-table td {
            background-color: #ffffff;
        }
        .hours-table td.selected {
            background-color: #dff0d8; /* green background for selected time */
        }
    </style>
</head>
<body>
    <header>
        <h1>Buscar Materias</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <input type="text" id="searchBar" placeholder="Buscar materia, semestre o grupo...">

        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horas</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Se cargan las materias desde Firebase -->
            </tbody>
        </table>

        <h2>Asesorías</h2>
        <table class="advisory-table">
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                </tr>
            </thead>
            <tbody id="advisoryBody">
                <!-- Se cargan las horas de asesorías -->
            </tbody>
        </table>
        <button id="confirmAdvisory" style="margin-top: 20px; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer;">Confirmar Asesoría</button>
    </main>

    <script>
        function loadSubjects() {
            const subjectRef = firebase.database().ref('classSchedules');
            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                const subjectBody = document.getElementById('subjectBody');
                subjectBody.innerHTML = '';

                const uniqueSubjects = {};

                for (let semester in subjects) {
                    for (let group in subjects[semester]) {
                        let scheduleMatrix = {};

                        for (let day in subjects[semester][group]) {
                            scheduleMatrix[day] = {};

                            for (let hour in subjects[semester][group][day]) {
                                const subjectName = subjects[semester][group][day][hour];
                                if (subjectName === "") continue; // Ignoramos recesos o materias sin nombre

                                if (!uniqueSubjects[subjectName]) {
                                    uniqueSubjects[subjectName] = {
                                        semester: semester,
                                        group: group,
                                        schedule: {}
                                    };
                                }

                                if (!uniqueSubjects[subjectName].schedule[day]) {
                                    uniqueSubjects[subjectName].schedule[day] = [];
                                }

                                uniqueSubjects[subjectName].schedule[day].push(hour);
                            }
                        }
                    }
                }

                for (const subjectName in uniqueSubjects) {
                    const data = uniqueSubjects[subjectName];

                    const row = document.createElement('tr');
                    const subjectCell = document.createElement('td');
                    const semesterCell = document.createElement('td');
                    const groupCell = document.createElement('td');
                    const hoursCell = document.createElement('td');

                    row.addEventListener('click', () => {
                        selectSubject(subjectName, data.semester, data.group, data.schedule);
                    });

                    subjectCell.textContent = subjectName;
                    semesterCell.textContent = data.semester;
                    groupCell.textContent = data.group;

                    const hoursTable = document.createElement('table');
                    hoursTable.classList.add('hours-table');

                    const days = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
                    const times = ["0700", "0745", "0830", "0915", "1000", "1030", "1115", "1200", "1245", "1330", "1415", "1500"];

                    const trHead = document.createElement('tr');
                    trHead.appendChild(document.createElement('th')); // Empty cell at the corner
                    days.forEach(day => {
                        const th = document.createElement('th');
                        th.textContent = day;
                        trHead.appendChild(th);
                    });
                    hoursTable.appendChild(trHead);

                    times.forEach(time => {
                        const tr = document.createElement('tr');
                        const tdTime = document.createElement('td');
                        tdTime.textContent = `${time.substring(0, 2)}:${time.substring(2)}`;
                        tr.appendChild(tdTime);

                        days.forEach(day => {
                            const td = document.createElement('td');
                            if (data.schedule[day] && data.schedule[day].includes(time)) {
                                td.textContent = subjectName;
                                td.style.backgroundColor = '#dff0d8'; // green background for selected time
                            }
                            tr.appendChild(td);
                        });

                        hoursTable.appendChild(tr);
                    });

                    hoursCell.appendChild(hoursTable);
                    row.appendChild(subjectCell);
                    row.appendChild(semesterCell);
                    row.appendChild(groupCell);
                    row.appendChild(hoursCell);

                    subjectBody.appendChild(row);
                }
            });
        }

        function selectSubject(subjectName, semester, group, schedule) {
            const currentUser = firebase.auth().currentUser;

            if (currentUser) {
                const userScheduleRef = firebase.database().ref(`users/${currentUser.uid}/horario`);

                // Check if the subject already exists in the user's schedule
                for (const day in schedule) {
                    for (const hour of schedule[day]) {
                        if (userScheduleRef.child(day).child(hour).exists()) {
                            alert(`La hora ${hour} del ${day} ya tiene una materia asignada.`);
                            return;
                        }
                    }
                }

                // Update the user's schedule in Firebase
                userScheduleRef.update(schedule).then(() => {
                    alert(`Materia ${subjectName} añadida a tu horario.`);
                }).catch(error => {
                    console.error(error);
                    alert("Hubo un error al añadir la materia.");
                });
            } else {
                alert("Debes estar autenticado para agregar materias.");
            }
        }

        document.getElementById('confirmAdvisory').addEventListener('click', () => {
            alert("Asesoría confirmada.");
        });

        window.onload = loadSubjects;
    </script>
</body>
</html>
