<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materias y Asesorías</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #d1e7dd;
            cursor: pointer;
        }
        .selected {
            background-color: #28a745 !important;
            color: white;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px 0;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <header>
        <h1>Materias y Asesorías</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <!-- Materias cargadas desde Firebase -->
        <h2>Materias Disponibles</h2>
        <table id="subjectsTable">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horario</th>
                    <th>Agregar al Horario</th>
                </tr>
            </thead>
            <tbody id="subjectsBody">
                <!-- Carga de materias aquí -->
            </tbody>
        </table>

        <!-- Tabla de asesorías -->
        <h2>Horario de Asesorías</h2>
        <table id="advisoryTable">
            <thead>
                <tr>
                    <th>Horas</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                </tr>
            </thead>
            <tbody id="advisoryBody">
                <!-- Asesorías aquí -->
            </tbody>
        </table>
        <button onclick="confirmAdvisory()">Confirmar Asesorías</button>
    </main>

    <script>
        const days = ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"];
        const hours = ["07:00", "07:45", "08:30", "09:15", "10:00", "10:45", "11:30", "12:15"];
        
        const database = firebase.database();

        // Cargar materias desde Firebase
        function loadSubjects() {
            const subjectRef = database.ref('classSchedules');
            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                const subjectsBody = document.getElementById('subjectsBody');
                subjectsBody.innerHTML = '';

                for (const semester in subjects) {
                    for (const group in subjects[semester]) {
                        const schedule = {};
                        for (const day in subjects[semester][group]) {
                            if (!schedule[day]) schedule[day] = [];
                            for (const hour in subjects[semester][group][day]) {
                                const subjectName = subjects[semester][group][day][hour];
                                if (!schedule[day].includes(hour)) schedule[day].push(hour);
                            }
                        }

                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${subjects[semester][group][days[0]][hours[0]] || 'Sin nombre'}</td>
                            <td>${semester}</td>
                            <td>${group}</td>
                            <td>
                                <table>
                                    <thead>
                                        <tr>${days.map(day => `<th>${day}</th>`).join('')}</tr>
                                    </thead>
                                    <tbody>
                                        <tr>${days.map(day => `<td>${(schedule[day] || []).join('<br>')}</td>`).join('')}</tr>
                                    </tbody>
                                </table>
                            </td>
                            <td><button onclick="addSubjectToSchedule('${semester}', '${group}')">Agregar</button></td>
                        `;
                        subjectsBody.appendChild(row);
                    }
                }
            });
        }

        // Crear tabla de asesorías
        function createAdvisoryTable() {
            const advisoryBody = document.getElementById('advisoryBody');
            advisoryBody.innerHTML = '';

            hours.forEach(hour => {
                const row = document.createElement('tr');
                row.innerHTML = `<td>${hour}</td>` + 
                    days.map(day => `<td onclick="toggleSelection(this)" data-day="${day}" data-hour="${hour}"></td>`).join('');
                advisoryBody.appendChild(row);
            });
        }

        // Seleccionar/desmarcar una celda
        function toggleSelection(cell) {
            cell.classList.toggle('selected');
        }

        // Confirmar asesorías seleccionadas
        function confirmAdvisory() {
            const selectedCells = document.querySelectorAll('.selected');
            const advisoryData = {};

            selectedCells.forEach(cell => {
                const day = cell.getAttribute('data-day');
                const hour = cell.getAttribute('data-hour');

                if (!advisoryData[day]) advisoryData[day] = [];
                advisoryData[day].push(hour);
            });

            const advisoryRef = database.ref(`users/admin/horario/asesorias`);
            advisoryRef.set(advisoryData);

            alert('Asesorías guardadas correctamente.');
        }

        // Inicializar tablas
        loadSubjects();
        createAdvisoryTable();
    </script>
</body>
</html>
