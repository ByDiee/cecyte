<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Tabla</title>
  <style>
    .mini-table {
      border-collapse: collapse;
      width: 100%;
    }
    .mini-table th, .mini-table td {
      border: 1px solid #ddd;
      text-align: center;
      padding: 8px;
    }
    .mini-table .highlight {
      background-color: #4caf50; /* Sombreado verde */
      cursor: pointer;
    }
  </style>
</head>
<body>
  <table class="mini-table" id="miniTable">
    <thead>
      <tr>
        <th>Hora</th>
        <th>Lunes</th>
        <th>Martes</th>
        <th>Miércoles</th>
        <th>Jueves</th>
        <th>Viernes</th>
      </tr>
    </thead>
    <tbody>
      <!-- Las celdas se generarán dinámicamente -->
    </tbody>
  </table>

  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth.js"></script>
  <script>
    // Configuración de Firebase (dejar como está)
    const firebaseConfig = {
      // Agregar tu configuración aquí
    };
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    // Obtener los datos de Firebase y generar la mini tabla
    const userId = "ICFZFW6trcVIVRC378DlNVK0B1r2"; // Usuario ejemplo (reemplazar si es necesario)
    const miniTableBody = document.querySelector('#miniTable tbody');

    db.ref('classSchedules').once('value', snapshot => {
      const data = snapshot.val();
      const hours = ["0700", "0745", "0830", "0915", "1000", "1030", "1115", "1200", "1245", "1330", "1415", "1500"];

      hours.forEach(hour => {
        const row = document.createElement('tr');
        const hourCell = document.createElement('td');
        hourCell.textContent = formatHour(hour);
        row.appendChild(hourCell);

        ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"].forEach(day => {
          const cell = document.createElement('td');
          const subject = getSubject(data, day, hour);

          if (subject && subject !== "RECESO") {
            cell.classList.add('highlight');
            cell.dataset.day = day;
            cell.dataset.hour = hour;
          }

          row.appendChild(cell);
        });

        miniTableBody.appendChild(row);
      });

      // Agregar evento a las celdas destacadas para cargar materias al horario
      document.querySelectorAll('.highlight').forEach(cell => {
        cell.addEventListener('click', () => {
          const day = cell.dataset.day;
          const hour = cell.dataset.hour;

          const newSubject = prompt("Ingresa el nombre de la materia que deseas agregar:");
          if (newSubject) {
            addSubjectToSchedule(userId, day, hour, newSubject);
            alert(`Materia "${newSubject}" agregada a ${day} a las ${formatHour(hour)}`);
          }
        });
      });
    });

    // Obtener el nombre de la materia según día y hora
    function getSubject(data, day, hour) {
      for (const semester in data) {
        for (const group in data[semester]) {
          const subject = data[semester][group][day]?.[hour];
          if (subject) return subject;
        }
      }
      return null;
    }

    // Agregar materia al horario del profesor
    function addSubjectToSchedule(userId, day, hour, subject) {
      const refPath = `users/${userId}/horario/${day}/${hour}`;
      db.ref(refPath).set(subject);
    }

    // Formatear horas de "HHMM" a "HH:mm"
    function formatHour(hour) {
      return `${hour.slice(0, 2)}:${hour.slice(2)}`;
    }
  </script>
</body>
</html>
