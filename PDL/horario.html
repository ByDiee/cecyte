<body>
    <header>
        <h1>Buscar Materias</h1>
    </header>
    <nav>
        <a href="perfilalu.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <input type="text" id="searchBar" placeholder="Buscar materia, semestre o grupo...">
        <button id="addCustomSubjectBtn" style="margin-top: 10px; background-color: #007bff; color: white; border: none; padding: 10px;">Agregar Asesorías</button>

        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horas</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Se cargan las materias desde Firebase -->
            </tbody>
        </table>

        <!-- Modal para agregar Asesorías -->
        <div id="customSubjectModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; box-shadow: 0px 4px 8px rgba(0,0,0,0.2);">
            <h2>Agregar Asesorías</h2>
            <p>Selecciona los días y las horas:</p>
            <table class="hours-table">
                <thead>
                    <tr>
                        <th>Días</th>
                        <th>0700</th>
                        <th>0745</th>
                        <th>0830</th>
                        <th>0915</th>
                        <th>1000</th>
                        <th>1030</th>
                        <th>1115</th>
                        <th>1200</th>
                        <th>1245</th>
                        <th>1330</th>
                        <th>1415</th>
                        <th>1500</th>
                    </tr>
                </thead>
                <tbody id="customSubjectTableBody">
                    <!-- Se generan filas para cada día -->
                </tbody>
            </table>
            <button id="saveCustomSubjectBtn" style="margin-top: 10px; background-color: #28a745; color: white; border: none; padding: 10px;">Guardar Asesorías</button>
            <button id="closeCustomSubjectBtn" style="margin-top: 10px; background-color: #dc3545; color: white; border: none; padding: 10px;">Cancelar</button>
        </div>
    </main>

    <script>
        // Mostrar modal para agregar Asesorías
        const addCustomSubjectBtn = document.getElementById('addCustomSubjectBtn');
        const customSubjectModal = document.getElementById('customSubjectModal');
        const saveCustomSubjectBtn = document.getElementById('saveCustomSubjectBtn');
        const closeCustomSubjectBtn = document.getElementById('closeCustomSubjectBtn');
        const customSubjectTableBody = document.getElementById('customSubjectTableBody');

        const days = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
        const times = ["0700", "0745", "0830", "0915", "1000", "1030", "1115", "1200", "1245", "1330", "1415", "1500"];

        // Generar la tabla para seleccionar días y horas
        function generateCustomSubjectTable() {
            customSubjectTableBody.innerHTML = '';
            for (const day of days) {
                const tr = document.createElement('tr');
                const dayCell = document.createElement('td');
                dayCell.textContent = day;
                tr.appendChild(dayCell);

                for (const time of times) {
                    const td = document.createElement('td');
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.value = `${day}-${time}`;
                    td.appendChild(checkbox);
                    tr.appendChild(td);
                }

                customSubjectTableBody.appendChild(tr);
            }
        }

        // Mostrar el modal
        addCustomSubjectBtn.addEventListener('click', () => {
            generateCustomSubjectTable();
            customSubjectModal.style.display = 'block';
        });

        // Cerrar el modal
        closeCustomSubjectBtn.addEventListener('click', () => {
            customSubjectModal.style.display = 'none';
        });

        // Guardar Asesorías en el horario
        saveCustomSubjectBtn.addEventListener('click', () => {
            const userId = firebase.auth().currentUser.uid;
            const scheduleRef = database.ref(`users/${userId}/horario`);
            const selectedSchedule = {};

            // Recopilar las selecciones
            customSubjectTableBody.querySelectorAll('input[type="checkbox"]:checked').forEach(checkbox => {
                const [day, time] = checkbox.value.split('-');
                if (!selectedSchedule[day]) {
                    selectedSchedule[day] = [];
                }
                selectedSchedule[day].push(time);
            });

            // Guardar en Firebase
            scheduleRef.once('value').then(snapshot => {
                const currentSchedule = snapshot.val() || {};

                // Agregar Asesorías
                for (const day in selectedSchedule) {
                    if (!currentSchedule[day]) {
                        currentSchedule[day] = {};
                    }
                    for (const time of selectedSchedule[day]) {
                        currentSchedule[day][time] = 'Asesorías';
                    }
                }

                // Actualizar la base de datos
                scheduleRef.set(currentSchedule).then(() => {
                    alert('Asesorías agregadas con éxito');
                    customSubjectModal.style.display = 'none';
                    window.location.reload(); // Recargar la página
                }).catch(error => {
                    console.error('Error al guardar las asesorías:', error);
                    alert('Ocurrió un error al guardar las asesorías.');
                });
            });
        });
    </script>
</body>
