<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Materias</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .schedule-table th, .schedule-table td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        .schedule-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .schedule-table tr:nth-child(odd) td {
            background-color: #f9f9f9;
        }
        .schedule-table tr:hover {
            background-color: #7d7d7d;
            cursor: pointer;
        }
        #searchBar {
            margin-bottom: 20px;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <header>
        <h1>Buscar Materias</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <input type="text" id="searchBar" placeholder="Buscar materia, semestre o grupo...">

        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horas</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Se cargan las materias desde Firebase -->
            </tbody>
        </table>
    </main>

    <script>
        // Cargar materias desde Firebase
        function loadSubjects() {
            const subjectRef = firebase.database().ref('classSchedules');
            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                const subjectBody = document.getElementById('subjectBody');
                subjectBody.innerHTML = '';

                for (let semester in subjects) {
                    for (let group in subjects[semester]) {
                        for (let day in subjects[semester][group]) {
                            for (let hour in subjects[semester][group][day]) {
                                const subjectName = subjects[semester][group][day][hour];
                                if (!subjectName || hour === "1000") continue; // Ignorar materias vacías y la hora de receso

                                const row = document.createElement('tr');
                                row.classList.add('subject-row');

                                row.innerHTML = `
                                    <td>${subjectName}</td>
                                    <td>${semester}</td>
                                    <td>${group}</td>
                                    <td>${day} ${hour.substring(0, 2)}:${hour.substring(2)}</td>
                                `;

                                row.addEventListener('click', () => {
                                    saveToSchedule(subjectName, day, hour);
                                });

                                subjectBody.appendChild(row);
                            }
                        }
                    }
                }
            });
        }

        // Guardar materia seleccionada en el horario del usuario
        function saveToSchedule(subjectName, day, hour) {
            const currentUser = firebase.auth().currentUser;

            if (!currentUser) {
                alert('Por favor inicia sesión.');
                return;
            }

            if (hour === "1000") {
                alert("No se pueden asignar materias a las 10:00.");
                return;
            }

            const userScheduleRef = firebase.database().ref(`users/${currentUser.uid}/horario`);

            userScheduleRef.once('value').then(snapshot => {
                const existingSchedule = snapshot.val() || {};

                // Verificar si ya hay una materia asignada en la misma hora/día
                if (existingSchedule[day] && existingSchedule[day][hour]) {
                    alert(`Ya tienes una materia asignada el ${day} a las ${hour.substring(0, 2)}:${hour.substring(2)}.`);
                    return;
                }

                // Guardar la materia en Firebase
                if (!existingSchedule[day]) {
                    existingSchedule[day] = {};
                }

                existingSchedule[day][hour] = subjectName;

                userScheduleRef.set(existingSchedule)
                    .then(() => {
                        alert('Materia asignada con éxito.');
                        window.location.href = 'pagina1.html'; // Redirigir a la página principal
                    })
                    .catch(error => {
                        alert('Error al guardar la materia: ' + error.message);
                    });
            });
        }

        // Inicializar carga de materias
        loadSubjects();
    </script>
</body>
</html>
