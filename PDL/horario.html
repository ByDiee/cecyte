<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Materias</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .schedule-table th, .schedule-table td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        .schedule-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .schedule-table td {
            background-color: #ffffff;
        }
        .schedule-table tr:nth-child(odd) td {
            background-color: #f9f9f9;
        }
        .schedule-table tr:hover {
            background-color: #7d7d7d; /* Sombreado cuando se pasa el ratón */
            cursor: pointer;
        }
        .hours-table {
            width: 100%;
            border: 1px solid #dddddd;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .hours-table th, .hours-table td {
            padding: 5px;
            border: 1px solid #dddddd;
            text-align: center;
        }
        .hours-table th {
            background-color: #f0f0f0;
        }
        .hours-table td {
            background-color: #ffffff;
            cursor: pointer;
        }
        .hours-table td.selected {
            background-color: #28a745; /* Verde para selección */
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>Buscar Materias</h1>
    </header>
    <nav>
        <a href="perfilalu.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <input type="text" id="searchBar" placeholder="Buscar materia, semestre o grupo...">

        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horas</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Se cargan las materias desde Firebase -->
            </tbody>
        </table>

        <!-- Sección para agregar Asesorías -->
        <h2>Asignar Asesorías</h2>
        <div id="advisorySection">
            <table class="hours-table" id="advisorySchedule">
                <thead>
                    <tr>
                        <th>Día/Hora</th>
                        <th>07:00</th>
                        <th>07:45</th>
                        <th>08:30</th>
                        <th>09:15</th>
                        <th>10:00</th>
                        <th>10:30</th>
                        <th>11:15</th>
                        <th>12:00</th>
                        <th>12:45</th>
                        <th>13:30</th>
                        <th>14:15</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>Lunes</td></tr>
                    <tr><td>Martes</td></tr>
                    <tr><td>Miércoles</td></tr>
                    <tr><td>Jueves</td></tr>
                    <tr><td>Viernes</td></tr>
                </tbody>
            </table>
            <button id="saveAdvisory" onclick="saveAdvisory()">Guardar Asesorías</button>
        </div>
    </main>

    <script>
        // Seleccionar celdas en la mini tabla interactiva
        document.querySelectorAll("#advisorySchedule td").forEach(cell => {
            if (cell.textContent !== "") { // Evitar la selección de las celdas de los días
                cell.addEventListener("click", () => {
                    cell.classList.toggle("selected");
                });
            }
        });

        // Función para guardar asesorías en Firebase
        function saveAdvisory() {
            const userId = firebase.auth().currentUser.uid; // Usuario actual
            const advisorySchedule = {};
            const days = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];

            document.querySelectorAll("#advisorySchedule tbody tr").forEach((row, index) => {
                const day = days[index];
                advisorySchedule[day] = [];

                row.querySelectorAll("td").forEach((cell, hourIndex) => {
                    if (cell.classList.contains("selected")) {
                        advisorySchedule[day].push(hourIndex); // Guardar las horas seleccionadas
                    }
                });
            });

            // Guardar las asesorías en Firebase
            firebase.database().ref(`users/${userId}/asesorias`).set(advisorySchedule)
                .then(() => alert("Asesorías guardadas exitosamente"))
                .catch(error => console.error("Error al guardar asesorías:", error));
        }

        // Función para cargar materias desde Firebase
        function loadSubjects() {
            const subjectRef = firebase.database().ref('classSchedules');
            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                const subjectBody = document.getElementById('subjectBody');
                subjectBody.innerHTML = '';

                const uniqueSubjects = {};

                for (let semester in subjects) {
                    for (let group in subjects[semester]) {
                        for (let day in subjects[semester][group]) {
                            for (let hour in subjects[semester][group][day]) {
                                const subjectName = subjects[semester][group][day][hour];
                                
                                if (!uniqueSubjects[subjectName]) {
                                    uniqueSubjects[subjectName] = { semester, group, schedule: {} };
                                }

                                if (!uniqueSubjects[subjectName].schedule[day]) {
                                    uniqueSubjects[subjectName].schedule[day] = [];
                                }

                                uniqueSubjects[subjectName].schedule[day].push(hour);
                            }
                        }
                    }
                }

                for (const subjectName in uniqueSubjects) {
                    const data = uniqueSubjects[subjectName];

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${subjectName}</td>
                        <td>${data.semester}</td>
                        <td>${data.group}</td>
                        <td>${JSON.stringify(data.schedule)}</td>
                    `;
                    subjectBody.appendChild(row);
                }
            }).catch(error => console.error('Error al cargar materias:', error));
        }

        window.onload = loadSubjects;
    </script>
</body>
</html>
