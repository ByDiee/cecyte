<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materias y Asesorías</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #d1e7dd;
            cursor: pointer;
        }
        .selected {
            background-color: #28a745 !important;
            color: white;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px 0;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <header>
        <h1>Materias y Asesorías</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <!-- Materias cargadas desde Firebase -->
        <h2>Materias Disponibles</h2>
        <table id="subjectsTable">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horario</th>
                    <th>Agregar al Horario</th>
                </tr>
            </thead>
            <tbody id="subjectsBody">
                <!-- Carga de materias aquí -->
            </tbody>
        </table>

        <!-- Tabla de asesorías -->
        <h2>Horario de Asesorías</h2>
        <table id="advisoryTable">
            <thead>
                <tr>
                    <th>Horas</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                </tr>
            </thead>
            <tbody id="advisoryBody">
                <!-- Asesorías aquí -->
            </tbody>
        </table>
        <button onclick="confirmAdvisory()">Confirmar Asesorías</button>
    </main>

    <script>
        // Cargar materias desde Firebase
        firebase.database().ref('materias/3/F').once('value').then(snapshot => {
            const materias = snapshot.val();
            const tablaMaterias = document.getElementById('subjectsBody'); // Aquí debe coincidir el id con el HTML

            // Verifica si 'materias' tiene datos
            if (!materias) {
                console.log('No se encontraron materias');
                return;
            }

            // Recorrer los días de la semana
            for (let dia in materias) {
                const filaDia = document.createElement('tr');
                const celdaDia = document.createElement('td');
                celdaDia.setAttribute('colspan', '2');
                celdaDia.textContent = dia;
                filaDia.appendChild(celdaDia);
                tablaMaterias.appendChild(filaDia);

                // Recorrer las horas de cada día
                for (let hora in materias[dia]) {
                    const materia = materias[dia][hora];

                    // Omitir las materias sin nombre (vacías)
                    if (materia === "") continue;

                    const filaMateria = document.createElement('tr');
                    const celdaHora = document.createElement('td');
                    const celdaMateria = document.createElement('td');

                    // Formatear la hora para que se muestre como hh:mm
                    const horaFormateada = `${hora.slice(0, 2)}:${hora.slice(2)}`;

                    celdaHora.textContent = horaFormateada;
                    celdaMateria.textContent = materia;

                    filaMateria.appendChild(celdaHora);
                    filaMateria.appendChild(celdaMateria);
                    tablaMaterias.appendChild(filaMateria);
                }
            }
        }).catch(error => {
            console.error('Error al cargar las materias:', error);
        });

        // Función para agregar una asesoría (guarda directamente en el horario)
        function agregarAsesoria(dia, hora, materia) {
            const horarioRef = firebase.database().ref('materias/3/F/' + dia + '/' + hora);
            horarioRef.set(materia, error => {
                if (error) {
                    alert('Error al agregar la asesoría.');
                } else {
                    alert('Asesoría agregada con éxito.');
                }
            });
        }
    </script>
</body>
</html>
