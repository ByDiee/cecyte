<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materias Disponibles</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .schedule-table th, .schedule-table td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        .schedule-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .mini-table {
            border: 1px solid #ccc;
            margin: 0 auto;
            width: 100%;
        }
        .mini-table th, .mini-table td {
            border: 1px solid #ddd;
            padding: 5px;
            text-align: center;
            font-size: 12px;
        }
        .schedule-table tr:hover {
            background-color: #f1f1f1;
            cursor: pointer;
        }
        #searchBar {
            margin-bottom: 20px;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <header>
        <h1>Buscar y Agregar Materias</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <input type="text" id="searchBar" placeholder="Buscar materia, semestre o grupo...">
        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Días y Horas</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Las materias se cargarán aquí -->
            </tbody>
        </table>
    </main>

    <script>

        // Cargar materias desde Firebase
        function loadSubjects() {
            const subjectRef = database.ref('classSchedules');
            const subjectBody = document.getElementById('subjectBody');

            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                subjectBody.innerHTML = ''; // Limpiar la tabla

                for (let semester in subjects) {
                    for (let group in subjects[semester]) {
                        const groupData = subjects[semester][group];

                        for (let day in groupData) {
                            for (let hour in groupData[day]) {
                                const subjectName = groupData[day][hour];

                                // Verificar si ya existe una fila para esta materia, semestre y grupo
                                let existingRow = Array.from(subjectBody.rows).find(row => 
                                    row.cells[0].textContent === subjectName &&
                                    row.cells[1].textContent === semester &&
                                    row.cells[2].textContent === group
                                );

                                if (!existingRow) {
                                    // Crear una nueva fila si no existe
                                    const row = document.createElement('tr');
                                    row.innerHTML = `
                                        <td>${subjectName}</td>
                                        <td>${semester}</td>
                                        <td>${group}</td>
                                        <td class="mini-table-cell"></td>
                                        <td><button onclick="addToSchedule('${subjectName}', '${semester}', '${group}')">Agregar</button></td>
                                    `;
                                    subjectBody.appendChild(row);
                                    existingRow = row;
                                }

                                // Añadir día y hora a la mini tabla
                                const miniTableCell = existingRow.querySelector('.mini-table-cell');
                                if (!miniTableCell.querySelector('table')) {
                                    const miniTable = document.createElement('table');
                                    miniTable.classList.add('mini-table');
                                    miniTable.innerHTML = `
                                        <thead>
                                            <tr>
                                                <th>Día</th>
                                                <th>Hora</th>
                                            </tr>
                                        </thead>
                                        <tbody></tbody>
                                    `;
                                    miniTableCell.appendChild(miniTable);
                                }

                                const miniTableBody = miniTableCell.querySelector('tbody');
                                const newRow = document.createElement('tr');
                                newRow.innerHTML = `<td>${day}</td><td>${hour}</td>`;
                                miniTableBody.appendChild(newRow);
                            }
                        }
                    }
                }
            });
        }

        // Agregar materia al horario del profesor
        function addToSchedule(subjectName, semester, group) {
            const userId = firebase.auth().currentUser.uid;
            const scheduleRef = database.ref(`users/${userId}/horario`);

            scheduleRef.once('value').then(snapshot => {
                const currentSchedule = snapshot.val() || {};

                // Validar que no haya conflictos
                const conflicts = Object.keys(currentSchedule).some(day => 
                    currentSchedule[day] && Object.keys(currentSchedule[day]).some(hour => 
                        currentSchedule[day][hour] === subjectName
                    )
                );

                if (conflicts) {
                    alert("Ya tienes esta materia en tu horario o hay un conflicto de horarios.");
                    return;
                }

                // Guardar la materia en el horario
                const updates = {};
                updates[`/${semester}/${group}`] = subjectName;
                scheduleRef.update(updates).then(() => {
                    alert("Materia agregada exitosamente.");
                });
            });
        }

        window.onload = loadSubjects;
    </script>
</body>
</html>
