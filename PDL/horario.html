<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Materias</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .schedule-table, .advisory-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .schedule-table th, .schedule-table td, .advisory-table th, .advisory-table td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        .schedule-table th, .advisory-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .schedule-table td, .advisory-table td {
            background-color: #ffffff;
        }
        .schedule-table tr:nth-child(odd) td, .advisory-table tr:nth-child(odd) td {
            background-color: #f9f9f9;
        }
        .schedule-table tr:hover, .advisory-table tr:hover {
            background-color: #7d7d7d;
            cursor: pointer;
        }
        #searchBar {
            margin-bottom: 20px;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            border: 1px solid #ccc;
        }
        .hours-table {
            width: 100%;
            border: 1px solid #dddddd;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .hours-table th, .hours-table td {
            padding: 5px;
            border: 1px solid #dddddd;
            text-align: center;
        }
        .hours-table th {
            background-color: #f0f0f0;
        }
        .hours-table td {
            background-color: #ffffff;
        }
        .hours-table td.selected {
            background-color: #dff0d8; /* green background for selected time */
        }
    </style>
</head>
<body>
    <header>
        <h1>Buscar Materias</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <input type="text" id="searchBar" placeholder="Buscar materia, semestre o grupo...">

        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horas</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Se cargan las materias desde Firebase -->
            </tbody>
        </table>

        <h2>Asesorías</h2>
        <table class="advisory-table">
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                </tr>
            </thead>
            <tbody id="advisoryBody">
                <!-- Se cargan las horas de asesorías -->
            </tbody>
        </table>
        <button id="confirmAdvisory" style="margin-top: 20px; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer;">Confirmar Asesoría</button>
    </main>

    <script>
        // Filtrar materias y permitir selección de fila
        function loadSubjects() {
            const subjectRef = firebase.database().ref('classSchedules');
            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                const subjectBody = document.getElementById('subjectBody');
                subjectBody.innerHTML = '';
    
                const uniqueSubjects = {};
    
                for (let semester in subjects) {
                    for (let group in subjects[semester]) {
                        for (let day in subjects[semester][group]) {
                            for (let hour in subjects[semester][group][day]) {
                                const subjectName = subjects[semester][group][day][hour];
                                if (!subjectName || hour === "1000") continue; // Ignorar materias vacías y la hora 10:00
    
                                if (!uniqueSubjects[subjectName]) {
                                    uniqueSubjects[subjectName] = {
                                        semester: semester,
                                        group: group,
                                        schedule: {}
                                    };
                                }
    
                                if (!uniqueSubjects[subjectName].schedule[day]) {
                                    uniqueSubjects[subjectName].schedule[day] = [];
                                }
    
                                uniqueSubjects[subjectName].schedule[day].push(hour);
                            }
                        }
                    }
                }
    
                for (const subjectName in uniqueSubjects) {
                    const data = uniqueSubjects[subjectName];
    
                    const row = document.createElement('tr');
                    row.classList.add('subject-row');
                    const subjectCell = document.createElement('td');
                    const semesterCell = document.createElement('td');
                    const groupCell = document.createElement('td');
                    const hoursCell = document.createElement('td');
    
                    row.addEventListener('click', () => {
                        selectSubject(row, subjectName, data);
                    });
    
                    subjectCell.textContent = subjectName;
                    semesterCell.textContent = data.semester;
                    groupCell.textContent = data.group;
    
                    const hoursTable = document.createElement('table');
                    hoursTable.classList.add('hours-table');
    
                    const days = ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"];
                    const times = ["0700", "0745", "0830", "0915", "1030", "1115", "1200", "1245", "1330", "1415", "1500"];
    
                    const trHead = document.createElement('tr');
                    trHead.appendChild(document.createElement('th')); // Empty cell at the corner
                    days.forEach(day => {
                        const th = document.createElement('th');
                        th.textContent = day;
                        trHead.appendChild(th);
                    });
                    hoursTable.appendChild(trHead);
    
                    times.forEach(time => {
                        const tr = document.createElement('tr');
                        const tdTime = document.createElement('td');
                        tdTime.textContent = `${time.substring(0, 2)}:${time.substring(2)}`;
                        tr.appendChild(tdTime);
    
                        days.forEach(day => {
                            const td = document.createElement('td');
                            if (data.schedule[day] && data.schedule[day].includes(time)) {
                                td.textContent = subjectName;
                                td.style.backgroundColor = '#dff0d8'; // verde para materia seleccionada
                            }
                            tr.appendChild(td);
                        });
    
                        hoursTable.appendChild(tr);
                    });
    
                    hoursCell.appendChild(hoursTable);
                    row.appendChild(subjectCell);
                    row.appendChild(semesterCell);
                    row.appendChild(groupCell);
                    row.appendChild(hoursCell);
    
                    subjectBody.appendChild(row);
                }
            });
        }
    
        // Selección de la fila de materia
        function selectSubject(row, subjectName, data) {
            const allRows = document.querySelectorAll('.subject-row');
            allRows.forEach(r => r.classList.remove('selected'));
    
            row.classList.add('selected');
    
            document.getElementById('confirmAdvisory').addEventListener('click', () => {
                const currentUser = firebase.auth().currentUser;
    
                if (currentUser) {
                    const selectedCells = row.querySelectorAll('td');
                    const selectedTime = selectedCells[0].textContent; // Asumiendo que la hora se extrae de la celda correspondiente
    
                    if (selectedTime === "10:00") {
                        alert("No se pueden asignar materias a las 10:00.");
                        return;
                    }
    
                    const userScheduleRef = firebase.database().ref(`users/${currentUser.uid}/horario`);
                    userScheduleRef.once('value').then(snapshot => {
                        const existingSchedule = snapshot.val() || {};
    
                        if (existingSchedule[selectedTime]) {
                            alert(`Ya tienes una materia asignada a las ${selectedTime}.`);
                        } else {
                            userScheduleRef.child(selectedTime).set(subjectName).then(() => {
                                alert('Horario confirmado y guardado.');
                            }).catch(error => {
                                alert('Error al guardar el horario: ' + error.message);
                            });
                        }
                    });
                } else {
                    alert('Por favor inicia sesión.');
                }
            });
        }
    
        loadSubjects();
    </script>    
</body>
</html>
