<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Materias</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .schedule-table th, .schedule-table td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        .schedule-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .schedule-table td {
            background-color: #ffffff;
        }
        .schedule-table tr:nth-child(odd) td {
            background-color: #f9f9f9;
        }
        .schedule-table tr:hover {
            background-color: #7d7d7d;
            cursor: pointer;
        }
        #searchBar {
            margin-bottom: 20px;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            border: 1px solid #ccc;
        }
        .hours-table {
            width: 100%;
            border: 1px solid #dddddd;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .hours-table th, .hours-table td {
            padding: 5px;
            border: 1px solid #dddddd;
            text-align: center;
        }
        .hours-table th {
            background-color: #f0f0f0;
        }
        .hours-table td {
            background-color: #ffffff;
        }
        .hour-selectable {
            background-color: #f2f2f2;
            cursor: pointer;
        }
        .hour-selectable.selected {
            background-color: #28a745;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>Buscar Materias</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <input type="text" id="searchBar" placeholder="Buscar materia, semestre o grupo...">

        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horas</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Se cargan las materias desde Firebase -->
            </tbody>
        </table>

        <!-- Tabla para seleccionar horarios personalizados de Asesorías -->
        <h2>Seleccionar horarios para "Asesorías"</h2>
        <table class="hours-table" id="advisoryTable">
            <thead>
                <tr>
                    <th>Día</th>
                    <th>0700</th>
                    <th>0745</th>
                    <th>0830</th>
                    <th>0915</th>
                    <th>1000</th>
                    <th>1030</th>
                    <th>1115</th>
                    <th>1200</th>
                    <th>1245</th>
                    <th>1330</th>
                    <th>1415</th>
                    <th>1500</th>
                </tr>
            </thead>
            <tbody id="advisoryBody">
                <!-- Se crean filas dinámicamente -->
            </tbody>
        </table>
        <button onclick="confirmAdvisorySchedule()">Confirmar Horarios de Asesorías</button>
    </main>

    <script>
        // Días y horas para la tabla de asesorías
        const days = ['Lunes', 'Martes', 'Miercoles', 'Jueves', 'Viernes'];
        const hours = ['0700', '0745', '0830', '0915', '1000', '1030', '1115', '1200', '1245', '1330', '1415', '1500'];

        // Crear la tabla de horarios seleccionables para Asesorías
        function createAdvisoryTable() {
            const advisoryBody = document.getElementById('advisoryBody');
            advisoryBody.innerHTML = '';

            days.forEach(day => {
                const row = document.createElement('tr');
                const dayCell = document.createElement('td');
                dayCell.textContent = day;
                row.appendChild(dayCell);

                hours.forEach(hour => {
                    const cell = document.createElement('td');
                    cell.classList.add('hour-selectable');
                    cell.textContent = hour;
                    cell.addEventListener('click', () => {
                        cell.classList.toggle('selected');
                    });
                    row.appendChild(cell);
                });

                advisoryBody.appendChild(row);
            });
        }

        // Confirmar selección de horarios para Asesorías
        function confirmAdvisorySchedule() {
            const selectedSchedule = {};
            const rows = document.querySelectorAll('#advisoryBody tr');

            rows.forEach(row => {
                const day = row.children[0].textContent;
                const cells = Array.from(row.children).slice(1);
                cells.forEach((cell, index) => {
                    if (cell.classList.contains('selected')) {
                        if (!selectedSchedule[day]) {
                            selectedSchedule[day] = [];
                        }
                        selectedSchedule[day].push(hours[index]);
                    }
                });
            });

            if (Object.keys(selectedSchedule).length === 0) {
                alert('No has seleccionado ningún horario.');
                return;
            }

            if (confirm('¿Deseas confirmar los horarios seleccionados para Asesorías?')) {
                saveSubjectToSchedule('Asesorías', 'N/A', 'N/A', selectedSchedule);
            }
        }

        // Lógica existente para guardar materias en el horario
        function saveSubjectToSchedule(subjectName, semester, group, schedule) {
            const userId = firebase.auth().currentUser.uid;
            const scheduleRef = firebase.database().ref(`users/${userId}/horario`);
            scheduleRef.once('value').then(snapshot => {
                const currentSchedule = snapshot.val() || {};
                for (const day in schedule) {
                    if (!currentSchedule[day]) {
                        currentSchedule[day] = {};
                    }
                    schedule[day].forEach(hour => {
                        currentSchedule[day][hour] = subjectName;
                    });
                }

                scheduleRef.set(currentSchedule).then(() => {
                    alert('Asesorías agregadas correctamente al horario.');
                    window.location.href = 'pagina1.html';
                }).catch(error => {
                    console.error('Error al guardar el horario:', error);
                });
            });
        }

        // Lógica para cargar materias existentes
        function loadSubjects() {
            const subjectRef = firebase.database().ref('classSchedules');
            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                const subjectBody = document.getElementById('subjectBody');
                subjectBody.innerHTML = '';

                // Lógica para procesar materias...
            }).catch(error => {
                console.error('Error al cargar las materias:', error);
            });
        }

        // Inicializar tabla de asesorías
        createAdvisoryTable();
        loadSubjects();
    </script>
</body>
</html>
