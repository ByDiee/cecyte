<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materias y Asesorías</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #d1e7dd;
            cursor: pointer;
        }
        .selected {
            background-color: #28a745 !important;
            color: white;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px 0;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <header>
        <h1>Materias y Asesorías</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <!-- Materias cargadas desde Firebase -->
        <h2>Materias Disponibles</h2>
        <table id="subjectsTable">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horario</th>
                    <th>Agregar al Horario</th>
                </tr>
            </thead>
            <tbody id="subjectsBody">
                <!-- Carga de materias aquí -->
            </tbody>
        </table>

        <!-- Tabla de asesorías -->
        <h2>Horario de Asesorías</h2>
        <table id="advisoryTable">
            <thead>
                <tr>
                    <th>Horas</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                </tr>
            </thead>
            <tbody id="advisoryBody">
                <!-- Asesorías aquí -->
            </tbody>
        </table>
        <button onclick="confirmAdvisory()">Confirmar Asesorías</button>
    </main>

    <script>
        // Referencia a la base de datos Firebase
        const dbRef = firebase.database().ref('classSchedules');  // Ruta correcta a la base de datos

        // Obtener el currentUserId del usuario autenticado
        const currentUserId = firebase.auth().currentUser.uid; // Obtener el ID del usuario autenticado

        // Cargar materias de Firebase
        dbRef.once('value').then(snapshot => {
            const data = snapshot.val();
            const subjectsBody = document.getElementById('subjectsBody');

            // Iterar sobre semestres y grupos
            for (const semester in data) {
                for (const group in data[semester]) {
                    const materias = data[semester][group];
                    
                    // Iterar sobre los días de la semana para cada materia
                    for (const day in materias) {
                        const row = document.createElement('tr');

                        // Crear fila para el día
                        const dayCell = document.createElement('td');
                        dayCell.setAttribute('colspan', '5');
                        dayCell.textContent = day;
                        row.appendChild(dayCell);
                        subjectsBody.appendChild(row);

                        // Crear mini tabla de horarios por materia
                        const miniTableCell = document.createElement('td');
                        const miniTable = document.createElement('table');
                        miniTable.setAttribute('border', '1');
                        miniTable.innerHTML = `
                            <thead>
                                <tr>
                                    <th>Lunes</th>
                                    <th>Martes</th>
                                    <th>Miércoles</th>
                                    <th>Jueves</th>
                                    <th>Viernes</th>
                                </tr>
                            </thead>
                            <tbody id="miniTableBody"></tbody>
                        `;
                        const miniTableBody = miniTable.querySelector('tbody');
                        
                        // Iterar sobre las horas para cada día y agregar a la mini tabla
                        for (const hour in materias[day]) {
                            const materialRow = document.createElement('tr');
                            const timeCell = document.createElement('td');
                            const subjectCell = document.createElement('td');

                            // Formatear la hora en formato hh:mm
                            const formattedTime = `${hour.slice(0, 2)}:${hour.slice(2)}`;

                            // Agregar hora y materia
                            timeCell.textContent = formattedTime;
                            subjectCell.textContent = materias[day][hour];
                            materialRow.appendChild(timeCell);
                            materialRow.appendChild(subjectCell);
                            miniTableBody.appendChild(materialRow);
                        }

                        // Agregar mini tabla a la celda
                        miniTableCell.appendChild(miniTable);
                        row.appendChild(miniTableCell);
                        subjectsBody.appendChild(row);
                    }
                }
            }
        });

        // Función para agregar materia al horario del usuario
        function addToSchedule(subject, day, hour) {
            const scheduleRef = firebase.database().ref('users/' + currentUserId + '/horario');

            // Obtener el horario actual del usuario
            scheduleRef.once('value', function(snapshot) {
                const currentSchedule = snapshot.val() || {};

                // Agregar la nueva materia y hora
                if (!currentSchedule[day]) {
                    currentSchedule[day] = [];
                }

                currentSchedule[day].push({ subject, hour });

                // Actualizar el horario en la base de datos
                scheduleRef.set(currentSchedule).then(() => {
                    alert('Materia agregada al horario');
                });
            });
        }

        // Función para confirmar y agregar asesoría
        function confirmAdvisory() {
            // Lógica para agregar asesorías seleccionadas
        }
    </script>
</body>
</html>
