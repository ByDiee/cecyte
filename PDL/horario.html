<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Materias</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .schedule-table th, .schedule-table td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        .schedule-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .schedule-table tr:nth-child(odd) td {
            background-color: #f9f9f9;
        }
        .schedule-table tr:hover {
            background-color: #7d7d7d;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>Buscar Materias</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Se cargan las materias desde Firebase -->
            </tbody>
        </table>
    </main>

    <script>
        // Referencia al usuario actual
        let currentUser;

        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                initializeRecess(user.uid);
                loadSubjects();
            } else {
                alert("Por favor, inicia sesión.");
                window.location.href = "login.html";
            }
        });

        // Agregar automáticamente "Receso" a las 10:00 para todos los días
        function initializeRecess(userId) {
            const days = ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"];
            const updates = {};

            days.forEach(day => {
                updates[`users/${userId}/horario/${day}/1000`] = "Receso";
            });

            firebase.database().ref().update(updates)
                .then(() => console.log("Recesos inicializados correctamente"))
                .catch(error => console.error("Error al inicializar los recesos:", error));
        }

        // Cargar materias desde Firebase y filtrarlas
        function loadSubjects() {
            const subjectRef = firebase.database().ref("classSchedules");
            subjectRef.once("value").then(snapshot => {
                const subjects = snapshot.val();
                const subjectBody = document.getElementById("subjectBody");
                subjectBody.innerHTML = "";

                for (let semester in subjects) {
                    for (let group in subjects[semester]) {
                        for (let day in subjects[semester][group]) {
                            for (let hour in subjects[semester][group][day]) {
                                if (hour === "1000") continue; // Filtrar materias a las 10:00

                                const subjectName = subjects[semester][group][day][hour];
                                if (subjectName === "") continue;

                                const row = document.createElement("tr");
                                row.addEventListener("click", () => selectSubject(subjectName, day, hour));

                                const subjectCell = document.createElement("td");
                                const semesterCell = document.createElement("td");
                                const groupCell = document.createElement("td");

                                subjectCell.textContent = subjectName;
                                semesterCell.textContent = semester;
                                groupCell.textContent = group;

                                row.appendChild(subjectCell);
                                row.appendChild(semesterCell);
                                row.appendChild(groupCell);

                                subjectBody.appendChild(row);
                            }
                        }
                    }
                }
            });
        }

        // Seleccionar una materia y guardarla en Firebase
        function selectSubject(subjectName, day, hour) {
            const scheduleRef = firebase.database().ref(`users/${currentUser.uid}/horario/${day}/${hour}`);
            scheduleRef.once("value").then(snapshot => {
                if (snapshot.exists()) {
                    alert("Este horario ya está ocupado. Por favor selecciona otro.");
                } else {
                    scheduleRef.set(subjectName)
                        .then(() => alert("Materia registrada correctamente."))
                        .catch(error => alert("Error al registrar la materia: " + error.message));
                }
            });
        }
    </script>
</body>
</html>
