<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Materias</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        /* Estilos */
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .schedule-table th, .schedule-table td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        .schedule-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .schedule-table tr:hover {
            background-color: #7d7d7d;
            cursor: pointer;
        }
        #searchBar {
            margin-bottom: 20px;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <header>
        <h1>Buscar Materias</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
        <a href="#">Editar Horario</a> <!-- Botón añadido -->
    </nav>
    <main>
        <input type="text" id="searchBar" placeholder="Buscar materia, semestre o grupo...">
        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horario</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Materias cargadas dinámicamente -->
            </tbody>
        </table>
    </main>

    <script>
        function loadSubjects() {
            const subjectRef = firebase.database().ref('classSchedules');
            subjectRef.once('value').then(snapshot => {
                const subjects = snapshot.val();
                const subjectBody = document.getElementById('subjectBody');
                subjectBody.innerHTML = ''; // Limpiar tabla

                const loadedSubjects = {};

                for (let semester in subjects) {
                    for (let group in subjects[semester]) {
                        for (let day in subjects[semester][group]) {
                            for (let hour in subjects[semester][group][day]) {
                                const subjectData = subjects[semester][group][day][hour];
                                if (!subjectData || hour === "1000" || hour === "1029" || subjectData === "asistencias") continue;

                                const subjectName = subjectData;
                                const subjectKey = `${subjectName}-${semester}-${group}`;
                                if (!loadedSubjects[subjectKey]) {
                                    loadedSubjects[subjectKey] = true;
                                    const row = document.createElement('tr');
                                    row.innerHTML = `
                                        <td>${subjectName}</td>
                                        <td>${semester}</td>
                                        <td>${group}</td>
                                        <td>${day} ${hour}</td>
                                    `;
                                    row.addEventListener('click', () => {
                                        assignAllHours(subjectName, semester, group);
                                    });
                                    subjectBody.appendChild(row);
                                }
                            }
                        }
                    }
                }
            });
        }

        function assignAllHours(subjectName, semester, group) {
            const currentUser = firebase.auth().currentUser;
            if (!currentUser) {
                alert('Por favor inicia sesión.');
                return;
            }
            const userScheduleRef = firebase.database().ref(`users/${currentUser.uid}/horario`);
            userScheduleRef.once('value').then(snapshot => {
                const schedule = snapshot.val() || {};
                const recesoAsignado = asignarReceso(schedule);

                for (let day of ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"]) {
                    schedule[day] = schedule[day] || {};
                    schedule[day]["0700"] = subjectName; // Ejemplo de asignación
                }

                userScheduleRef.set(schedule).then(() => {
                    alert('Horario actualizado con éxito.');
                    if (recesoAsignado) alert('Receso asignado automáticamente a las 10:00.');
                });
            });
        }

        function asignarReceso(schedule) {
            let recesoAsignado = false;
            for (let day of ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"]) {
                if (!schedule[day]?.["1000"]) {
                    schedule[day] = schedule[day] || {};
                    schedule[day]["1000"] = "Receso";
                    recesoAsignado = true;
                }
            }
            return recesoAsignado;
        }

        window.onload = function() {
            loadSubjects();
        };
    </script>
</body>
</html>
