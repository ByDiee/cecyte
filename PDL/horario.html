<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar Materias</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(odd) td {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #d4edda;
        }
        .hours-table td {
            cursor: pointer;
        }
        .hours-table td.selected {
            background-color: #28a745;
            color: white;
        }
        #saveAdvisory {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-top: 10px;
            cursor: pointer;
        }
        #saveAdvisory:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <header>
        <h1>Filtrar Materias</h1>
    </header>
    <nav>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="#">Registro de Asistencias</a>
    </nav>
    <main>
        <h2>Materias</h2>
        <table>
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Semestre</th>
                    <th>Grupo</th>
                    <th>Horas</th>
                </tr>
            </thead>
            <tbody id="subjectBody">
                <!-- Las materias se cargarán dinámicamente -->
            </tbody>
        </table>

        <h2>Asignar Asesorías</h2>
        <table class="hours-table">
            <thead>
                <tr>
                    <th>Día / Hora</th>
                    <th>07:00</th>
                    <th>07:45</th>
                    <th>08:30</th>
                    <th>09:15</th>
                    <th>10:00</th>
                    <th>10:30</th>
                    <th>11:15</th>
                    <th>12:00</th>
                    <th>12:45</th>
                    <th>13:30</th>
                    <th>14:15</th>
                </tr>
            </thead>
            <tbody id="advisoryBody">
                <tr><td>Lunes</td></tr>
                <tr><td>Martes</td></tr>
                <tr><td>Miércoles</td></tr>
                <tr><td>Jueves</td></tr>
                <tr><td>Viernes</td></tr>
            </tbody>
        </table>
        <button id="saveAdvisory">Guardar Asesorías</button>
    </main>
    <script>
        // Mini tabla interactiva: selección de celdas
        document.querySelectorAll(".hours-table td").forEach(cell => {
            cell.addEventListener("click", () => {
                cell.classList.toggle("selected");
            });
        });

        // Guardar asesorías en Firebase
        document.getElementById("saveAdvisory").addEventListener("click", () => {
            const advisoryData = {};
            const days = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];

            document.querySelectorAll(".hours-table tbody tr").forEach((row, index) => {
                const day = days[index];
                advisoryData[day] = [];

                row.querySelectorAll("td.selected").forEach((cell, hourIndex) => {
                    if (hourIndex > 0) { // Ignorar primera columna (Día)
                        advisoryData[day].push(cell.textContent);
                    }
                });
            });

            console.log("Asesorías seleccionadas:", advisoryData);
            // Aquí se guarda en Firebase si es necesario
        });

        // Cargar materias desde Firebase
        function loadSubjects() {
            const subjectBody = document.getElementById("subjectBody");
            const mockData = { // Simulación de datos de Firebase
                semester1: {
                    groupA: {
                        Lunes: {
                            "0700": "Matemáticas",
                            "0745": "Física",
                            "0830": "Química"
                        },
                        Martes: {
                            "0900": "Historia",
                            "1000": "Arte"
                        }
                    }
                }
            };

            subjectBody.innerHTML = ""; // Limpiar contenido anterior
            for (let semester in mockData) {
                for (let group in mockData[semester]) {
                    for (let day in mockData[semester][group]) {
                        for (let hour in mockData[semester][group][day]) {
                            const row = document.createElement("tr");
                            row.innerHTML = `
                                <td>${mockData[semester][group][day][hour]}</td>
                                <td>${semester}</td>
                                <td>${group}</td>
                                <td>${day} ${hour}</td>
                            `;
                            subjectBody.appendChild(row);
                        }
                    }
                }
            }
        }

        window.onload = loadSubjects;
    </script>
</body>
</html>
