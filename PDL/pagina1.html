<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero del Profesor</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background-color: #ff851b;
            padding: 10px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap; /* Permite que los elementos se ajusten en móviles */
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin: 5px;
            flex: 1 1 auto; /* Hace que los enlaces se adapten al espacio disponible */
            text-align: center;
        }

        main {
            padding: 20px;
        }

        .welcome {
            text-align: center;
            margin-bottom: 20px;
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
        }

        .schedule-table th, .schedule-table td {
            border: 1px solid #cccccc;
            padding: 8px;
            text-align: center;
            position: relative;
        }

        .schedule-table th {
            background-color: #f2f2f2;
        }

        .delete-btn {
            display: none;
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #ff4d4d;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            text-align: center;
            line-height: 20px;
            cursor: pointer;
        }

        .schedule-table td:hover .delete-btn {
            display: block;
        }

        @media screen and (max-width: 768px) {
            header {
                padding: 10px;
            }

            nav {
                flex-direction: column; /* Los enlaces se apilan en columnas */
                align-items: center; /* Centra los elementos */
            }

            nav a {
                margin: 10px 0; /* Agrega margen entre los enlaces */
                width: 100%; /* Los enlaces toman el 100% de la anchura disponible */
                text-align: center; /* Asegura que el texto esté centrado */
            }

            main {
                padding: 10px;
            }

            .schedule-table th, .schedule-table td {
                font-size: 14px; /* Ajusta el tamaño de la fuente en pantallas más pequeñas */
            }

            .delete-btn {
                width: 25px;
                height: 25px;
                font-size: 14px; /* Aumenta el tamaño del botón de eliminación para facilitar su uso en dispositivos móviles */
            }
        }

        @media screen and (max-width: 480px) {
            header {
                padding: 8px;
                font-size: 14px;
            }

            nav {
                flex-direction: column;
            }

            nav a {
                font-size: 14px;
            }

            .schedule-table th, .schedule-table td {
                font-size: 12px;
            }

            .delete-btn {
                width: 30px;
                height: 30px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Bienvenido</h1>
    </header>
    <main>
        <div class="schedule">
            <h3>Tu Horario</h3>
            <table class="schedule-table" id="scheduleTable">
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Lunes</th>
                        <th>Martes</th>
                        <th>Miércoles</th>
                        <th>Jueves</th>
                        <th>Viernes</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Los datos se llenarán con JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const database = firebase.database();

            firebase.auth().onAuthStateChanged((user) => {
                if (!user) {
                    window.location.href = 'login.html';
                } else {
                    const userId = user.uid;
                    localStorage.setItem("userId", userId);
                    fetchSchedule(userId);
                }
            });

            function fetchSchedule(userId) {
                const scheduleRef = database.ref('users/' + userId + '/horario');
                scheduleRef.once('value').then(snapshot => {
                    const schedule = snapshot.val();
                    const scheduleTableBody = document.getElementById('scheduleTable').getElementsByTagName('tbody')[0];
                    scheduleTableBody.innerHTML = '';

                    const times = ["0700", "0745", "0830", "0915", "1000", "1030", "1115", "1200", "1245", "1330", "1415", "1500"];
                    const days = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];

                    for (const time of times) {
                        const row = document.createElement('tr');
                        const timeCell = document.createElement('th');
                        timeCell.textContent = `${time.substring(0, 2)}:${time.substring(2)}`;
                        row.appendChild(timeCell);

                        for (const day of days) {
                            const cell = document.createElement('td');

                            if (time === "1000") {
                                cell.textContent = "RECESO";
                                cell.style.backgroundColor = "#f2f2f2";
                            } else {
                                const subject = schedule && schedule[day] && schedule[day][time];
                                if (subject) {
                                    // Buscar el grado y grupo en la base de datos de classSchedules
                                    findSubjectDetails(subject, time, day).then((subjectDetails) => {
                                        if (subjectDetails) {
                                            cell.textContent = `${subject} (${subjectDetails.grado}${subjectDetails.grupo})`;
                                        } else {
                                            // Si no se encuentra grado o grupo, solo mostrar la materia
                                            cell.textContent = subject;
                                        }
                                    });

                                    const deleteBtn = document.createElement('button');
                                    deleteBtn.textContent = 'X';
                                    deleteBtn.classList.add('delete-btn');
                                    deleteBtn.addEventListener('click', () => {
                                        console.log("Intentando eliminar:", subject);  // Debugging: Log to check subject name
                                        if (confirm(`¿Estás seguro de eliminar "${subject}" del horario?`)) {
                                            deleteAllInstancesOfSubject(userId, subject);
                                        }
                                    });
                                    cell.appendChild(deleteBtn);
                                }
                            }
                            row.appendChild(cell);
                        }
                        scheduleTableBody.appendChild(row);
                    }
                }).catch(error => {
                    console.error('Error al obtener el horario:', error);
                });
            }

            function findSubjectDetails(subjectName, time, day) {
                return new Promise((resolve, reject) => {
                    const classSchedulesRef = database.ref('classSchedules');
                    classSchedulesRef.once('value').then(snapshot => {
                        const classSchedules = snapshot.val();
                        let foundDetails = null;

                        for (const grado in classSchedules) {
                            for (const grupo in classSchedules[grado]) {
                                const daySchedule = classSchedules[grado][grupo][day];
                                if (daySchedule && daySchedule[time] === subjectName) {
                                    foundDetails = { grado, grupo };
                                    break;
                                }
                            }
                        }

                        resolve(foundDetails);
                    }).catch(error => {
                        reject(error);
                    });
                });
            }

            function deleteAllInstancesOfSubject(userId, subject) {
                const scheduleRef = database.ref('users/' + userId + '/horario');
                scheduleRef.once('value').then(snapshot => {
                    const schedule = snapshot.val();

                    for (const day in schedule) {
                        for (const time in schedule[day]) {
                            if (schedule[day][time] === subject) {
                                const subjectRef = scheduleRef.child(day + '/' + time);
                                subjectRef.remove();
                                console.log(`Materia eliminada: ${subject} - ${day} ${time}`);  // Debugging: Log to confirm deletion
                            }
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
