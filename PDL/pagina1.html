<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero del Profesor</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #ffffff;
        margin: 0;
        padding: 0;
    }

    header {
        background-color: #28a745;
        color: white;
        padding: 15px;
        text-align: center;
    }

    nav {
        background-color: #ff851b;
        padding: 10px;
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-weight: bold;
        margin: 5px 0;
    }

    main {
        padding: 20px;
    }

    .welcome {
        text-align: center;
        margin-bottom: 20px;
    }

    .schedule-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
    }

    .schedule-table th, .schedule-table td {
        border: 1px solid #cccccc;
        padding: 8px;
        text-align: center;
        position: relative;
    }

    .schedule-table th {
        background-color: #f2f2f2;
        font-size: 16px; /* Tamaño de fuente por defecto */
    }

    /* Ajustes específicos para la responsividad de los encabezados */
    .schedule-table th {
        white-space: nowrap;
        word-wrap: break-word;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* Estilos de la tabla y su contenido en dispositivos móviles */
    @media (max-width: 768px) {
        .schedule-table {
            font-size: 12px; /* Reducir el tamaño de fuente en dispositivos móviles */
        }

        .schedule-table th {
            font-size: 14px; /* Ajustar tamaño de fuente en encabezados */
            padding: 10px 5px;
            text-align: center;
        }

        nav {
            flex-direction: column;
        }

        nav a {
            margin: 5px 0;
        }

        .schedule-table td {
            padding: 5px; /* Reducir el padding de las celdas */
        }
    }

    @media (max-width: 480px) {
        /* Para dispositivos muy pequeños */
        .schedule-table {
            font-size: 10px; /* Reducir aún más el tamaño de fuente */
        }

        .schedule-table th {
            font-size: 12px; /* Ajustar aún más el tamaño de los encabezados */
            padding: 8px 4px;
        }

        .schedule-table td {
            padding: 4px; /* Reducir el padding aún más */
        }
    }
</style>
</head>
<body>
    <header>
        <h1>Bienvenido</h1>
    </header>
    <nav>
        <a href="qr.html">Generar QR</a>
        <a href="perfilmaestro.html">Editar Perfil</a>
        <a href="asistencias.html">Ver Asistencias</a>
        <a href="horario.html">Editar Horario</a>
    </nav>
    <main>
        <div class="welcome">
            <h2>Bienvenido a tu Dashboard</h2>
            <p>Gestiona tus clases y asistencias de manera eficiente.</p>
        </div>
        
        <!-- Tabla de Horario -->
        <div class="schedule">
            <h3>Tu Horario</h3>
            <table class="schedule-table" id="scheduleTable">
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Lunes</th>
                        <th>Martes</th>
                        <th>Miércoles</th>
                        <th>Jueves</th>
                        <th>Viernes</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- JavaScript poblará esta sección -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const database = firebase.database();

            firebase.auth().onAuthStateChanged((user) => {
                if (!user) {
                    window.location.href = 'login.html';
                } else {
                    const userId = user.uid;
                    localStorage.setItem("userId", userId);
                    fetchSchedule(userId);
                }
            });

            function fetchSchedule(userId) {
                const scheduleRef = database.ref(`users/${userId}/horario`);
                scheduleRef.once('value').then(snapshot => {
                    const schedule = snapshot.val();
                    const scheduleTableBody = document.getElementById('scheduleTable').getElementsByTagName('tbody')[0];
                    scheduleTableBody.innerHTML = '';

                    const times = ["0700", "0745", "0830", "0915", "1000", "1030", "1115", "1200", "1245", "1330", "1415", "1500"];
                    const days = ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"];

                    for (const time of times) {
                        const row = document.createElement('tr');
                        const timeCell = document.createElement('th');
                        timeCell.textContent = `${time.substring(0, 2)}:${time.substring(2)}`;
                        row.appendChild(timeCell);

                        for (const day of days) {
                            const cell = document.createElement('td');

                            if (time === "1000") {
                                cell.textContent = "RECESO";
                                cell.style.backgroundColor = "#f2f2f2";
                            } else {
                                const subject = schedule && schedule[day] && schedule[day][time];
                                if (subject) {
                                    cell.textContent = subject;

                                    const deleteBtn = document.createElement('button');
                                    deleteBtn.textContent = 'X';
                                    deleteBtn.classList.add('delete-btn');
                                    deleteBtn.addEventListener('click', () => {
                                        if (confirm(`¿Estás seguro de eliminar "${subject}" del horario?`)) {
                                            deleteAllInstancesOfSubject(userId, subject);
                                        }
                                    });
                                    cell.appendChild(deleteBtn);
                                }
                            }
                            row.appendChild(cell);
                        }
                        scheduleTableBody.appendChild(row);
                    }
                }).catch(error => {
                    console.error('Error al obtener el horario:', error);
                });
            }

            function deleteAllInstancesOfSubject(userId, subjectToDelete) {
                const scheduleRef = database.ref(`users/${userId}/horario`);
                scheduleRef.once('value').then(snapshot => {
                    const schedule = snapshot.val();
                    const updates = {};

                    for (const day in schedule) {
                        updates[day] = {};
                        for (const time in schedule[day]) {
                            if (schedule[day][time] === subjectToDelete) {
                                updates[day][time] = null;
                            } else {
                                updates[day][time] = schedule[day][time];
                            }
                        }
                    }

                    scheduleRef.update(updates).then(() => {
                        alert('Materia eliminada con éxito');
                        window.location.reload();
                    }).catch(error => {
                        console.error('Error al eliminar la materia:', error);
                    });
                }).catch(error => {
                    console.error('Error al obtener el horario:', error);
                });
            }
        });
    </script>
</body>
</html>
