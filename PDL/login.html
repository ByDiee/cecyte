<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js"></script>
</head>
<body>
    <h1>Iniciar Sesión</h1>
    <form id="login-form">
        <input type="email" id="email" placeholder="Correo electrónico" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button type="submit">Iniciar Sesión</button>
    </form>
    <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>

    <script>
        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAH6MvrHYih49lF9RY1mdi0L3JK9HFyIP0",
            authDomain: "pdlista-61c4d.firebaseapp.com",
            projectId: "pdlista-61c4d",
            storageBucket: "pdlista-61c4d.appspot.com",
            messagingSenderId: "449596760167",
            appId: "1:449596760167:web:dd667445d003c22f47f4c2",
            measurementId: "G-BDXFNR25C0",
            databaseURL: "https://pdlista-61c4d-default-rtdb.firebaseio.com/"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // Verificar si el usuario está registrado al cargar la página
        auth.onAuthStateChanged((user) => {
            if (user) {
                const userId = user.uid;
                database.ref('users/' + userId).once('value').then((snapshot) => {
                    if (!snapshot.exists()) {
                        // Si el usuario no existe, redirigir al registro
                        window.location.href = 'registro.html';
                    }
                });
            }
        });

        // Manejar el formulario de inicio de sesión
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    console.log('Inicio de sesión exitoso:', user);

                    // Verificar el rol del usuario en la base de datos
                    const userId = user.uid;
                    database.ref('users/' + userId).once('value').then((snapshot) => {
                        if (snapshot.exists()) {
                            const userData = snapshot.val();
                            if (userData.rol === 'admin') {
                                window.location.href = 'pagina1.html';
                            } else {
                                window.location.href = 'pagina2.html';
                            }
                        } else {
                            // Si el usuario no tiene datos, redirigir al registro
                            window.location.href = 'registro.html';
                        }
                    });
                })
                .catch((error) => {
                    if (error.code === 'auth/wrong-password') {
                        alert('Contraseña incorrecta. Por favor, inténtalo de nuevo.');
                    } else if (error.code === 'auth/user-not-found') {
                        alert('No existe una cuenta con este correo electrónico. Regístrate primero.');
                    } else if (error.code === 'auth/invalid-email') {
                        alert('El formato del correo electrónico es inválido.');
                    } else {
                        console.error('Error al iniciar sesión:', error.message);
                        alert('Error al iniciar sesión: ' + error.message);
                    }
                });
        });

        // Cerrar sesiones previas y limpiar almacenamiento
        auth.signOut().then(() => {
            console.log('Sesión cerrada en Firebase.');
        }).catch((error) => {
            console.error('Error al cerrar sesión:', error);
        });

        localStorage.clear();
        sessionStorage.clear();
        console.log('LocalStorage y SessionStorage limpios.');
    </script>
</body>
</html>
