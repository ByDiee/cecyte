<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
        }
        .form-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            width: 300px;
        }
        .form-container h2 {
            margin-bottom: 20px;
            color: #fff;
        }
        .form-container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }
        .form-container button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            background-color: #4caf50;
            color: #fff;
            cursor: pointer;
        }
        .form-container img {
            width: 40px;
            cursor: pointer;
        }
        .form-container p {
            color: #fff;
        }
        .form-container .register-link {
            margin-top: 15px;
            color: #fff;
            text-decoration: none;
            display: inline-block;
        }
        .form-container .register-link:hover {
            text-decoration: underline;
        }
        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Login</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button id="loginBtn">Login</button>
        <p>O inicia sesión con:</p>
        <img src="GoogleLogo.png" alt="Google Sign-In" id="googleSignInBtn">
        <a href="registro.html" class="register-link">¿Aún no tienes cuenta? Regístrate aquí</a>
        <div id="error-message" class="error-message"></div>
    </div>

    <!-- Firebase scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAH6MvrHYih49lF9RY1mdi0L3JK9HFyIP0",
            authDomain: "pdlista-61c4d.firebaseapp.com",
            projectId: "pdlista-61c4d",
            storageBucket: "pdlista-61c4d.appspot.com",
            messagingSenderId: "449596760167",
            appId: "1:449596760167:web:dd667445d003c22f47f4c2",
            measurementId: "G-BDXFNR25C0",
            databaseURL: "https://pdlista-61c4d-default-rtdb.firebaseio.com/"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Clear all sessions and storage
        auth.signOut().then(() => {
            console.log('All Firebase sessions closed.');
        }).catch((error) => {
            console.error('Error signing out:', error);
        });

        localStorage.clear();
        sessionStorage.clear();
        console.log('Local storage and session storage cleared.');

        // Login with Email and Password
        document.getElementById('loginBtn').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessageElement = document.getElementById('error-message');
            errorMessageElement.textContent = ''; // Clear any previous error message

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Redirect based on role
                    const user = userCredential.user;
                    window.location.href = 'pagina2.html'; // Assuming user has a 'student' role
                })
                .catch((error) => {
                    if (error.code === 'auth/user-not-found') {
                        // If no user found, redirect to the registration page
                        window.location.href = 'registro.html';
                    } else if (error.code === 'auth/wrong-password') {
                        // Show an error message for incorrect password
                        errorMessageElement.textContent = 'La contraseña es incorrecta.';
                    } else {
                        // For other errors, show a generic message
                        errorMessageElement.textContent = 'Hubo un error al intentar iniciar sesión.';
                    }
                    console.error('Login error:', error.message);
                });
        });

        // Login with Google
        document.getElementById('googleSignInBtn').addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => {
                    const user = result.user;
                    window.location.href = 'pagina2.html'; // Assuming user has a 'student' role
                })
                .catch((error) => {
                    console.error('Google authentication error:', error.message);
                });
        });
    </script>
</body>
</html>
