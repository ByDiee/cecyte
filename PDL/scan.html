<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escanear QR para Asistencia</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        #notification { margin-top: 20px; color: green; display: none; }
        #error { margin-top: 20px; color: red; display: none; }
        #expired { margin-top: 20px; color: red; display: none; }
        .simulation-container { margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Escanear QR para Asistencia</h1>

    <div class="simulation-container">
        <label for="simulated-day">Día simulado:</label>
        <select id="simulated-day">
            <option value="Lunes">Lunes</option>
            <option value="Martes">Martes</option>
            <option value="Miércoles">Miércoles</option>
            <option value="Jueves">Jueves</option>
            <option value="Viernes">Viernes</option>
        </select>

        <label for="simulated-time">Hora simulada (HH:MM):</label>
        <input id="simulated-time" type="time" value="07:56">
    </div>

    <video id="video" width="100%" height="auto" style="max-width: 600px;"></video>
    <canvas id="qr-canvas" style="display:none;"></canvas>
    <div id="notification">¡Asistencia registrada correctamente!</div>
    <div id="error">No se pudo registrar la asistencia.</div>
    <div id="expired">¡El código QR ha caducado!</div>

    <script>
        const MODULOS = [
            { inicio: 420, fin: 464, hora: "0700" }, // 07:00 - 07:44
            { inicio: 465, fin: 509, hora: "0745" }, // 07:45 - 08:29
            { inicio: 510, fin: 554, hora: "0830" }, // 08:30 - 09:14
            { inicio: 555, fin: 599, hora: "0915" }, // 09:15 - 09:59
            { inicio: 630, fin: 674, hora: "1030" }, // 10:30 - 11:14
        ];

        const video = document.getElementById('video');
        const canvas = document.getElementById('qr-canvas');
        const ctx = canvas.getContext('2d');
        const notification = document.getElementById('notification');
        const error = document.getElementById('error');
        const expired = document.getElementById('expired');

        const simulatedDayElement = document.getElementById("simulated-day");
        const simulatedTimeElement = document.getElementById("simulated-time");

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                requestAnimationFrame(scanQRCode);
            }).catch(err => console.error('Error al acceder a la cámara:', err));

        function scanQRCode() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, canvas.width, canvas.height);
                if (code) processQRCodeData(code.data);
            }
            requestAnimationFrame(scanQRCode);
        }

        async function processQRCodeData(data) {
            try {
                const qrData = JSON.parse(data);
                const { grado, grupo, materia, dia, hora, caducidad } = qrData;

                if (!grado || !grupo || !materia || !dia || !hora) {
                    console.error("Datos del QR incompletos.");
                    return;
                }

                const fechaActual = new Date();
                const diaSemana = simulatedDayElement.value; // Día simulado
                const horaActualMinutos = parseHoraSimulada(simulatedTimeElement.value); // Hora simulada

                const moduloActual = MODULOS.find(
                    m => horaActualMinutos >= m.inicio && horaActualMinutos <= m.fin
                );

                if (!moduloActual) {
                    console.log("No estás dentro de un módulo válido.");
                    return;
                }

                // Verifica caducidad
                if (caducidad) {
                    const tiempoCaducidad = new Date(caducidad);
                    if (fechaActual > tiempoCaducidad) {
                        expired.style.display = "block";
                        return;
                    }
                }

                firebase.auth().onAuthStateChanged(async user => {
                    if (user) {
                        const nombreAlumno = user.displayName || "Alumno desconocido";
                        const studentId = user.uid;
                        const fecha = fechaActual.toISOString().split('T')[0];

                        await registerAttendance(
                            grado,
                            grupo,
                            diaSemana,
                            hora,
                            fecha,
                            studentId,
                            nombreAlumno,
                            materia
                        );
                    } else {
                        console.log("Usuario no autenticado.");
                    }
                });
            } catch (error) {
                console.error("Error al procesar el QR:", error);
            }
        }

        async function registerAttendance(grado, grupo, dia, hora, fecha, studentId, nombre, materia) {
            try {
                const dbRef = firebase.database().ref(`asistencias/${fecha}/${dia}/${hora}/${materia}`);

                const snapshot = await dbRef.child(studentId).get();

                if (snapshot.exists()) {
                    console.log("Ya estás registrado.");
                    error.style.display = "block";
                    return;
                }

                const horaEscaneo = new Date().toLocaleTimeString("es-MX", { hour: '2-digit', minute: '2-digit' });
                await dbRef.child(studentId).set({
                    nombre: nombre,
                    horaEscaneo
                });

                notification.style.display = "block";
                setTimeout(() => notification.style.display = "none", 3000);
            } catch (error) {
                error.style.display = "block";
                console.error("Error al registrar la asistencia:", error);
            }
        }

        function parseHoraSimulada(hora) {
            const [hh, mm] = hora.split(':').map(Number);
            return hh * 60 + mm;
        }
    </script>
</body>
</html>
