<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escanear QR para Asistencia</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        #notification { margin-top: 20px; color: green; display: none; }
        #error { margin-top: 20px; color: red; display: none; }
        #expired { margin-top: 20px; color: red; display: none; }
        #already-registered { margin-top: 20px; color: orange; display: none; }
        .simulation-container { margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Escanear QR para Asistencia</h1>

    <div class="simulation-container">
        <label for="simulated-day">Día simulado:</label>
        <select id="simulated-day">
            <option value="Lunes">Lunes</option>
            <option value="Martes">Martes</option>
            <option value="Miércoles">Miércoles</option>
            <option value="Jueves">Jueves</option>
            <option value="Viernes">Viernes</option>
        </select>

        <label for="simulated-time">Hora simulada (HH:MM):</label>
        <input id="simulated-time" type="time" value="07:56">
    </div>

    <video id="video" width="100%" height="auto" style="max-width: 600px;"></video>
    <canvas id="qr-canvas" style="display:none;"></canvas>
    <div id="notification">¡Asistencia registrada correctamente!</div>
    <div id="error">No se pudo registrar la asistencia.</div>
    <div id="expired">¡El código QR ha caducado!</div>
    <div id="already-registered">¡Ya has registrado tu asistencia!</div>

    <script>
        const MODULOS = [
            { inicio: 420, fin: 464, hora: "0745" }, // 07:45 - 08:29
            { inicio: 465, fin: 509, hora: "0830" }, // 08:30 - 09:14
            { inicio: 510, fin: 554, hora: "0915" }, // 09:15 - 09:59
            { inicio: 555, fin: 599, hora: "1030" }, // 10:30 - 11:14
        ];

        const video = document.getElementById('video');
        const canvas = document.getElementById('qr-canvas');
        const ctx = canvas.getContext('2d');
        const notification = document.getElementById('notification');
        const error = document.getElementById('error');
        const expired = document.getElementById('expired');
        const alreadyRegistered = document.getElementById('already-registered');

        const simulatedDayElement = document.getElementById("simulated-day");
        const simulatedTimeElement = document.getElementById("simulated-time");

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                requestAnimationFrame(scanQRCode); // Inicia el escaneo cuando el video está listo
            }).catch(err => console.error('Error al acceder a la cámara:', err));

        function scanQRCode() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, canvas.width, canvas.height, {
                    inversionAttempts: "dontInvert",
                });

                if (code) {
                    const qrData = code.data; // Aquí tienes los datos del QR escaneado
                    console.log("QR escaneado:", qrData);
                    // Aquí puedes procesar los datos del QR como desees, por ejemplo, hacer la validación y registrar la asistencia
                    registerAttendance(qrData);
                } else {
                    requestAnimationFrame(scanQRCode); // Continúa escaneando
                }
            } else {
                requestAnimationFrame(scanQRCode); // Continúa escaneando
            }
        }

        function registerAttendance(qrData) {
            const qrParts = qrData.split(","); // Asumiendo que los datos están separados por coma
            const materia = qrParts[0];
            const grado = qrParts[1];
            const grupo = qrParts[2];
            const hora = qrParts[3];
            const dia = qrParts[4]; // Se extrae el día del QR

            console.log("Materia:", materia);
            console.log("Grado:", grado);
            console.log("Grupo:", grupo);
            console.log("Hora:", hora);
            console.log("Día:", dia);

            // Aquí recuperamos el usuario logueado para obtener su nombre completo
            const userId = firebase.auth().currentUser.uid;
            firebase.database().ref("users/" + userId).once("value", snapshot => {
                const userData = snapshot.val();
                const fullName = userData.firstName + " " + userData.lastNameP + " " + userData.lastNameM;
                console.log("Nombre del alumno:", fullName);

                // Verificación del tiempo de caducidad del QR (si existe)
                const qrExpiration = qrParts[5];  // Se asume que el tiempo de caducidad está en la 6ta posición
                if (qrExpiration) {
                    const currentTimestamp = new Date().getTime();
                    if (currentTimestamp > qrExpiration) {
                        expired.style.display = "block";
                        return; // No registrar asistencia si el QR ha caducado
                    }
                }

                // Verificar si la asistencia ya ha sido registrada
                const date = new Date().toLocaleDateString(); // Fecha actual
                firebase.database().ref("asistencias/" + date + "/" + dia + "/" + hora + "/" + materia + "/" + userId)
                    .once("value", snapshot => {
                        if (snapshot.exists()) {
                            alreadyRegistered.style.display = "block";
                            return; // No registrar asistencia si ya fue registrada
                        } else {
                            // Crear el objeto de datos para la asistencia
                            const attendanceData = {
                                horaEscaneo: new Date().toLocaleTimeString(), // Formato de hora
                                nombre: fullName,
                            };

                            // Subir los datos a Firebase según la nueva estructura
                            const currentDate = new Date().toLocaleDateString("es-ES").split('/').reverse().join('-'); // Fecha en formato AAAA-MM-DD
                            firebase.database().ref("asistencias/" + currentDate + "/" + dia + "/" + hora + "/" + materia + "/" + userId)
                                .set(attendanceData, (error) => {
                                    if (error) {
                                        console.error("Error al registrar asistencia:", error);
                                        error.style.display = "block";
                                    } else {
                                        console.log("Asistencia registrada correctamente");
                                        notification.style.display = "block";
                                    }
                                });
                        }
                    });
            });
        }
    </script>
</body>
</html>
