<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escanear QR para Asistencia</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        #notification { margin-top: 20px; color: green; display: none; }
        #error { margin-top: 20px; color: red; display: none; }
        #expired { margin-top: 20px; color: red; display: none; }
        #already-registered { margin-top: 20px; color: orange; display: none; }
        #not-belong { margin-top: 20px; color: red; display: none; }
    </style>
</head>
<body>
    <h1>Escanear QR para Asistencia</h1>
    <video id="video" width="100%" height="auto" style="max-width: 600px;"></video>
    <canvas id="qr-canvas" style="display:none;"></canvas>
    <div id="notification">¡Asistencia registrada correctamente!</div>
    <div id="error">No se pudo registrar la asistencia.</div>
    <div id="expired">¡El código QR ha caducado!</div>
    <div id="already-registered">¡Ya has registrado tu asistencia!</div>
    <div id="not-belong">¡No perteneces a este grado y grupo!</div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('qr-canvas');
        const ctx = canvas.getContext('2d');
        const notification = document.getElementById('notification');
        const error = document.getElementById('error');
        const expired = document.getElementById('expired');
        const alreadyRegistered = document.getElementById('already-registered');
        const notBelong = document.getElementById('not-belong');

        // Acceder a la cámara y comenzar a escanear el QR
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                requestAnimationFrame(scanQRCode); // Inicia el escaneo
            }).catch(err => console.error('Error al acceder a la cámara:', err));

        // Función para escanear el QR continuamente
        function scanQRCode() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, canvas.width, canvas.height, {
                    inversionAttempts: "dontInvert",
                });

                if (code) {
                    const qrData = code.data; // Datos del QR escaneado
                    console.log("QR escaneado:", qrData);
                    processQRData(qrData); // Procesa los datos del QR
                } else {
                    requestAnimationFrame(scanQRCode); // Continúa escaneando
                }
            } else {
                requestAnimationFrame(scanQRCode); // Continúa escaneando
            }
        }

        // Función para procesar los datos del QR
        function processQRData(qrData) {
            const qrParts = JSON.parse(qrData); // Se espera que el QR sea un JSON con los datos
            const { fecha, dia, hora, materia, semestre, grupo } = qrParts;

            // Obtener datos del usuario autenticado
            const userId = firebase.auth().currentUser.uid;
            firebase.database().ref("users/" + userId).once("value", snapshot => {
                const userData = snapshot.val();
                const userSemestre = userData.Semestre; // Obtiene el semestre del usuario
                const userGrupo = userData.Grupo; // Obtiene el grupo del usuario
                const fullName = `${userData.firstName} ${userData.lastNameP} ${userData.lastNameM}`;

                // Log de depuración para ver qué semestre y grupo está detectando el usuario
                console.log("Semestre del usuario:", userSemestre);
                console.log("Grupo del usuario:", userGrupo);
                console.log("Datos del QR: Semestre -", semestre, "Grupo -", grupo);

                // Comparar semestre y grupo del usuario con los del QR
                const userSemesterEquivalent = userSemestre.toString();
                const qrSemesterEquivalent = semestre ? semestre.toString() : '';

                console.log("Semestre del QR:", qrSemesterEquivalent);

                // Verificar si el usuario pertenece al mismo semestre y grupo
                if (userSemesterEquivalent !== qrSemesterEquivalent || userGrupo !== grupo) {
                    notBelong.style.display = "block"; // Muestra mensaje de error
                    console.log("¡El usuario no pertenece al grupo o semestre indicado en el QR!");
                    return; // No continuar con el proceso si no coincide
                }

                // Verificar si el QR tiene fecha de caducidad
                if (qrParts.caducidad) {
                    const currentTimestamp = Date.now();
                    if (currentTimestamp > qrParts.caducidad) {
                        expired.style.display = "block";
                        return; // No registrar asistencia si el QR ha caducado
                    }
                }

                // Verificar si ya se registró la asistencia
                const asistenciaRef = firebase.database().ref(`asistencias/${fecha}/${dia}/${hora}/${materia}/${userId}`);
                asistenciaRef.once("value", snapshot => {
                    if (snapshot.exists()) {
                        alreadyRegistered.style.display = "block";
                    } else {
                        // Registrar asistencia
                        const attendanceData = {
                            horaEscaneo: new Date().toLocaleTimeString("es-ES"),
                            nombre: fullName,
                        };

                        asistenciaRef.set(attendanceData, (error) => {
                            if (error) {
                                console.error("Error al registrar asistencia:", error);
                                error.style.display = "block";
                            } else {
                                console.log("Asistencia registrada correctamente");
                                notification.style.display = "block";
                            }
                        });
                    }
                });
            });
        }
    </script>
</body>
</html>
