<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escanear QR para Asistencia 1</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script> <!-- Este es tu archivo de autenticación -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        #qr-canvas { width: 100%; height: auto; }
        #notification { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Escanear QR para Asistencia</h1>
    <video id="video" width="100%" height="auto" style="max-width: 600px;"></video>
    <canvas id="qr-canvas" style="display:none;"></canvas>
    <div id="notification" style="display:none; color: green;">
        ¡Asistencia registrada correctamente!
    </div>

    <script>

        // Variables para el video y el canvas
        const video = document.getElementById('video');
        const canvas = document.getElementById('qr-canvas');
        const ctx = canvas.getContext('2d');
        const notification = document.getElementById('notification');

        // Acceder a la cámara del dispositivo móvil
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => {
                video.srcObject = stream;
                video.setAttribute('playsinline', true); // Necesario para Safari
                video.play();
                requestAnimationFrame(scanQRCode); // Iniciar escaneo
            }).catch(err => {
                console.error('Error al acceder a la cámara:', err);
            });

        // Función para escanear el QR
        function scanQRCode() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, canvas.width, canvas.height);

                if (code) {
                    // Si se detecta el QR, procesamos la información
                    processQRCodeData(code.data);
                }
            }
            requestAnimationFrame(scanQRCode); // Continuar escaneando
        }

        // Procesar la información del QR
        async function processQRCodeData(data) {
            try {
                const qrData = JSON.parse(data);
                console.log(qrData);  // Verificar qué datos están llegando del QR

                const { grado, grupo, materia, hora, fecha, studentId, alumnoNombre } = qrData;

                // Comprobar si los valores esenciales no son undefined
                if (!grado || !grupo || !materia || !hora || !fecha || !studentId || !alumnoNombre) {
                    console.error('Faltan datos esenciales en el QR:', qrData);
                    return; // Detener la ejecución si falta alguno de los datos necesarios
                }

                // Comprobar si el usuario está autenticado
                firebase.auth().onAuthStateChanged(async user => {
                    if (user) {
                        // Verificar si ya ha registrado asistencia para esta clase
                        await registerAttendance(user.uid, grado, grupo, materia, hora, fecha, alumnoNombre);
                    } else {
                        // Si no está autenticado, mostrar un mensaje
                        alert("Por favor, inicia sesión para registrar tu asistencia.");
                    }
                });
            } catch (error) {
                console.error('Error al procesar el QR:', error);
            }
        }

        // Registrar la asistencia en Firebase
        async function registerAttendance(studentId, grado, grupo, materia, hora, fecha, alumnoNombre) {
            try {
                // Referencia en Firebase para la clase, día, hora y fecha de asistencia
                const dbRef = firebase.database().ref(`classSchedules/${grado}/${grupo}/${materia}/asistencias/${fecha}`);
                
                // Verificar si el alumno ya ha registrado asistencia
                const snapshot = await dbRef.once('value');
                const asistencias = snapshot.val();

                // Si el alumno ya tiene una asistencia registrada, no registrar nuevamente
                if (asistencias && asistencias[studentId]) {
                    console.log('El alumno ya ha registrado su asistencia.');
                    return;
                }

                // Si no existe el registro, agregamos la asistencia
                const asistenciaData = {
                    [studentId]: {
                        nombre: alumnoNombre,
                        presente: true, // Puedes cambiar esto a 'false' si no está presente
                    }
                };

                // Actualizamos la base de datos con la nueva asistencia
                await dbRef.update(asistenciaData);

                // Mostrar notificación de éxito
                notification.style.display = 'block';
                setTimeout(() => {
                    notification.style.display = 'none';
                }, 3000);
            } catch (error) {
                console.error('Error al registrar la asistencia:', error);
            }
        }
    </script>
</body>
</html>
