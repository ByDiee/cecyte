<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escanear QR para Asistencia</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        #notification { margin-top: 20px; color: green; display: none; }
        #error { margin-top: 20px; color: red; display: none; }
        #expired { margin-top: 20px; color: red; display: none; }
        #already-registered { margin-top: 20px; color: orange; display: none; }
    </style>
</head>
<body>
    <h1>Escanear QR para Asistencia</h1>
    <video id="video" width="100%" height="auto" style="max-width: 600px;"></video>
    <canvas id="qr-canvas" style="display:none;"></canvas>
    <div id="notification">¡Asistencia registrada correctamente!</div>
    <div id="error">No se pudo registrar la asistencia.</div>
    <div id="expired">¡El código QR ha caducado!</div>
    <div id="already-registered">¡Ya has registrado tu asistencia!</div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('qr-canvas');
        const ctx = canvas.getContext('2d');
        const notification = document.getElementById('notification');
        const error = document.getElementById('error');
        const expired = document.getElementById('expired');
        const alreadyRegistered = document.getElementById('already-registered');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                requestAnimationFrame(scanQRCode);
            }).catch(err => console.error('Error al acceder a la cámara:', err));

        function scanQRCode() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, canvas.width, canvas.height, {
                    inversionAttempts: "dontInvert",
                });

                if (code) {
                    const qrData = code.data;
                    console.log("QR escaneado:", qrData);
                    processQRData(qrData);
                } else {
                    requestAnimationFrame(scanQRCode);
                }
            } else {
                requestAnimationFrame(scanQRCode);
            }
        }

        function processQRData(qrData) {
            const qrParts = JSON.parse(qrData); // Se espera un JSON en el QR
            const { fecha, hora, materia } = qrParts;

            // Calcular el día de la semana según la fecha actual
            const diasSemana = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
            const fechaActual = new Date();
            const dia = diasSemana[fechaActual.getDay()]; // Día actual (automático)

            // Obtener datos del usuario autenticado
            const userId = firebase.auth().currentUser.uid;
            firebase.database().ref("users/" + userId).once("value", snapshot => {
                const userData = snapshot.val();
                const fullName = `${userData.firstName} ${userData.lastNameP} ${userData.lastNameM}`;

                // Verificar si el QR tiene fecha de caducidad
                if (qrParts.caducidad) {
                    const currentTimestamp = Date.now();
                    if (currentTimestamp > qrParts.caducidad) {
                        expired.style.display = "block";
                        return; // No registrar asistencia si el QR ha caducado
                    }
                }

                // Verificar si ya se registró la asistencia
                const asistenciaRef = firebase.database().ref(`asistencias/${fecha}/${dia}/${hora}/${materia}/${userId}`);
                asistenciaRef.once("value", snapshot => {
                    if (snapshot.exists()) {
                        alreadyRegistered.style.display = "block";
                    } else {
                        // Registrar asistencia
                        const attendanceData = {
                            horaEscaneo: new Date().toLocaleTimeString("es-ES"),
                            nombre: fullName,
                        };

                        asistenciaRef.set(attendanceData, (error) => {
                            if (error) {
                                console.error("Error al registrar asistencia:", error);
                                error.style.display = "block";
                            } else {
                                console.log("Asistencia registrada correctamente");
                                notification.style.display = "block";
                            }
                        });
                    }
                });
            });
        }
    </script>
</body>
</html>
