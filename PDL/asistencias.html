<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperación de Asistencias</title>
</head>
<body>
    <h1>Asistencias por Hora</h1>

    <div id="horarios"></div>

    <script>
        // Simulación de los datos de Firebase (classSchedules)
        const classSchedules = {
            "1": {
                "A": {
                    "Martes": {
                        "0700": "Educación Física I",
                        "0745": "Cultura Digital I",
                        "0830": "La Materia y sus Interacciones",
                        "1000": "Receso", // Excluir en el rango de receso
                        "1030": "Matemáticas I",
                        "1115": "Historia",
                        "1200": "Lengua y Literatura",
                        "1245": "Cultura Digital II",
                        "1330": "Química",
                        "1415": "Física",
                        "1500": "Biología"
                    }
                }
            }
        };

        // Función para identificar la materia según el rango de hora
        function identificarMateriaPorHora(hora, dia, grado, grupo) {
            const horaInt = parseInt(hora, 10);
            
            // Verificar si existe clases para ese día
            const clases = classSchedules[grado] && classSchedules[grado][grupo] && classSchedules[grado][grupo][dia];
            if (!clases) {
                console.log(`No se encontraron clases para el día ${dia} en el grado ${grado}, grupo ${grupo}`);
                return;
            }

            // Excluir receso (10:00-10:30) y realizar la búsqueda dentro de los rangos
            if (horaInt >= 1000 && horaInt <= 1030) {
                console.log(`Hora ${horaInt} está en el rango de receso y no se procesará.`);
                return;
            }

            let materia = null;
            for (const horaClave in clases) {
                const horaClase = parseInt(horaClave, 10);
                
                // Definir el rango de 44 minutos para identificar la materia correcta
                if (horaInt >= horaClase && horaInt < horaClase + 45) {
                    materia = clases[horaClave]; // Si está dentro del rango, asigna la materia
                    break;
                }
            }

            return materia;
        }

        // Simulación de carga de datos y prueba
        function recuperarDatosAsistencias() {
            const grado = 1; // Ejemplo de grado
            const grupo = "A"; // Ejemplo de grupo
            const dia = "Martes"; // Ejemplo de día
            const horas = ["0700", "0745", "0830", "1000", "1030", "1115", "1200", "1245", "1330", "1415", "1500"];

            const divHorarios = document.getElementById('horarios');
            divHorarios.innerHTML = ''; // Limpiar el div de horarios antes de cargar los nuevos

            // Recorriendo las horas de clase
            for (const hora of horas) {
                const materia = identificarMateriaPorHora(hora, dia, grado, grupo);
                const materiaHTML = materia ? `La materia para las ${hora} es: ${materia}` : `No se encontró materia para el horario ${hora}`;
                console.log(materiaHTML);
                
                // Agregar al HTML el resultado de cada hora
                const p = document.createElement('p');
                p.textContent = materiaHTML;
                divHorarios.appendChild(p);
            }
        }

        // Llamamos a la función para probar el código al cargar la página
        window.onload = recuperarDatosAsistencias;
    </script>
</body>
</html>
