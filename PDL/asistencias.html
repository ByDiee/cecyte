<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Asistencias</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      color: #333;
    }
    h1 {
      color: #006400; /* Verde */
      text-align: center;
    }
    .container {
      margin: 20px auto;
      max-width: 800px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border: 1px solid #ddd;
    }
    th {
      background-color: #006400;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    .filters {
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .filters input,
    .filters select,
    .filters button {
      padding: 5px;
      font-size: 16px;
    }
    .filters button {
      background-color: #ff7f00;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .filters button:hover {
      background-color: #ff5700;
    }
  </style>
</head>
<body>
  <h1>Registros de Asistencias</h1>
  <div class="container">
    <!-- Filtros de fecha y materia -->
    <div class="filters">
      <div>
        <label for="fecha">Seleccionar Fecha: </label>
        <input type="date" id="fecha" />
      </div>
      <div>
        <label for="materia">Filtrar por Materia: </label>
        <select id="materia">
          <option value="all">Todas las Materias</option>
        </select>
      </div>
      <div>
        <button id="fetchRecords">Consultar</button>
      </div>
    </div>
    <!-- Contenedor para las asistencias -->
    <div id="asistenciasContainer">
      <!-- Aquí se mostrarán las asistencias -->
    </div>
  </div>

  <script>
    // Inicializar Firebase
    const db = firebase.database();

    // Obtener fecha actual en formato YYYY-MM-DD
    function obtenerFechaActual() {
      const hoy = new Date();
      const año = hoy.getFullYear();
      const mes = String(hoy.getMonth() + 1).padStart(2, "0");
      const dia = String(hoy.getDate()).padStart(2, "0");
      return `${año}-${mes}-${dia}`;
    }

    // Función para cargar asistencias
    async function cargarAsistencias(fecha) {
      const asistenciasContainer = document.getElementById("asistenciasContainer");
      const materiaSelect = document.getElementById("materia");
      asistenciasContainer.innerHTML = "<p>Cargando...</p>";
      materiaSelect.innerHTML = `<option value="all">Todas las Materias</option>`; // Reinicia las opciones

      try {
        const ref = db.ref(`asistencias/${fecha}`);
        const snapshot = await ref.once("value");
        const data = snapshot.val();

        if (!data) {
          asistenciasContainer.innerHTML = `<p>No se encontraron registros para la fecha ${fecha}.</p>`;
          return;
        }

        let html = "";
        const materias = new Set(); // Usamos un Set para guardar las materias disponibles

        for (const dia in data) {
          html += `<h3>Día: ${dia}</h3>`;
          for (const hora in data[dia]) {
            html += `<h4>Hora: ${hora}</h4>`;
            for (const materia in data[dia][hora]) {
              materias.add(materia); // Agregar materia al Set

              html += `<h5>Materia: ${materia}</h5>`;
              html += `
                <table>
                  <thead>
                    <tr>
                      <th>Nombre</th>
                      <th>Hora de Escaneo</th>
                    </tr>
                  </thead>
                  <tbody>
              `;

              for (const alumnoId in data[dia][hora][materia]) {
                const alumno = data[dia][hora][materia][alumnoId];
                html += `
                  <tr class="asistencia-row" data-materia="${materia}">
                    <td>${alumno.nombre || "Sin Nombre"}</td>
                    <td>${alumno.horaEscaneo || "Sin Hora"}</td>
                  </tr>
                `;
              }

              html += `
                  </tbody>
                </table>
              `;
            }
          }
        }

        asistenciasContainer.innerHTML = html;

        // Actualizar el select con las materias del día
        materias.forEach((materia) => {
          const option = document.createElement("option");
          option.value = materia;
          option.textContent = materia;
          materiaSelect.appendChild(option);
        });
      } catch (error) {
        console.error("Error cargando asistencias:", error);
        asistenciasContainer.innerHTML = "<p>Ocurrió un error al cargar los registros.</p>";
      }
    }

    // Función para filtrar por materia
    function filtrarPorMateria() {
      const materiaSeleccionada = document.getElementById("materia").value;
      const filas = document.querySelectorAll(".asistencia-row");

      filas.forEach((fila) => {
        const materia = fila.getAttribute("data-materia");
        if (materiaSeleccionada === "all" || materia === materiaSeleccionada) {
          fila.style.display = "";
        } else {
          fila.style.display = "none";
        }
      });
    }

    // Mostrar registros del día actual al cargar la página
    document.addEventListener("DOMContentLoaded", () => {
      const fechaActual = obtenerFechaActual();
      document.getElementById("fecha").value = fechaActual;
      cargarAsistencias(fechaActual);
    });

    // Consultar registros al seleccionar una fecha
    document.getElementById("fetchRecords").addEventListener("click", () => {
      const fechaSeleccionada = document.getElementById("fecha").value;
      if (fechaSeleccionada) {
        cargarAsistencias(fechaSeleccionada);
      } else {
        alert("Por favor, selecciona una fecha válida.");
      }
    });

    // Filtrar registros al seleccionar una materia
    document.getElementById("materia").addEventListener("change", filtrarPorMateria);
  </script>
</body>
</html>
