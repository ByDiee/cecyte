<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Asistencias</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="auth.js"></script> <!-- Aquí ya se maneja la autenticación -->
</head>
<body>
  <h1>Registro de Asistencias</h1>

  <!-- Filtros -->
  <div>
    <label for="fecha">Fecha:</label>
    <input type="date" id="fecha" value="2024-12-05">
    <button id="filterBtn">Filtrar</button>
  </div>

  <!-- Tabla de asistencia -->
  <table border="1" id="asistenciaTable">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Hora Escaneo</th>
        <th>Materia</th>
      </tr>
    </thead>
    <tbody>
      <!-- Aquí se llenarán las filas -->
    </tbody>
  </table>

  <script>
    // Referencia a la base de datos Firebase
    const dbRef = firebase.database().ref('classSchedules');
    const asistenciaTable = document.getElementById("asistenciaTable").getElementsByTagName('tbody')[0];
    const filterBtn = document.getElementById("filterBtn");

    // Función para obtener y mostrar los registros de asistencia
    const obtenerAsistencias = (fecha) => {
      console.log("Cargando datos de asistencia...");

      dbRef.once("value", (snapshot) => {
        // Limpiar la tabla antes de cargar nuevos datos
        asistenciaTable.innerHTML = '';

        const data = snapshot.val();
        if (data) {
          // Recorrer los grados, grupos y días
          for (const grado in data) {
            for (const grupo in data[grado]) {
              for (const dia in data[grado][grupo]) {
                const materias = data[grado][grupo][dia];
                if (materias.asistencias && materias.asistencias[fecha]) {
                  const registros = materias.asistencias[fecha];
                  // Recorrer los registros de asistencia
                  for (const alumnoId in registros) {
                    const registro = registros[alumnoId];
                    const nombre = registro.nombre;
                    const horaEscaneo = registro.horaEscaneo;

                    // Identificar la materia correspondiente
                    let materia = "";
                    for (const hora in materias) {
                      if (hora !== "asistencias" && isHoraInRange(hora, horaEscaneo)) {
                        materia = materias[hora];
                        break;
                      }
                    }

                    // Insertar los datos en la tabla
                    const row = asistenciaTable.insertRow();
                    row.innerHTML = `
                      <td>${nombre}</td>
                      <td>${horaEscaneo}</td>
                      <td>${materia}</td>
                    `;
                  }
                }
              }
            }
          }
        } else {
          console.log("No se encontraron datos.");
        }
      });
    };

    // Función para verificar si una hora está dentro de un rango de 44 minutos
    const isHoraInRange = (horaMateria, horaEscaneo) => {
      const horaInicio = parseInt(horaMateria.substring(0, 2)) * 60 + parseInt(horaMateria.substring(2, 4));
      const horaEscaneoMinutos = parseInt(horaEscaneo.substring(0, 2)) * 60 + parseInt(horaEscaneo.substring(2, 4));
      return horaEscaneoMinutos >= horaInicio && horaEscaneoMinutos < horaInicio + 44;
    };

    // Filtrar por fecha
    filterBtn.addEventListener("click", () => {
      const fecha = document.getElementById("fecha").value;
      console.log("Filtrando por fecha:", fecha);
      obtenerAsistencias(fecha);
    });

    // Cargar las asistencias por defecto al iniciar
    obtenerAsistencias("2024-12-05");
  </script>
</body>
</html>
