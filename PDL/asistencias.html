<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Asistencias</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="auth.js"></script> <!-- Tu configuración de Firebase -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      color: #333;
    }
    h1 {
      color: #006400; /* Verde */
      text-align: center;
    }
    .container {
      margin: 20px auto;
      max-width: 800px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border: 1px solid #ddd;
    }
    th {
      background-color: #006400;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    .date-picker {
      margin: 10px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .date-picker input {
      padding: 5px;
      font-size: 16px;
    }
    .date-picker button {
      margin-left: 10px;
      padding: 5px 10px;
      font-size: 16px;
      background-color: #ff7f00;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .date-picker button:hover {
      background-color: #ff5700;
    }
  </style>
</head>
<body>
  <h1>Registros de Asistencias</h1>
  <div class="container">
    <div class="date-picker">
      <label for="fecha">Seleccionar Fecha: </label>
      <input type="date" id="fecha" />
      <button id="fetchRecords">Consultar</button>
    </div>
    <div id="asistenciasContainer">
      <!-- Aquí se mostrarán las asistencias -->
    </div>
  </div>

  <script>
    // Inicializar Firebase
    const db = firebase.database();

    // Obtener fecha actual en formato YYYY-MM-DD
    function obtenerFechaActual() {
      const hoy = new Date();
      const año = hoy.getFullYear();
      const mes = String(hoy.getMonth() + 1).padStart(2, "0");
      const dia = String(hoy.getDate()).padStart(2, "0");
      return `${año}-${mes}-${dia}`;
    }

    // Cargar asistencias por fecha
    async function cargarAsistencias(fecha) {
      const asistenciasContainer = document.getElementById("asistenciasContainer");
      asistenciasContainer.innerHTML = "<p>Cargando...</p>";

      try {
        const ref = db.ref(`asistencias/${fecha}`);
        const snapshot = await ref.once("value");
        const data = snapshot.val();

        if (!data) {
          asistenciasContainer.innerHTML = `<p>No se encontraron registros para la fecha ${fecha}.</p>`;
          return;
        }

        // Construir la tabla
        let html = "";
        for (const hora in data) {
          html += `<h3>Hora: ${hora}</h3>`;
          for (const materia in data[hora]) {
            html += `<h4>Materia: ${materia}</h4>`;
            html += `
              <table>
                <thead>
                  <tr>
                    <th>Nombre</th>
                    <th>Hora de Escaneo</th>
                  </tr>
                </thead>
                <tbody>
            `;

            for (const alumnoId in data[hora][materia]) {
              const alumno = data[hora][materia][alumnoId];
              html += `
                <tr>
                  <td>${alumno.nombre}</td>
                  <td>${alumno.horaEscaneo}</td>
                </tr>
              `;
            }

            html += `
                </tbody>
              </table>
            `;
          }
        }

        asistenciasContainer.innerHTML = html;
      } catch (error) {
        console.error("Error cargando asistencias:", error);
        asistenciasContainer.innerHTML = "<p>Ocurrió un error al cargar los registros.</p>";
      }
    }

    // Mostrar registros del día actual al cargar la página
    document.addEventListener("DOMContentLoaded", () => {
      const fechaActual = obtenerFechaActual();
      document.getElementById("fecha").value = fechaActual;
      cargarAsistencias(fechaActual);
    });

    // Consultar registros al seleccionar una fecha
    document.getElementById("fetchRecords").addEventListener("click", () => {
      const fechaSeleccionada = document.getElementById("fecha").value;
      if (fechaSeleccionada) {
        cargarAsistencias(fechaSeleccionada);
      } else {
        alert("Por favor, selecciona una fecha válida.");
      }
    });
  </script>
</body>
</html>
